<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提案 A · 分頁延伸</title>
<!--
  提案 A：分頁延伸 — 專案模組五大資源原型
  圓展教育科技有限公司 · 營運工作台 v5
  依據 PLN-075 S1。單一自包含檔，無外部資源、無網路請求。
  視覺 token 取自 src/lib/theme/company-theme.ts 的 V5_PALETTES（BLACK / WHITE），
  字級、圓角、間距沿用 src/components/yuanzhan/v5/styles.ts 的既有慣例。

  ── 七條硬性約束在本檔的落點（搜尋 [約束N] 可定位）──
  [約束1] 視覺語言：:root token 表（本段下方）＋ .tabs/.card/.pill/.chip 全部對齊 v5
  [約束2] 「期」：#tab-plan 的 .cyc-bar 與 renderPlan()；資料在 DB.*.cycles
  [約束3] 收件匣＝真資料夾：DB folders 內 role:'inbox' 的那一列，與其他資料夾同一棵樹
  [約束4] 會議資料夾四屬性：renderMeetingDetail() 的 .mt-attrs；屬性存在 folder 上（meta）
  [約束5] internal 標示：visibility 欄位 ＋ .pill.int / .pill.cli ＋ 頁首可見性計數
  [約束6] de-facto 慣例：DB 內的資料夾與檔名全部取自 0_工作區 實測清單
  [約束7] LINE：#tab-chat 的 .src-tab.disabled，點擊只說明為何不可用
-->
<style>
/* ===================== [約束1] v5 token 表 ===================== */
:root{
  --bg:#0a0c0f; --surface:#111418; --surface-2:#161a20; --surface-3:#1d232b; --surface-4:#242b34;
  --border:#232931; --border-2:#333b45; --border-3:#465060;
  --text:#e9ecf1; --text-2:#99a2af; --text-3:#626b77;
  --pri:#6cb6ff; --pri-bg:#11212e; --pri-br:#2d5a7d; --pri-hover:#163044;
  --ok:#5fd09a; --ok-bg:#0f2620;
  --warn:#f2b95e; --warn-bg:#2a2111;
  --danger:#ef8a82; --danger-bg:#2b1614; --danger-br:#5d2b26;
  --info:#a78bf5; --info-bg:#1c1830;
  --teal:#4fcfc0; --teal-bg:#0d2724;
  --gold:#e0b25a;
  --hover-overlay:rgba(255,255,255,.035);
  --on-pri:#07121b;
  --shadow:0 18px 44px rgba(0,0,0,.55);
  --scroll-thumb:#2a313a;
  --ag-over-bg:#2a1416; --ag-over-br:#5e2a2c; --ag-over-ink:#ff8a8c;
  --ag-doing-bg:#0f1726; --ag-doing-br:#2c3a5c; --ag-doing-ink:#4ea1ff;
  --ag-todo-bg:#161a20; --ag-todo-br:#333b45; --ag-todo-ink:#959fad;
  --ag-done-bg:#10221a; --ag-done-br:#2a4a3a; --ag-done-ink:#5fd09a;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --rail:78px; --rowpad:9px; --r:8px;
}
:root[data-theme="light"]{
  --bg:#ffffff; --surface:#f7f7f8; --surface-2:#f0f1f3; --surface-3:#e7e9ec; --surface-4:#dee1e6;
  --border:#e3e5e8; --border-2:#cfd3d8; --border-3:#aeb5bd;
  --text:#16181c; --text-2:#555b64; --text-3:#8a9099;
  --pri:#2563eb; --pri-bg:#eaf1fe; --pri-br:#bcd0f8; --pri-hover:#dbeafe;
  --ok:#15803d; --ok-bg:#e8f6ed;
  --warn:#b45309; --warn-bg:#fdf2e0;
  --danger:#dc2626; --danger-bg:#fdeaea; --danger-br:#f3b4b4;
  --info:#6d3fd4; --info-bg:#f0ebfd;
  --teal:#0f766e; --teal-bg:#e4f5f3;
  --gold:#a16207;
  --hover-overlay:rgba(0,0,0,.035);
  --on-pri:#ffffff;
  --shadow:0 14px 36px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
  --scroll-thumb:#cfd3d8;
  --ag-over-bg:#fdf6f4; --ag-over-br:#eed8d1; --ag-over-ink:#b0472d;
  --ag-doing-bg:#eff6ff; --ag-doing-br:#bfdbfe; --ag-doing-ink:#1d4ed8;
  --ag-todo-bg:#f4f4f6; --ag-todo-br:#e0e2e6; --ag-todo-ink:#5f6572;
  --ag-done-bg:#f1f8f4; --ag-done-br:#cfe4d8; --ag-done-ink:#15803d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--pri);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono)}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;position:sticky;top:0;height:100vh}
.rail-i{width:56px;padding:9px 0;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--text-3);font-size:10.5px;position:relative}
.rail-i:hover{background:var(--hover-overlay);color:var(--text-2)}
.rail-i.on{background:var(--pri-bg);color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri-br)}
.rail-i .bdg{position:absolute;top:3px;right:8px;min-width:15px;height:15px;border-radius:8px;background:var(--danger);
  color:var(--on-pri);font-size:9.5px;line-height:15px;font-weight:700;text-align:center;padding:0 3px}
.rail-sp{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- top ---------- */
.top{height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--border);
  background:var(--surface);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13.5px;white-space:nowrap}
.brand .sq{width:17px;height:17px;border-radius:5px;background:linear-gradient(135deg,var(--pri),var(--info))}
.brand .v{font-family:var(--mono);font-size:10.5px;color:var(--text-3);font-weight:400}
.topsearch{flex:1;max-width:560px;height:28px;border:1px solid var(--border-2);background:var(--surface-2);border-radius:7px;
  display:flex;align-items:center;gap:7px;padding:0 9px;color:var(--text-3);font-size:12px;min-width:0}
.topsearch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbd{margin-left:auto;font-family:var(--mono);font-size:9.5px;border:1px solid var(--border-2);border-radius:4px;padding:1px 4px;flex:0 0 auto}
.toprt{display:flex;align-items:center;gap:7px;margin-left:auto}
.who{display:flex;align-items:center;gap:6px;border:1px solid var(--border-2);border-radius:20px;padding:2px 9px 2px 3px;font-size:11.5px}
.av{width:20px;height:20px;border-radius:50%;background:#2b4a63;color:#9ecbf5;font-size:10.5px;display:flex;align-items:center;justify-content:center;font-weight:650}
:root[data-theme="light"] .av{background:#dbeafe;color:#1d4ed8}
.who .role{font-family:var(--mono);font-size:9.5px;color:var(--text-3)}
.tbtn{height:26px;padding:0 9px;border:1px solid var(--border-2);border-radius:6px;font-size:11.5px;color:var(--text-2);background:var(--surface-2)}
.tbtn:hover{background:var(--surface-3);color:var(--text)}

/* ---------- proposal banner ---------- */
.pbanner{display:flex;gap:14px;align-items:flex-start;padding:10px 18px;background:var(--pri-bg);
  border-bottom:1px solid var(--pri-br);font-size:11.5px;line-height:1.65;flex-wrap:wrap}
.pbanner .tagA{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--on-pri);background:var(--pri);
  border-radius:5px;padding:3px 8px;letter-spacing:.04em}
.pbanner b{color:var(--text)}
.pbanner .ln{color:var(--text-2);min-width:240px;flex:1}
.pbanner .ln i{font-style:normal;color:var(--text-3);font-family:var(--mono);font-size:10px;display:block;letter-spacing:.05em;margin-bottom:1px}

/* ---------- project header ---------- */
.phead{padding:12px 18px 0;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:46px;z-index:30}
.ptitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ptitle h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.ptitle .sub{font-size:11.5px;color:var(--text-3)}
.ptitle .rc{font-family:var(--mono);font-size:10.5px;color:var(--text-3);border:1px solid var(--border-2);border-radius:4px;padding:1px 5px}
.pmeta{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:11px;color:var(--text-3);flex-wrap:wrap}

/* project switcher */
.pswitch{display:flex;gap:5px;align-items:center;margin:9px 0 2px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
.pchip{flex:0 0 auto;height:27px;padding:0 10px;border:1px solid var(--border-2);border-radius:7px;background:var(--surface-2);
  font-size:11.5px;color:var(--text-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pchip:hover{background:var(--surface-3);color:var(--text)}
.pchip.on{background:var(--surface-4);color:var(--text);border-color:var(--border-3);font-weight:600}
.pchip .no{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.pchip.on .no{color:var(--pri)}
.pchip .dot{width:5px;height:5px;border-radius:50%}

/* tabs */
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 13px 9px;font-size:13px;color:var(--text-3);border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab:hover{color:var(--text-2)}
.tab.on{color:var(--text);border-bottom-color:var(--pri);font-weight:600}
.tab .ct{font-family:var(--mono);font-size:9.5px;min-width:16px;height:16px;line-height:16px;text-align:center;
  border-radius:8px;background:var(--surface-3);color:var(--text-2);padding:0 4px}
.tab .ct.hot{background:var(--danger-bg);color:var(--danger)}
.tab .ct.warn{background:var(--warn-bg);color:var(--warn)}

/* ---------- return-context bar [關聯解法 M2] ---------- */
.retbar{display:none;align-items:center;gap:9px;padding:6px 18px;background:var(--info-bg);
  border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-2);position:sticky;top:46px;z-index:31}
.retbar.show{display:flex}
.retbar b{color:var(--text);font-weight:600}
.retbar .back{margin-left:auto;border:1px solid var(--border-2);border-radius:6px;padding:2px 9px;font-size:11px;background:var(--surface-2)}
.retbar .back:hover{background:var(--surface-3)}

/* ---------- content ---------- */
.body{padding:14px 18px 60px;flex:1}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g-drive{grid-template-columns:minmax(260px,330px) 1fr}
.g-meet{grid-template-columns:minmax(230px,290px) 1fr}
.g-chat{grid-template-columns:minmax(200px,250px) 1fr}
.g-side{grid-template-columns:1fr minmax(280px,340px)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ch h3{margin:0;font-size:12.5px;font-weight:650}
.ch .note{font-size:10.5px;color:var(--text-3)}
.ch .r{margin-left:auto;display:flex;gap:5px;align-items:center}
.cb{padding:10px 12px}
.cb.flush{padding:0}
.sbtn{height:24px;padding:0 8px;border:1px solid var(--border-2);border-radius:6px;font-size:11px;color:var(--text-2);background:var(--surface-2);display:inline-flex;align-items:center;gap:4px}
.sbtn:hover{background:var(--surface-3);color:var(--text)}
.sbtn.pri{background:var(--pri-bg);border-color:var(--pri-br);color:var(--pri)}
.sbtn.pri:hover{background:var(--pri-hover)}
.sbtn:disabled{opacity:.45;cursor:not-allowed}

.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--text-3);font-size:10.5px;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.kv .v{text-align:right;min-width:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:3px;font-size:10px;line-height:1;padding:3px 6px;border-radius:5px;
  border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pill.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.pill.dan{background:var(--danger-bg);border-color:var(--danger-br);color:var(--danger)}
.pill.pri{background:var(--pri-bg);border-color:var(--pri-br);color:var(--pri)}
.pill.info{background:var(--info-bg);border-color:var(--info);color:var(--info)}
.pill.teal{background:var(--teal-bg);border-color:var(--teal);color:var(--teal)}
.pill.gold{color:var(--gold);border-color:var(--gold)}
/* [約束5] 可見性兩種標記 */
.pill.int{background:var(--danger-bg);border-color:var(--danger-br);color:var(--danger);font-family:var(--mono)}
.pill.cli{background:var(--teal-bg);border-color:var(--teal);color:var(--teal);font-family:var(--mono)}
.pill.todo{background:var(--ag-todo-bg);border-color:var(--ag-todo-br);color:var(--ag-todo-ink)}
.pill.doing{background:var(--ag-doing-bg);border-color:var(--ag-doing-br);color:var(--ag-doing-ink)}
.pill.done{background:var(--ag-done-bg);border-color:var(--ag-done-br);color:var(--ag-done-ink)}
.pill.over{background:var(--ag-over-bg);border-color:var(--ag-over-br);color:var(--ag-over-ink)}
.muted{color:var(--text-3)}
.tiny{font-size:10.5px}
.hint{font-size:11px;color:var(--text-3);line-height:1.7}
.hint b{color:var(--text-2);font-weight:600}
.notebar{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-left:2px solid var(--pri);
  background:var(--surface-2);border-radius:0 6px 6px 0;font-size:11px;color:var(--text-2);line-height:1.7;margin-top:10px}
.notebar.warn{border-left-color:var(--warn)}
.notebar.dan{border-left-color:var(--danger)}
.notebar b{color:var(--text)}
.notebar span{min-width:0}
code.mono{word-break:break-all;overflow-wrap:anywhere;font-size:.94em}

/* ---------- [約束2] 期 / 階段 ---------- */
.cyc-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);
  background:var(--surface-2);overflow-x:auto;scrollbar-width:none}
.cyc-bar::-webkit-scrollbar{display:none}
.cyc{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid var(--border-2);border-radius:7px;
  padding:4px 10px;background:var(--surface);font-size:11.5px;color:var(--text-2)}
.cyc:hover{border-color:var(--border-3);color:var(--text)}
.cyc.on{border-color:var(--pri-br);background:var(--pri-bg);color:var(--pri);font-weight:650}
.cyc .ord{font-family:var(--mono);font-size:10px;opacity:.8}
.cyc-sep{color:var(--text-3);flex:0 0 auto}
.stages{display:flex;align-items:stretch;gap:0;padding:11px 12px;overflow-x:auto;scrollbar-width:thin}
.stg{flex:1 1 0;min-width:112px;border:1px solid var(--border-2);border-right-width:0;background:var(--surface-2);
  padding:7px 10px;position:relative}
.stg:first-child{border-radius:7px 0 0 7px}
.stg:last-child{border-right-width:1px;border-radius:0 7px 7px 0}
.stg .nm{font-size:12px;font-weight:650;display:flex;align-items:center;gap:5px}
.stg .dt{font-family:var(--mono);font-size:10px;color:var(--text-3);margin-top:2px}
.stg.done{background:var(--ag-done-bg);border-color:var(--ag-done-br)}
.stg.done .nm{color:var(--ag-done-ink)}
.stg.doing{background:var(--ag-doing-bg);border-color:var(--ag-doing-br);box-shadow:inset 0 -2px 0 var(--pri)}
.stg.doing .nm{color:var(--ag-doing-ink)}
.stg.todo .nm{color:var(--text-3)}
.stg .rep{position:absolute;top:5px;right:7px;font-family:var(--mono);font-size:9px;color:var(--text-3)}

/* 里程碑列 */
.mrow{display:flex;align-items:center;gap:9px;padding:var(--rowpad) 12px;border-bottom:1px solid var(--border);font-size:12.5px;flex-wrap:wrap}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--hover-overlay)}
.mrow .dia{color:var(--gold);flex:0 0 auto;display:flex}
.mrow .nm{font-weight:600}
.mrow .rt{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.trow{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 36px;border-bottom:1px solid var(--border);font-size:12px}
.trow:hover{background:var(--hover-overlay)}
.trow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .who{border:0;padding:0;font-size:11px;color:var(--text-3)}

/* ---------- 資料夾樹 ---------- */
.tree{padding:5px 0;max-height:560px;overflow:auto}
.tn{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:12px;cursor:pointer;border-left:2px solid transparent}
.tn:hover{background:var(--hover-overlay)}
.tn.on{background:var(--pri-bg);border-left-color:var(--pri);color:var(--pri);font-weight:600}
.tn .tw{width:12px;flex:0 0 12px;color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:9px}
.tn .ico{flex:0 0 auto;display:flex;color:var(--text-3)}
.tn.on .ico{color:var(--pri)}
.tn .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn .n{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.tn.inbox .ico{color:var(--warn)}
.tn.inbox .lb{color:var(--warn)}
.tn.inbox.on .lb,.tn.inbox.on .ico{color:var(--pri)}

/* 檔案列 */
.frow{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);font-size:12px}
.frow:last-child{border-bottom:0}
.frow:hover{background:var(--hover-overlay)}
.frow .ext{font-family:var(--mono);font-size:9px;text-transform:uppercase;width:34px;flex:0 0 34px;text-align:center;
  border:1px solid var(--border-2);border-radius:4px;padding:2px 0;color:var(--text-3);background:var(--surface-2)}
.frow .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .sz{font-family:var(--mono);font-size:10.5px;color:var(--text-3);flex:0 0 auto}
.frow input[type=checkbox]{accent-color:var(--pri);width:13px;height:13px;flex:0 0 auto}
.crumb{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-3);flex-wrap:wrap}
.crumb b{color:var(--text-2);font-weight:600}

/* ---------- [關聯解法 M1/M3] 引用晶片與懸停卡 ---------- */
.ref{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:9.5px;line-height:1;
  padding:3px 6px;border-radius:5px;border:1px dashed var(--border-3);color:var(--text-2);background:transparent;position:relative}
.ref:hover{border-style:solid;border-color:var(--pri-br);background:var(--pri-bg);color:var(--pri)}
.ref .ar{opacity:.6}
.peek{position:fixed;z-index:120;width:290px;background:var(--surface-3);border:1px solid var(--border-3);
  border-radius:var(--r);box-shadow:var(--shadow);padding:10px 11px;font-size:11.5px;display:none;pointer-events:none}
.peek.show{display:block}
.peek .pt{font-size:9.5px;font-family:var(--mono);color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
.peek .ph{font-size:12.5px;font-weight:650;margin:2px 0 5px}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
function inboxFd(p){const f=p.folders.find(x=>x.role==='inbox');return f?f.id:null;}
function inboxN(p){const i=inboxFd(p);return i?p.files.filter(f=>f.fd===i).length:0;}
function kids(p,pid){return p.folders.filter(f=>f.p===pid);}
function fdById(p,id){return p.folders.find(f=>f.id===id);}
function allMiles(p){return p.milestones;}

}
/* ---- [關聯解法 M3] 懸停卡：多數關聯確認變成 hover，不必跳頁 ---- */
function peekData(t,id){
  const p=P();
  if(t==='mile'){const m=allMiles(p).find(x=>x.id===id);if(!m)return null;
    return{kind:'里程碑',h:m.id+' · '+m.name,rows:[['期','第 '+m.cy+' 期'],['日期',m.date||'日期待補'],
      ['驗收',m.acc||'待補'],['任務',m.tasks.length+' 件']],foot:'計劃分頁'};}
  if(t==='meet'){const m=p.meetings.find(x=>x.id===id);if(!m)return null;
    return{kind:'會議資料夾',h:m.date+' '+m.title,rows:[['參與者',m.people],['產生時間',m.date],
      ['結論',m.conclusion],['注意事項',m.caution]],foot:'會議分頁 · 屬性跟著資料夾'};}
  if(t==='file'){const f=p.files.find(x=>x.id===id);if(!f)return null;
    const fd=fdById(p,f.fd);
    return{kind:'檔案',h:f.name,rows:[['位置',fd?fd.name:'—'],['大小',f.size],
      ['可見性',f.vis==='client_visible'?'可給客戶':'僅內部']].concat(f.note?[['備註',f.note]]:[]),foot:'檔案分頁'};}
  if(t==='folder'){const f=fdById(p,id);if(!f)return null;
    return{kind:'資料夾',h:f.name,rows:[['角色',ROLE_LABEL[f.role]||f.role],
      ['可見性',f.vis==='client_visible'?'可給客戶':'僅內部'],['檔案',p.files.filter(x=>x.fd===id).length+' 個']],foot:'檔案分頁'};}
  if(t==='msg'){let hit=null;p.threads.forEach(th=>th.msgs.forEach(m=>{if(m.id===id)hit={th,m};}));
    if(!hit)return null;
    return{kind:'訊息',h:hit.th.title,rows:[['發話',hit.m.w],['時間',hit.m.ts],['內容',hit.m.t]],foot:'對話分頁'};}
  if(t==='task'){let hit=null;allMiles(p).forEach(m=>m.tasks.forEach(tk=>{if(tk.id===id)hit={m,tk};}));
    if(!hit)return null;
    return{kind:'任務',h:hit.tk.id+' · '+hit.tk.n,rows:[['里程碑',hit.m.id+' '+hit.m.name],
      ['狀態',hit.tk.st],['負責',hit.tk.w],['到期',hit.tk.d||'日期待補']],foot:'計劃分頁'};}
  return null;
}
function showPeek(el,t,id){
  const d=peekData(t,id);const pk=$('#peek');if(!d){pk.classList.remove('show');return;}
  pk.innerHTML='<div class="pt">'+esc(d.kind)+'</div><div class="ph">'+esc(d.h)+'</div>'+
    d.rows.map(r=>'<div class="pl"><span class="pk">'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>').join('')+
    '<div class="pf">點一下跳過去 · 跳過去後頂端會留回返脈絡</div>';
  pk.classList.add('show');
  const r=el.getBoundingClientRect();
  let left=Math.min(r.left,window.innerWidth-304);left=Math.max(8,left);
  let top=r.bottom+6; const h=pk.offsetHeight;
  if(top+h>window.innerHeight-8) top=Math.max(8,r.top-h-6);
  pk.style.left=left+'px';pk.style.top=top+'px';
}
/* ---- [關聯解法 M2] 跨分頁跳轉並保留回返脈絡 ---- */
function curLabel(){
  const t=TABS.find(x=>x.k===S.tab);
  let extra='';
  if(S.tab==='meet'&&S.selMeet){const m=P().meetings.find(x=>x.id===S.selMeet);if(m)extra=' · '+m.date+' '+m.title;}
  if(S.tab==='drive'&&S.selFolder){const f=fdById(P(),S.selFolder);if(f)extra=' · '+f.name;}
  if(S.tab==='chat'&&S.selThread){const th=P().threads.find(x=>x.id===S.selThread);if(th)extra=' · '+th.title;}
  return (t?t.n:'')+extra;
}
function jump(t,id){
  const snap={tab:S.tab,selFolder:S.selFolder,selMeet:S.selMeet,selThread:S.selThread,
    cyc:S.cyc,driveSub:S.driveSub,label:curLabel()};
  const p=P();
  if(t==='mile'||t==='task'){const m=t==='mile'?allMiles(p).find(x=>x.id===id)
      :allMiles(p).find(x=>x.tasks.some(k=>k.id===id));
    if(m){S.cyc=m.cy;} S.tab='plan';}
  else if(t==='meet'){S.tab='meet';S.selMeet=id;}
  else if(t==='folder'){S.tab='drive';S.driveSub='drive';S.selFolder=id;openAncestors(id);}
  else if(t==='file'){const f=p.files.find(x=>x.id===id);if(f){S.tab='drive';S.driveSub='drive';S.selFolder=f.fd;openAncestors(f.fd);}}
  else if(t==='msg'){let th=null;p.threads.forEach(x=>{if(x.msgs.some(m=>m.id===id))th=x;});if(th){S.tab='chat';S.selThread=th.id;}}
  else return;
  S.ret.push(snap);$('#peek').classList.remove('show');render();
}
function openAncestors(fid){const p=P();let f=fdById(p,fid);while(f&&f.p){S.open[f.p]=true;f=fdById(p,f.p);}}
function goBack(){const s=S.ret.pop();if(!s)return;Object.assign(S,{tab:s.tab,selFolder:s.selFolder,
  selMeet:s.selMeet,selThread:s.selThread,cyc:s.cyc,driveSub:s.driveSub});render();}

      '<div class="hint" style="margin-top:6px">專案編號用 <code class="mono">PRJ-{YYYY}-{SEQ}</code>；<code class="mono">NN.</code> 會被回收（09 同時用於霽雲燕窩與禾境），只能當 <code class="mono">legacyFolderNo</code>。</div>'+

/* ============================================================
   分頁 2：計劃 — [約束2] 期 → 階段 → 里程碑 → 任務
   （吸收舊「工作」分頁：同一批 ProjectTask 不開兩個抽屜）
   ============================================================ */
function renderPlan(){
  const p=P();
  const cyc=p.cycles.find(c=>c.ord===S.cyc)||p.cycles[0];
  const ms=allMiles(p).filter(m=>m.cy===cyc.ord);

  const cycBar='<div class="cyc-bar">'+
    p.cycles.map(c=>'<button class="cyc'+(c.ord===S.cyc?' on':'')+'" data-cyc="'+c.ord+'">'+
      '<span class="ord">期'+c.ord+'</span>'+esc(c.title)+
      '<span class="pill '+(c.state==='done'?'done':c.state==='doing'?'doing':'todo')+'">'+
      (c.state==='done'?'完成':c.state==='doing'?'進行中':'待啟動')+'</span></button>').join('<span class="cyc-sep">›</span>')+
    '<button class="cyc" data-act="newcyc" style="border-style:dashed">'+svg('plus',11)+'新增期</button>'+
    '<span style="flex:1"></span>'+
    '<span class="tiny muted" style="flex:0 0 auto">期是一列資料（ProjectPhaseCycle），不是 enum —— 加三期＝插一列＋一次 UPDATE</span></div>';

  const stages='<div class="stages">'+cyc.stages.map((s,i)=>{
    const rep=cyc.stages.filter(x=>x.k===s.k).length>1?'×'+cyc.stages.filter(x=>x.k===s.k).length:'';
    return '<div class="stg '+s.s+'"><div class="nm">'+
      (s.s==='done'?svg('check',12):s.s==='doing'?svg('clock',12):svg('chevR',12))+esc(s.k)+'</div>'+
      '<div class="dt">'+esc(s.d)+'</div>'+(rep?'<span class="rep">'+rep+'</span>':'')+'</div>';
  }).join('')+'</div>';

  const mileRows=ms.length?ms.map(m=>{
    const dl=m.date?'<span class="mono tiny muted">'+esc(m.date)+'</span>'
      :'<span class="pill">日期待補</span><span class="pill">不進日曆</span>';
    const done=m.tasks.filter(t=>t.st==='done').length;
    return '<div class="mrow"><span class="dia">'+svg('diamond',12)+'</span>'+
      '<span class="mono tiny" style="color:var(--gold)">'+esc(m.id)+'</span>'+
      '<span class="nm">'+esc(m.name)+'</span>'+dl+
      '<span class="pill '+(m.st==='done'?'done':m.st==='doing'?'doing':'todo')+'">'+
        (m.st==='done'?'完成':m.st==='doing'?'進行中':'未開始')+'</span>'+
      '<span class="tiny muted">'+esc(m.acc||'驗收規則待補')+'</span>'+
      '<span class="rt"><span class="mono tiny muted">'+done+'/'+m.tasks.length+'</span>'+
        m.refs.map(refChip).join('')+
        '<button class="sbtn" data-act="addtask" data-mile="'+m.id+'">'+svg('plus',11)+'任務</button></span></div>'+
      (m.tasks.length?m.tasks.map(t=>
        '<div class="trow"><span class="pill '+(t.st==='done'?'done':t.st==='doing'?'doing':'todo')+'">'+
          (t.st==='done'?'Done':t.st==='doing'?'Doing':'Todo')+'</span>'+
        (t.rev?'<span class="pill info">'+svg('check',10)+'審核</span>':'')+
        '<span class="mono tiny muted">'+esc(t.id)+'</span>'+
        '<span class="nm">'+esc(t.n)+'</span>'+
        (t.src?refChip(t.src):'')+
        '<span class="who">'+esc(t.w)+'</span>'+
        '<span class="mono tiny muted">'+esc(t.d||'日期待補')+'</span></div>').join('')
        :'<div class="trow muted tiny" style="padding-top:4px;padding-bottom:4px">—</div>');
  }).join(''):'<div class="empty">這一期還沒有里程碑。</div>';

  const un=(p.unlinked||[]);
  return '<div class="grid">'+
  '<div class="card">'+cycBar+stages+
    '<div class="legend">'+
      '<span>'+svg('check',11)+' 完成</span><span>'+svg('clock',11)+' 進行中</span><span>'+svg('chevR',11)+' 未開始</span>'+
      '<span class="muted">「現在走到哪」是推導不是存欄位：最小未完成的（期序, 階段序）</span></div>'+
  '</div>'+
  '<div class="card"><div class="ch"><h3>里程碑 · 任務</h3><span class="note">期'+cyc.ord+' · '+esc(cyc.title)+' · '+ms.length+' 個里程碑</span>'+
    '<span class="r"><button class="sbtn">清單</button><button class="sbtn">看板</button><button class="sbtn">甘特</button>'+
    '<button class="sbtn pri" data-act="addmile">'+svg('plus',11)+'新增里程碑</button></span></div>'+
    '<div class="cb flush">'+mileRows+'</div></div>'+
  (un.length?'<div class="card"><div class="ch"><h3>尚未掛到里程碑的工作</h3><span class="note">'+un.length+' 件</span></div><div class="cb flush">'+
    un.map(t=>'<div class="frow"><span class="pill '+(t.st==='done'?'done':t.st==='doing'?'doing':'todo')+'">'+
      (t.st==='done'?'Done':t.st==='doing'?'Doing':'Todo')+'</span><span class="mono tiny muted">'+esc(t.id)+'</span>'+
      '<span class="fn">'+esc(t.n)+'</span><span class="sz">'+esc(t.w)+'</span>'+
      '<button class="sbtn" data-act="link-mile" data-task="'+t.id+'">補掛里程碑</button></div>').join('')+
    '</div></div>':'')+
  '<div class="notebar">'+svg('sparkle',13)+'<span><b>舊「工作」分頁併進來了。</b>同一批 ProjectTask 用兩個分頁從兩個角度看，正是分頁式架構會變成抽屜櫃的典型原因。'+
    '這裡保留 v5 既有的 清單／看板／甘特 子視圖切換，改動的是「哪一層是分頁」，不是元件。遷移時刻意不自動生成假目標來填滿階層。</span></div>'+
  '</div>';
}

/* ============================================================
   分頁 3：檔案 — [約束3] 收件匣是真資料夾 ＋ Evidence Repo 子視圖
   ============================================================ */
function treeHTML(p,parent,depth){
  return kids(p,parent).map(f=>{
    const ch=kids(p,f.id);
    const op=!!S.open[f.id];
    const n=p.files.filter(x=>x.fd===f.id).length;
    const row='<div class="tn'+(f.id===S.selFolder?' on':'')+(f.role==='inbox'?' inbox':'')+'" data-fd="'+f.id+'" style="padding-left:'+(10+depth*13)+'px">'+
      '<span class="tw" '+(ch.length?'data-tw="'+f.id+'"':'')+'>'+(ch.length?svg(op?'chevD':'chevR',10):'')+'</span>'+
      '<span class="ico">'+svg(ROLE_ICON[f.role]||'folder',13)+'</span>'+
      '<span class="lb">'+esc(f.name)+'</span>'+
      (f.vis==='client_visible'?'<span class="pill cli" style="padding:1px 4px">客</span>':'')+
      (f.meta&&f.meta.entry?'<span class="pill info" style="padding:1px 4px">'+esc(f.meta.entry)+'</span>':'')+
      (f.meta&&f.meta.warn?'<span class="pill warn" style="padding:1px 4px">!</span>':'')+
      (n?'<span class="n">'+n+'</span>':'')+'</div>';
    return row+(op&&ch.length?treeHTML(p,f.id,depth+1):'');
  }).join('');
}
function renderDrive(){
  const p=P();
  if(S.driveSub==='repo')return renderRepo();
  const fd=fdById(p,S.selFolder)||p.folders[0];
  if(!fd)return '<div class="empty">沒有資料夾。</div>';
  const files=p.files.filter(f=>f.fd===fd.id);
  const isInbox=fd.role==='inbox';
  const path=(function(){const a=[];let c=fd;while(c){a.unshift(c);c=c.p?fdById(p,c.p):null;}return a;})();
  const sub='<div class="src-tabs">'+
    '<button class="src-tab'+(S.driveSub==='drive'?' on':'')+'" data-dsub="drive">'+svg('folder',13)+'硬碟</button>'+
    '<button class="src-tab" data-fd="'+inboxFd(p)+'">'+svg('inbox',13)+'收件匣 '+
      (inboxN(p)?'<span class="pill warn">'+inboxN(p)+'</span>':'<span class="pill">0</span>')+'</button>'+
    '<button class="src-tab'+(S.driveSub==='repo'?' on':'')+'" data-dsub="repo">'+svg('notes',13)+'Evidence Repo</button>'+
    '<span style="flex:1"></span>'+
    '<span class="tiny muted" style="align-self:center">收件匣是 role=\'inbox\' 的真資料夾，不是另一個分頁</span></div>';

  const checked=[...S.checked].filter(id=>files.some(f=>f.id===id));
  return sub+'<div class="grid g-drive">'+
  '<div class="card"><div class="ch"><h3>資料夾</h3><span class="note">'+p.folders.length+' 夾</span>'+
    '<span class="r"><button class="sbtn" data-act="newfolder">'+svg('plus',11)+'資料夾</button></span></div>'+
    '<div class="tree">'+treeHTML(p,null,0)+'</div>'+
    '<div class="legend"><span>'+svg('inbox',11)+' 收件匣</span><span>'+svg('users',11)+' 會議</span>'+
      '<span>'+svg('eye',11)+' 共用（對客戶）</span><span>'+svg('lock',11)+' 僅內部</span>'+
      '<span>'+svg('up',11)+' 二期入口</span></div></div>'+

  '<div class="card"><div class="ch">'+
    '<div class="crumb">'+path.map((f,i)=>(i?'<span>/</span>':'')+'<b>'+esc(f.name)+'</b>').join('')+'</div>'+
    '<span class="pill">'+esc(ROLE_LABEL[fd.role]||fd.role)+'</span>'+vis(fd.vis)+
    '<span class="r">'+
      (isInbox&&checked.length?'<button class="sbtn pri" data-act="file-sel">'+svg('folderOpen',11)+'歸檔 '+checked.length+' 項</button>':'')+
      '<button class="sbtn" data-act="togglevis" data-fd="'+fd.id+'">'+svg('eye',11)+'改可見性</button>'+
      '<button class="sbtn">'+svg('plus',11)+'上傳</button></span></div>'+
    (isInbox?'<div class="notebar warn" style="margin:10px 12px 0">'+svg('inbox',13)+
      '<span><b>收件匣＝真資料夾（role=\'inbox\'）。</b>分散上傳沒指定位置就落在這裡，整理就是改 <code class="mono">folderId</code>，不搬 bytes、不換 refCode。'+
      '它和已整理的檔案在 @ 引用、搜尋、下載授權上行為完全一樣 —— 分兩張表就要寫兩套。</span></div>':'')+
    '<div class="cb flush" style="margin-top:'+(isInbox?'10px':'0')+'">'+
    (files.length?files.map(f=>
      '<div class="frow">'+(isInbox?'<input type="checkbox" data-chk="'+f.id+'"'+(S.checked.has(f.id)?' checked':'')+'>':'')+
      '<span class="ext">'+esc(f.ext)+'</span>'+
      '<span class="fn">'+esc(f.name)+(f.note?'<br><span class="tiny muted">'+esc(f.note)+'</span>':'')+'</span>'+
      f.refs.map(refChip).join('')+vis(f.vis)+'<span class="sz">'+esc(f.size)+'</span></div>').join('')
      :'<div class="empty">這個資料夾沒有檔案。</div>')+'</div>'+
    (kids(p,fd.id).length?'<div class="legend"><span class="muted">子資料夾：</span>'+
      kids(p,fd.id).map(k=>'<button class="ref" data-ref="folder:'+k.id+'">'+svg('folder',10)+esc(k.name)+'</button>').join('')+'</div>':'')+
  '</div></div>'+
  '<div class="notebar">'+svg('link',13)+'<span><b>R2 的 object key 不含路徑也不含原始檔名</b>（<code class="mono">operating/{workspaceId}/project/{projectId}/{yyyy-mm}/{uuid}{ext}</code>）：'+
    'S3 API 沒有 server-side rename，而中文／全形檔名在簽章會變成查不出原因的 403。顯示名稱、資料夾位置、原始相對路徑全部存 DB。</span></div>';
}

  '<div class="grid">'+
    '<div class="card"><div class="ch"><h3>版本演化</h3></div><div class="cb">'+
      '<div class="kv"><span class="k">v0.1</span><span class="v">Kickoff</span></div>'+
      '<div class="kv"><span class="k">v0.5</span><span class="v">交付完成</span></div>'+
      '<div class="kv"><span class="k">v0.9</span><span class="v">整理中 <span class="pill pri">now</span></span></div></div></div>'+
    '<div class="card"><div class="ch"><h3>待歸檔</h3><span class="note">'+pend.length+' 項</span></div><div class="cb flush">'+
      (pend.length?pend.map(f=>'<div class="frow"><span class="ext">'+esc(f.ext)+'</span><span class="fn">'+esc(f.name)+'</span>'+
        '<button class="sbtn" data-jump="folder:'+inboxFd(p)+'">到收件匣</button></div>').join('')
        :'<div class="empty">收件匣已清空。</div>')+'</div></div>'+

}

/* ============================================================
   分頁 4：會議 — [約束4] 一個資料夾＝一場會議，四屬性跟著資料夾
   ============================================================ */
function renderMeet(){
  const p=P();
  if(!p.meetings.length)return '<div class="card"><div class="ch"><h3>會議</h3>'+
    '<span class="r"><button class="sbtn pri" data-act="newmeet">'+svg('plus',11)+'新增會議</button></span></div>'+
    '<div class="empty">這個專案還沒有會議資料夾。<br><span class="tiny">建立一場會議＝在「會議／」底下建一個 <code class="mono">YYYYMMDD 事件</code> 資料夾，屬性長在資料夾上。</span></div></div>';
  const m=p.meetings.find(x=>x.id===S.selMeet)||p.meetings[0];
  S.selMeet=m.id;
  const fd=fdById(p,m.fd);
  const files=p.files.filter(f=>f.fd===m.fd);

  const list=p.meetings.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>{
    const miss=x.quad.filter(q=>!q.ok).length;
    return '<div class="mt-item'+(x.id===m.id?' on':'')+'" data-meet="'+x.id+'">'+
      '<div class="d">'+esc(x.date.replace(/-/g,''))+' · '+esc(fdById(p,x.fd)?fdById(p,x.fd).name:'')+'</div>'+
      '<div class="t">'+esc(x.title)+'</div><div class="s">'+
      '<span class="pill '+(miss?'warn':'ok')+'">四件套 '+(4-miss)+'/4</span>'+
      (x.conclusion&&x.conclusion.indexOf('待補')!==0?'<span class="pill ok">結論已寫</span>':'<span class="pill warn">結論待補</span>')+
      '</div></div>';}).join('');

  const attrs='<div class="mt-attrs">'+
    '<div class="mt-at"><div class="k">'+svg('users',11)+'參與者</div><div class="v edit" data-edit="people">'+esc(m.people)+'</div></div>'+
    '<div class="mt-at"><div class="k">'+svg('clock',11)+'產生時間</div><div class="v"><span class="mono">'+esc(m.date)+'</span></div></div>'+
    '<div class="mt-at"><div class="k">'+svg('flag',11)+'結論</div><div class="v edit" data-edit="conclusion">'+esc(m.conclusion||'待補')+'</div></div>'+
    '<div class="mt-at"><div class="k">'+svg('alert',11)+'注意事項</div><div class="v edit" data-edit="caution">'+esc(m.caution||'待補')+'</div></div>'+
    '</div>';

  const quad='<div class="quad">'+m.quad.map(q=>
    '<div class="qc'+(q.ok?'':' miss')+'"><div class="qn">'+
      svg(q.k.indexOf('錄音')>=0?'mic':q.k.indexOf('逐字')>=0?'type':q.k.indexOf('完整')>=0?'notes':'sparkle',12)+
      esc(q.k)+(q.ok?(q.warn?'<span class="pill warn">上不了</span>':'<span class="pill ok">有</span>'):'<span class="pill">缺</span>')+'</div>'+
    '<div class="qf">'+esc(q.f||'—')+'</div></div>').join('')+'</div>';

  return '<div class="grid g-meet">'+
  '<div class="card"><div class="ch"><h3>會議</h3><span class="note">時間序 · '+p.meetings.length+' 場</span>'+
    '<span class="r"><button class="sbtn pri" data-act="newmeet">'+svg('plus',11)+'新增</button></span></div>'+
    '<div class="cb flush">'+list+'</div>'+
    '<div class="legend"><span class="muted">一個資料夾＝一場會議。屬性存在資料夾上（Occasion ＋ folderId 1:1 連結，OD-D）。</span></div></div>'+

  '<div class="grid">'+
    '<div class="card"><div class="ch"><h3>'+esc(m.date)+' '+esc(m.title)+'</h3>'+
      '<span class="pill">'+svg('folder',10)+esc(fd?fd.name:'')+'</span>'+vis(fd?fd.vis:'internal')+
      '<span class="r"><button class="sbtn" data-jump="folder:'+m.fd+'">在硬碟開啟 '+svg('arrow',11)+'</button></span></div>'+
      attrs+
      '<div class="ch" style="border-top:1px solid var(--border)"><h3>會議四件套</h3>'+
        '<span class="note">Owner 既有慣例：會議錄音檔／逐字稿／完整紀錄／摘要</span></div>'+
      quad+
      '<div class="ch" style="border-top:1px solid var(--border)"><h3>夾內材料</h3><span class="note">'+files.length+' 個檔案</span></div>'+
      '<div class="cb flush">'+(files.length?files.map(f=>
        '<div class="frow"><span class="ext">'+esc(f.ext)+'</span><span class="fn">'+esc(f.name)+
        (f.note?'<br><span class="tiny muted">'+esc(f.note)+'</span>':'')+'</span>'+
        vis(f.vis)+'<span class="sz">'+esc(f.size)+'</span></div>').join('')
        :'<div class="empty">這場會議的資料夾還沒有材料。</div>')+'</div>'+
    '</div>'+
    '<div class="card"><div class="ch"><h3>會議待辦</h3><span class="note">升級路徑：會議待辦 → 任務</span></div>'+
      '<div class="cb flush">'+(m.todos.length?m.todos.map((t,i)=>
        '<div class="frow"><span class="pill '+(t.done?'done':'todo')+'">'+(t.done?'已轉':'未轉')+'</span>'+
        '<span class="fn">'+esc(t.n)+'</span>'+
        (t.done?'<span class="tiny muted">已建立任務</span>'
          :'<button class="sbtn pri" data-act="todo2task" data-ti="'+i+'">'+svg('up',11)+'升級為任務</button>')+
        '</div>').join(''):'<div class="empty">沒有待辦。</div>')+'</div>'+
      '<div class="notebar">'+svg('link',13)+'<span>升級會<b>就地開抽屜</b>，不離開會議分頁。建立任務的同時雙向寫入引用：任務列出現 '+
        '<span class="ref" style="cursor:default">會議 '+esc(m.date.replace(/-/g,'').slice(4))+'</span>，這一列變成「已轉」。</span></div></div>'+
  '</div></div>';
}

/* ============================================================
   分頁 5：對話 — 聊天室 ＋ [約束7] LINE 停用入口
   ============================================================ */
function renderChat(){

let SEQ=900;
function nextTask(){SEQ++;return 'T-'+SEQ;}

/* 流程 1：收件匣 → 歸檔（新增關聯 ＋ 改 folderId，不搬 bytes） */
function flowFile(ids){
  const p=P();
  const targets=p.folders.filter(f=>f.role!=='inbox');
  const body='<div class="hint" style="margin-bottom:10px">把 '+ids.length+' 個檔案從收件匣移到正式位置。'+
    '系統只改 <code class="mono">folderId</code>：R2 的 object key 不動、<code class="mono">refCode</code> 不重生成。</div>'+
    ids.map(id=>{const f=p.files.find(x=>x.id===id);return '<div class="pickrow"><span class="ext">'+esc(f.ext)+
      '</span><span class="lb">'+esc(f.name)+'</span></div>';}).join('')+
    '<div class="sep"></div><div class="fld"><label>歸到哪個資料夾</label><div id="fdPick">'+
    targets.map((f,i)=>'<div class="pickrow'+(i===0?' on':'')+'" data-pick="'+f.id+'">'+
      svg(ROLE_ICON[f.role]||'folder',13)+'<span class="lb">'+esc(f.name)+'</span>'+
      '<span class="pill">'+esc(ROLE_LABEL[f.role]||f.role)+'</span>'+
      (f.vis==='client_visible'?'<span class="pill cli">客</span>':'<span class="pill int">內</span>')+'</div>').join('')+
    '</div></div>'+
    '<div class="notebar">'+svg('eye',13)+'<span>歸到 <b>共用（對客戶）</b> 的檔案可見性會一併改成 <b>可給客戶</b>；'+
      '歸到 <b>合約／內部</b> 的資料夾則由規則<b>禁止</b>設為可給客戶。</span></div>';
  openDrawer('歸檔 '+ids.length+' 個檔案',body,
    '<button class="sbtn" data-close>取消</button><button class="sbtn pri" data-act="file-do">歸檔並寫入關聯</button>');
  const box=$('#fdPick');box._v=targets[0].id;
  box.addEventListener('click',e=>{const r=e.target.closest('[data-pick]');if(!r)return;
    box.querySelectorAll('.pickrow').forEach(x=>x.classList.remove('on'));r.classList.add('on');box._v=r.dataset.pick;});
  $('#drFoot').querySelector('[data-act="file-do"]').addEventListener('click',()=>{
    const to=box._v;const tf=fdById(p,to);
    ids.forEach(id=>{const f=p.files.find(x=>x.id===id);f.fd=to;
      if(tf.vis==='client_visible')f.vis='client_visible';
      f.note='已從收件匣歸檔 · folderId 已更新';
      if(tf.meta&&tf.meta.occ)f.refs=f.refs.concat([{t:'meet',id:tf.meta.occ,l:'會議 '+tf.name.slice(4,8)}]);});
    S.checked.clear();S.selFolder=to;openAncestors(to);closeAll();render();
    toast('已歸檔 '+ids.length+' 個檔案到「'+tf.name+'」');});
}

    p.meetings.push({id:mid,fd:fid,date:d,title:t,people:$('#mP').value.trim()||'待補',
      conclusion:$('#mC').value.trim()||'待補',caution:$('#mN').value.trim()||'待補',

/* 流程 3：就地編輯會議四屬性 */
function startEdit(el,key){
  const p=P();const m=p.meetings.find(x=>x.id===S.selMeet);if(!m)return;
  const cur=m[key]||'';
  el.outerHTML='<textarea data-live="'+key+'">'+esc(cur)+'</textarea>';
  const ta=$('[data-live="'+key+'"]');ta.focus();ta.setSelectionRange(cur.length,cur.length);
  const save=()=>{m[key]=ta.value.trim()||'待補';render();toast('已更新會議「'+
    (key==='people'?'參與者':key==='conclusion'?'結論':'注意事項')+'」· 屬性存在資料夾上');};
  ta.addEventListener('blur',save,{once:true});
  ta.addEventListener('keydown',e=>{if(e.key==='Escape'){ta.removeEventListener('blur',save);render();}
    if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))ta.blur();});
}

    '<div class="fld"><label>到期</label><input id="tD" placeholder="日期待補"></div>';
  openDrawer('訊息 → 任務',body,'<button class="sbtn" data-close>取消</button><button class="sbtn pri" data-act="m2t-do">建立並雙向連結</button>');
  const box=$('#mPick');box._v=def||ms[0].id;
  box.addEventListener('click',e=>{const r=e.target.closest('[data-pick]');if(!r)return;
    box.querySelectorAll('.pickrow').forEach(x=>x.classList.remove('on'));r.classList.add('on');box._v=r.dataset.pick;});
  const kb=$('#tK');kb._v='TODO';

  $('#moFoot').querySelector('[data-act="cyc-do"]').addEventListener('click',()=>{
    const st=[{k:'追加合約',s:'todo',d:'日期待補'},{k:'執行',s:'todo',d:'日期待補'},{k:'驗收',s:'todo',d:'日期待補'}];
    if(kb._v==='b')st.push({k:'結案',s:'todo',d:'日期待補'});
    p.cycles.push({ord:n,title:$('#cT').value.trim()||('第 '+n+' 期'),contract:$('#cC').value.trim()||'待補',state:'todo',stages:st});
    S.cyc=n;closeAll();render();toast('已新增 期'+n);});
}
function flowNewFolder(){
  const p=P();const par=fdById(p,S.selFolder);
  const roles=['proposal','contract','meeting','milestone','material','shared','internal','revision','finance','custom'];
  const body='<div class="fld"><label>名稱</label><input id="nF" placeholder="例：第三次修改需求"></div>'+
    '<div class="fld"><label>角色（role）</label><select id="nR">'+roles.map(r=>'<option value="'+r+'">'+ROLE_LABEL[r]+' · '+r+'</option>').join('')+'</select>'+
      '<div class="fh">role 讓規則認得這個資料夾（例如 contract／internal 禁止設為可給客戶）。</div></div>'+
    '<div class="fld"><label>可見性</label><div class="radios" id="nV">'+
      '<div class="radio on" data-k="internal">僅內部</div><div class="radio" data-k="client_visible">可給客戶</div></div></div>'+
    '<div class="hint">建在 <b>'+(par?esc(par.name):'根')+'</b> 底下。</div>';
  openModal('新增資料夾',body,'<button class="sbtn" data-close>取消</button><button class="sbtn pri" data-act="fd-do">建立</button>');
  const kb=$('#nV');kb._v='internal';
  kb.addEventListener('click',e=>{const r=e.target.closest('[data-k]');if(!r)return;
    kb.querySelectorAll('.radio').forEach(x=>x.classList.remove('on'));r.classList.add('on');kb._v=r.dataset.k;});
  $('#moFoot').querySelector('[data-act="fd-do"]').addEventListener('click',()=>{
    const role=$('#nR').value;let v=kb._v;
    if((role==='contract'||role==='internal'||role==='finance')&&v==='client_visible'){v='internal';toast('contract／internal／finance 禁止設為可給客戶，已改回僅內部');}
    const id='fd_'+(++SEQ);
    p.folders.push(F(id,par?par.id:null,$('#nF').value.trim()||'新資料夾',role,v));
    if(par)S.open[par.id]=true;S.selFolder=id;closeAll();render();});
}
/* [約束5] 可見性切換，含規則阻擋 */
function flowVis(fid){
  const p=P();const f=fdById(p,fid);
  if(f.vis==='internal'&&(f.role==='contract'||f.role==='internal'||f.role==='finance')){
    toast('「'+ROLE_LABEL[f.role]+'」資料夾由規則禁止對客戶可見 —— 回簽合約、財務台帳、標「不得提供客戶」的文件都在這一層');return;}
  f.vis=f.vis==='client_visible'?'internal':'client_visible';
  p.files.filter(x=>x.fd===fid).forEach(x=>{x.vis=f.vis;});
  render();toast('「'+f.name+'」及夾內 '+p.files.filter(x=>x.fd===fid).length+' 個檔案已設為 '+
    (f.vis==='client_visible'?'可給客戶':'僅內部'));
}
/* [約束7] LINE：只說明，不假裝 */
function flowLine(){
  openModal('LINE 群導入 · 本階段停用',
    '<div class="notebar dan">'+svg('ban',13)+'<span><b>這個入口不可用，而且短期內不會變可用。</b>不是還沒做，是有三件事擋著。</span></div>'+
    '<div class="cb" style="padding-left:0;padding-right:0">'+
    '<div class="kv"><span class="k">技術上</span><span class="v" style="text-align:left">bot 被拉進群<b>之前</b>的歷史訊息，官方文件寫明「There is no API available to get the text again after receiving the webhook.」—— 永遠拿不回來。</span></div>'+
    '<div class="kv"><span class="k">LINE Notify</span><span class="v" style="text-align:left">已於 2025-03-31 終止服務，不是選項。</span></div>'+
    '<div class="kv"><span class="k">匯出檔</span><span class="v" style="text-align:left">LINE App 的 .txt 匯出<b>只有文字</b>，圖片是 <code class="mono">[照片]</code> 占位，bytes 拿不回來。</span></div>'+
    '<div class="kv"><span class="k">風險</span><span class="v" style="text-align:left">需要一條<b>無認證公開 webhook</b>（系統第二條），屬 AGENTS.md §11 高風險；前置是先寫 <code class="mono">AUT-*</code> 政策文件並取得核准（OD-H）。</span></div>'+
    '<div class="kv"><span class="k">後果</span><span class="v" style="text-align:left">01 共好玟化的<b>合約變更只存在 LINE 裡</b>（財務表備註「有用LINE訊息談好可以分兩期」）—— 這筆資料目前系統裡沒有，只能靠 M5 人工補。</span></div>'+
    '</div>','<button class="sbtn" data-close>知道了</button>');
}

/* ============================================================
   事件
   ============================================================ */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-close]')||t===$('#scrim')){closeAll();return;}

  const tab=t.closest('[data-tab]');
  if(tab){S.tab=tab.dataset.tab;S.ret=[];render();return;}
  const tg=t.closest('[data-tab-go]');
  if(tg){S.tab=tg.dataset.tabGo;S.ret=[];render();return;}

  const pr=t.closest('[data-proj]');
  if(pr){S.pid=pr.dataset.proj;const p=P();
    S.cyc=p.cycles[p.cycles.length-1].ord;
    S.selFolder=inboxFd(p)||p.folders[0].id;
    S.selMeet=p.meetings.length?p.meetings[0].id:null;
    S.selThread=p.threads.length?p.threads[0].id:null;
    S.open={};S.checked.clear();S.ret=[];S.driveSub='drive';render();return;}

  const cy=t.closest('[data-cyc]');
  if(cy){S.cyc=+cy.dataset.cyc;render();return;}

  const tw=t.closest('[data-tw]');
  if(tw){const id=tw.dataset.tw;S.open[id]=!S.open[id];render();e.stopPropagation();return;}
  const fdn=t.closest('[data-fd]');
  if(fdn){S.tab='drive';S.driveSub='drive';S.selFolder=fdn.dataset.fd;
    if(kids(P(),fdn.dataset.fd).length)S.open[fdn.dataset.fd]=true;
    S.checked.clear();render();return;}
  const ds=t.closest('[data-dsub]');
  if(ds){S.driveSub=ds.dataset.dsub;render();return;}

  const mt=t.closest('[data-meet]');
  if(mt){S.selMeet=mt.dataset.meet;render();return;}
  const th=t.closest('[data-thread]:not([data-act])');
  if(th&&th.dataset.thread&&!th.dataset.act){S.selThread=th.dataset.thread;render();return;}

  const ed=t.closest('[data-edit]');
  if(ed){startEdit(ed,ed.dataset.edit);return;}

  const rf=t.closest('[data-ref]');
  if(rf){const [k,id]=rf.dataset.ref.split(':');jump(k,id);return;}
  const jp=t.closest('[data-jump]');
  if(jp){const [k,id]=jp.dataset.jump.split(':');jump(k,id);return;}

  const act=t.closest('[data-act]');
  if(act){
    const a=act.dataset.act;const p=P();
    if(a==='line'){flowLine();return;}
    if(a==='newmeet'){flowNewMeeting();return;}
    if(a==='newcyc'){flowAddCycle();return;}
    if(a==='addmile'){flowAddMile();return;}
    if(a==='addtask'){flowAddTask(act.dataset.mile);return;}
    if(a==='newfolder'){flowNewFolder();return;}
    if(a==='togglevis'){flowVis(act.dataset.fd);return;}
    if(a==='file-sel'){const ids=[...S.checked];if(ids.length)flowFile(ids);return;}
    if(a==='msg2task'){flowMsg2Task(act.dataset.thread,act.dataset.msg);return;}
    if(a==='todo2task'){flowTodo2Task(+act.dataset.ti);return;}
    if(a==='link-mile'){toast('補掛里程碑：由人決定掛到哪個判準下 —— 遷移時刻意不自動生成假目標來填滿階層');return;}
    if(a==='send'){const ta=document.querySelector('.composer textarea');
      const v=(ta&&ta.value.trim());if(!v){toast('先寫點什麼');return;}
      const thr=p.threads.find(x=>x.id===S.selThread);
      thr.msgs.push({id:'m_'+(++SEQ),w:'戴宇星',me:true,ts:'10-03 '+new Date().toTimeString().slice(0,5),t:v,upg:{kind:'task'}});
      render();toast('已送出 · 訊息可以直接升級為任務');return;}
    if(a==='newthread'){const id='g_'+(++SEQ);
      p.threads.push({id:id,title:'新 Thread',open:true,msgs:[]});S.selThread=id;S.tab='chat';render();return;}
    if(a==='newproj'){toast('新專案會自動綁到「圓展教育科技有限公司」workspace（OD-C，伺服器端解析，不吃前端參數）');return;}
    return;
  }

  const rail=t.closest('[data-rail]');
  if(rail&&!rail.classList.contains('on')){toast('本原型只實作「專案」模組，其餘軌道維持 v5 現況');return;}
});

document.addEventListener('change',e=>{
  const c=e.target.closest('[data-chk]');
  if(c){const id=c.dataset.chk;if(c.checked)S.checked.add(id);else S.checked.delete(id);render();}
});

/* 懸停卡 */
document.addEventListener('mouseover',e=>{
  const rf=e.target.closest('[data-ref]');
  if(rf){const [k,id]=rf.dataset.ref.split(':');showPeek(rf,k,id);}
});
document.addEventListener('mouseout',e=>{
  if(e.target.closest('[data-ref]'))$('#peek').classList.remove('show');
});
window.addEventListener('scroll',()=>$('#peek').classList.remove('show'),true);

$('#retBack').addEventListener('click',goBack);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#drawer').classList.contains('show')||$('#modal').classList.contains('show'))closeAll();
    else if(S.ret.length)goBack();}
});

/* 主題：深色為主，淺色沿用 WHITE palette */
$('#themeBtn').addEventListener('click',()=>{
  const d=document.documentElement.getAttribute('data-theme')==='light';
  document.documentElement.setAttribute('data-theme',d?'dark':'light');
  $('#themeBtn').innerHTML=(d?svg('moon',14)+' 深色':svg('sun',14)+' 淺色');
});
$('#themeBtn').innerHTML=svg('moon',14)+' 深色';

render();
</script>
