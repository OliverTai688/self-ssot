<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提案 B · 時間流主軸 — 圓展教育科技專案模組</title>
<!--
  PLN-075 S1 三提案之一：提案 B「時間流主軸」
  單一自包含檔案，無 build、無 CDN、無網路請求。原生 HTML/CSS/JS。
  視覺 token 直接沿用 src/components/yuanzhan/v5/styles.ts 的 :host{} 與
  src/lib/theme/company-theme.ts 的 BLACK / WHITE palette（硬性約束 1）。
-->
<style>
/* ==================== tokens（照抄 v5 styles.ts :host{} 的 BLACK palette） ==================== */
:root{
  --bg:#0a0c0f; --surface:#111418; --surface-2:#161a20; --surface-3:#1d232b; --surface-4:#242b34;
  --border:#232931; --border-2:#333b45; --border-3:#465060;
  --text:#e9ecf1; --text-2:#99a2af; --text-3:#626b77;
  --pri:#6cb6ff; --pri-bg:#11212e; --pri-br:#2d5a7d;
  --ok:#5fd09a; --ok-bg:#0f2620;
  --warn:#f2b95e; --warn-bg:#2a2111;
  --danger:#ef8a82; --danger-bg:#2b1614;
  --info:#a78bf5; --info-bg:#1c1830;
  --teal:#4fcfc0; --teal-bg:#0d2724;
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#c98500;
  --grid:#252c35; --axis:#39414c;
  --avatar-bg:#2b3440;
  --av-yz-bg:#2b4a63; --av-yz-fg:#9ecbf5;
  --av-lily-bg:#3d3357; --av-lily-fg:#c4a2f5;
  --hover-overlay:rgba(255,255,255,.04);
  --scroll-thumb:#2a313a; --scroll-thumb-hover:#3a424d;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --rail:78px; --rowpad:9px; --r:8px;
  --shadow:0 18px 44px rgba(0,0,0,.55);
  color-scheme:dark;
}
/* 淺色：照抄 company-theme.ts 的 WHITE palette */
:root[data-theme="light"]{
  --bg:#ffffff; --surface:#f7f7f8; --surface-2:#f0f1f3; --surface-3:#e7e9ec; --surface-4:#dee1e6;
  --border:#e3e5e8; --border-2:#cfd3d8; --border-3:#aeb5bd;
  --text:#16181c; --text-2:#555b64; --text-3:#8a9099;
  --pri:#2563eb; --pri-bg:#eaf1fe; --pri-br:#bcd0f8;
  --ok:#15803d; --ok-bg:#e8f6ed;
  --warn:#b45309; --warn-bg:#fdf2e0;
  --danger:#dc2626; --danger-bg:#fdeaea;
  --info:#6d3fd4; --info-bg:#f0ebfd;
  --teal:#0f766e; --teal-bg:#e4f5f3;
  --v1:#2563eb; --v2:#c2410c; --v3:#15803d; --v4:#a16207;
  --grid:#ebedf0; --axis:#c3c8ce;
  --avatar-bg:#e2e8f0;
  --av-yz-bg:#dbeafe; --av-yz-fg:#1d4ed8;
  --av-lily-bg:#f3e8ff; --av-lily-fg:#7e22ce;
  --hover-overlay:rgba(0,0,0,.035);
  --scroll-thumb:#cfd3d8; --scroll-thumb-hover:#aeb5bd;
  --shadow:0 18px 44px rgba(20,24,30,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover)}
::-webkit-scrollbar-track{background:transparent}

/* ==================== shell ==================== */
.app{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:48px auto 1fr;min-height:100vh;min-height:100dvh}
.topbar{grid-column:1/-1;min-width:0;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .mk{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#6cb6ff,#a78bf5);flex:none}
.brand b{font-size:13.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.topspacer{flex:1}
.tbtn{height:28px;padding:0 10px;border:1px solid var(--border-2);border-radius:7px;color:var(--text-2);font-size:12px;display:inline-flex;align-items:center;gap:6px;background:var(--surface-2)}
.tbtn:hover{background:var(--surface-3);color:var(--text)}
.who{display:flex;align-items:center;gap:7px;padding:3px 9px 3px 3px;border:1px solid var(--border-2);border-radius:999px;font-size:12px}
.avatar{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:650;background:var(--avatar-bg);color:var(--text-2);flex:none}
.av-yz{background:var(--av-yz-bg);color:var(--av-yz-fg)}
.av-lily{background:var(--av-lily-bg);color:var(--av-lily-fg)}
.av-cli{background:var(--warn-bg);color:var(--warn)}

/* 左軌道 */
.rail{grid-row:2/-1;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:3px;position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto}
.rail i{width:58px;height:50px;border-radius:9px;display:grid;place-items:center;gap:2px;font-style:normal;font-size:10.5px;color:var(--text-3);line-height:1.1;text-align:center;cursor:default}
.rail i svg{width:17px;height:17px}
.rail i.on{background:var(--pri-bg);color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri-br)}
.rail .sp{flex:1}

/* 提案說明條 */
.pnote{grid-column:2;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;padding:9px 20px;background:var(--info-bg);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text-2)}
.pnote b{color:var(--info);font-size:12.5px;letter-spacing:.01em}
.pnote .k{color:var(--text-3);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.pnote em{font-style:normal;color:var(--text)}

main{grid-column:2;min-width:0;display:flex;flex-direction:column}
</style>
<style>
/* ==================== 專案頁首 ==================== */
.phead{padding:14px 20px 0;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:48px;z-index:30}
.ptitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ptitle h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.015em}
.ptitle .legacy{font-family:var(--mono);font-size:11.5px;color:var(--text-3);border:1px solid var(--border-2);border-radius:5px;padding:1px 6px}
.ptitle .sub{font-size:12px;color:var(--text-3)}
.psw{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.psw button{flex:none;height:28px;padding:0 11px;border-radius:7px;border:1px solid transparent;color:var(--text-3);font-size:12.5px;white-space:nowrap}
.psw button:hover{background:var(--surface-2);color:var(--text-2)}
.psw button.on{background:var(--surface-3);border-color:var(--border-2);color:var(--text);font-weight:600}
.psw button .n{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-right:5px}
.psw button.on .n{color:var(--pri)}

/* 資源抽屜入口（五大資源） */
.res{display:flex;gap:7px;flex-wrap:wrap;padding:10px 0 11px}
.rchip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface-2);font-size:12.5px;color:var(--text-2)}
.rchip:hover{background:var(--surface-3);border-color:var(--border-3);color:var(--text)}
.rchip svg{width:14px;height:14px;opacity:.85}
.rchip .cnt{font-family:var(--mono);font-size:10.5px;background:var(--surface-4);color:var(--text-2);border-radius:5px;padding:0 5px;line-height:16px}
.rchip .cnt.hot{background:var(--warn-bg);color:var(--warn)}
.rchip.dis{opacity:.5;cursor:not-allowed;border-style:dashed;background:transparent}
.rchip.dis:hover{background:transparent;border-color:var(--border-2);color:var(--text-2)}
.rchip.dis .off{font-size:10.5px;font-family:var(--mono);color:var(--text-3);border:1px solid var(--border-2);border-radius:4px;padding:0 4px}

/* 期尺（phase ruler）— 「期」這一層在時間軸上的總覽 */
.ruler{display:flex;gap:3px;padding:0 0 11px;overflow-x:auto}
.cyc{flex:none;min-width:150px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface-2);padding:7px 10px;text-align:left}
.cyc:hover{border-color:var(--border-3)}
.cyc.now{border-color:var(--pri-br);background:var(--pri-bg)}
.cyc .ct{font-size:12.5px;font-weight:650;display:flex;align-items:center;gap:6px}
.cyc .ct .ord{font-family:var(--mono);font-size:10px;color:var(--text-3);border:1px solid var(--border-2);border-radius:4px;padding:0 4px}
.cyc.now .ct .ord{color:var(--pri);border-color:var(--pri-br)}
.cyc .cd{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin-top:2px}
.stg{display:flex;gap:3px;margin-top:6px}
.stg span{flex:1;height:4px;border-radius:2px;background:var(--surface-4)}
.stg span.done{background:var(--ok)}
.stg span.cur{background:var(--pri)}
.stg span.rep{background:repeating-linear-gradient(90deg,var(--pri) 0 3px,transparent 3px 6px)}
.cyc .cs{font-size:10.5px;color:var(--text-3);margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.cyc .cs b{font-weight:500;color:var(--text-2)}

/* 篩選列 */
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 0 10px}
.fchip{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:transparent;font-size:12px;color:var(--text-3);display:inline-flex;align-items:center;gap:6px}
.fchip:hover{background:var(--surface-2);color:var(--text-2)}
.fchip.on{background:var(--surface-3);border-color:var(--border-3);color:var(--text);font-weight:600}
.fchip .d{width:7px;height:7px;border-radius:50%}
.fchip .n{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.fsep{width:1px;height:18px;background:var(--border);margin:0 3px}
.fhint{font-size:11.5px;color:var(--text-3);margin-left:auto}

/* ==================== 時間流 ==================== */
.flowwrap{flex:1;min-height:0;padding:0 20px 120px}
.flow{max-width:860px;margin:0 auto;position:relative}
.ddiv{position:sticky;top:calc(48px + var(--headh,230px));z-index:12;display:flex;align-items:center;gap:10px;padding:14px 0 8px;background:linear-gradient(var(--bg) 72%,transparent)}
.ddiv .dd{font-family:var(--mono);font-size:11.5px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 7px}
.ddiv .dw{font-size:11px;color:var(--text-3)}
.ddiv .dl{flex:1;height:1px;background:var(--border)}

/* 期分隔器：時間流上「二期從哪一天開始」的斷點 */
.cycbreak{margin:26px 0 6px;border:1px solid var(--pri-br);border-radius:10px;background:var(--pri-bg);padding:12px 14px;position:relative}
.cycbreak .cbh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cycbreak .cbh b{font-size:14px;color:var(--text)}
.cycbreak .cbh .ord{font-family:var(--mono);font-size:10.5px;color:var(--pri);border:1px solid var(--pri-br);border-radius:5px;padding:0 5px}
.cycbreak .cbh .dt{font-family:var(--mono);font-size:11.5px;color:var(--text-2)}
.cycbreak p{margin:7px 0 0;font-size:12.5px;color:var(--text-2)}
.cycbreak .cbtags{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap}

/* 階段 sticky 小標 */
.stgband{display:inline-flex;align-items:center;gap:7px;margin:12px 0 4px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border-2);font-size:11.5px;color:var(--text-2)}
.stgband .k{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.stgband .dot{width:7px;height:7px;border-radius:50%;background:var(--pri)}

/* 事件卡 */
.ev{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative}
.evspine{position:relative}
.evspine::before{content:"";position:absolute;left:14px;top:0;bottom:-14px;width:1px;background:var(--border)}
.ev:last-child .evspine::before{bottom:auto;height:22px}
.evdot{position:absolute;left:8px;top:14px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:2px solid var(--border-3);z-index:1}
.evcard{border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.evcard:hover{border-color:var(--border-2)}
.evtop{display:flex;align-items:flex-start;gap:9px;padding:11px 13px;width:100%;text-align:left}
.evtop .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px}
.evtop .ic svg{width:14px;height:14px}
.evmain{flex:1;min-width:0}
.evttl{font-size:13.5px;font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.evsub{font-size:12px;color:var(--text-2);margin-top:3px}
.evmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.evtime{font-family:var(--mono);font-size:10.5px;color:var(--text-3);flex:none;margin-top:3px}
.caret{flex:none;color:var(--text-3);transition:transform .14s;margin-top:4px}
.evcard.open .caret{transform:rotate(90deg)}
.evbody{display:none;padding:0 13px 13px 48px;border-top:1px solid var(--border);margin-top:-1px}
.evcard.open .evbody{display:block;padding-top:12px}
</style>
<style>
/* ==================== 標籤 ==================== */
.tag{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;border-radius:5px;font-size:10.5px;font-family:var(--mono);letter-spacing:.01em;border:1px solid transparent;white-space:nowrap}
.t-ms{background:var(--warn-bg);color:var(--warn)}
.t-mt{background:var(--teal-bg);color:var(--teal)}
.t-fi{background:var(--info-bg);color:var(--info)}
.t-ch{background:var(--pri-bg);color:var(--pri)}
.t-mo{background:var(--ok-bg);color:var(--ok)}
.t-ct{background:var(--surface-3);color:var(--text-2)}
.t-gp{background:var(--danger-bg);color:var(--danger)}
.t-int{background:var(--danger-bg);color:var(--danger);border-color:rgba(239,138,130,.3)}
.t-cli{background:var(--ok-bg);color:var(--ok);border-color:rgba(95,208,154,.3)}
.t-sys{background:var(--surface-3);color:var(--text-3)}
.t-pl{background:transparent;color:var(--text-3);border-color:var(--border-2)}
.t-hot{background:var(--danger-bg);color:var(--danger)}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.who-s{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-2)}
.who-s .avatar{width:17px;height:17px;font-size:9px}

/* 四屬性框（會議） */
.attr{display:grid;grid-template-columns:86px 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:11px}
.attr dt{background:var(--surface-2);padding:7px 10px;font-size:11.5px;color:var(--text-3);margin:0}
.attr dd{background:var(--surface);padding:7px 10px;font-size:12.5px;margin:0;min-width:0}
.attr dd .edit{border:1px dashed transparent;border-radius:5px;padding:1px 4px;margin:-1px -4px;display:block;width:100%;text-align:left;font-size:12.5px;color:var(--text);white-space:pre-wrap}
.attr dd .edit:hover{border-color:var(--border-3);background:var(--hover-overlay)}
.attr dd .edit.ph{color:var(--text-3);font-style:italic}
.attr dd textarea{width:100%;background:var(--surface-2);border:1px solid var(--pri-br);border-radius:6px;padding:5px 7px;font-size:12.5px;resize:vertical;min-height:52px}
.ebar{display:flex;gap:6px;margin-top:6px}

/* 檔案列 */
.files{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.frow{display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--surface);font-size:12.5px}
.frow:hover{background:var(--surface-2)}
.fkind{font-family:var(--mono);font-size:9.5px;color:var(--text-3);background:var(--surface-3);border-radius:4px;padding:1px 5px;flex:none;width:40px;text-align:center}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsz{font-family:var(--mono);font-size:10.5px;color:var(--text-3);flex:none}
.fset{font-size:11px;color:var(--text-3);margin:9px 0 5px;display:flex;align-items:center;gap:7px}
.fset .ln{flex:1;height:1px;background:var(--border)}

/* 小按鈕 */
.btn{height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--border-2);background:var(--surface-2);font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-3);color:var(--text)}
.btn.pri{background:var(--pri-bg);border-color:var(--pri-br);color:var(--pri)}
.btn.pri:hover{background:var(--pri-br);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:22px;padding:0 8px;font-size:11px}

.note{font-size:11.5px;color:var(--text-3);border-left:2px solid var(--border-2);padding-left:9px;margin:9px 0 0}
.gap{border:1px dashed var(--danger);background:var(--danger-bg);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--text)}
.gap b{color:var(--danger)}

/* 訊息摘要（聊天室日摘要） */
.msgs{display:flex;flex-direction:column;gap:9px}
.msg{display:flex;gap:8px;font-size:12.5px}
.msg .bd{flex:1;min-width:0}
.msg .nm{font-size:11.5px;color:var(--text-2);display:flex;gap:7px;align-items:baseline}
.msg .nm time{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.msg .tx{margin-top:1px}
.msg.pin .tx{border-left:2px solid var(--warn);padding-left:8px}

/* ==================== 底部記一筆 ==================== */
.composer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 26%);padding:18px 20px 16px;z-index:14}
.cinner{max-width:860px;margin:0 auto;border:1px solid var(--border-2);border-radius:11px;background:var(--surface);padding:9px 10px;box-shadow:var(--shadow)}
.crow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.crow select,.crow input[type=date]{height:28px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:7px;padding:0 7px;font-size:12px;color:var(--text)}
.crow input[type=text]{flex:1;min-width:160px;height:28px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:7px;padding:0 9px;font-size:12.5px}
.crow input[type=text]:focus{border-color:var(--pri-br);outline:none}
.chint{font-size:11px;color:var(--text-3);margin-top:6px}

/* ==================== 側抽屜 ==================== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .16s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,96vw);background:var(--surface);border-left:1px solid var(--border-2);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .18s ease;z-index:51;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex:none}
.dhead h2{margin:0;font-size:14.5px;font-weight:650;flex:1}
.dhead .k{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.dbody{flex:1;overflow:auto;padding:13px 14px 30px}

.tdst{padding:10px 13px}
.empty{padding:34px 16px;text-align:center;color:var(--text-3);font-size:12.5px}

<script>
"use strict";
/* ============================ 狀態 ============================ */
var S = { p:0, kinds:null, cyc:null, open:{}, drawer:null, tidy:false, sel:{}, dst:null, edit:null };

function $(s,r){return (r||document).querySelector(s);}
function el(t,c,x){var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m];});}
function P(){return PROJECTS[S.p];}
function svg(d,w){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.7)+'" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>';}
var WD=['日','一','二','三','四','五','六'];
function wd(ds){var p=ds.split('-');return '週'+WD[new Date(+p[0],+p[1]-1,+p[2]).getDay()];}
/* [約束5] 可見性標籤：哪些資料是 internal、不可對客戶可見 */
function visTag(v){
  if(v==='cli') return '<span class="tag t-cli">對客戶可見</span>';
  if(v==='own') return '<span class="tag t-int">限 Owner</span>';
  return '<span class="tag t-int">僅內部</span>';
}

/* ============================ 頁首 ============================ */
function paintHead(){
  var p=P();
  $('#pName').textContent=p.name;
  $('#pLegacy').textContent=p.legacy;
  var st=$('#pStage'); st.className='tag '+p.stageCls; st.textContent=p.stage;
  $('#pSub').textContent=p.client+' · '+p.sub;

  var sw=$('#pSwitch'); sw.innerHTML='';
  PROJECTS.forEach(function(q,i){
    var b=el('button',i===S.p?'on':'');
    b.innerHTML='<span class="n">'+q.no+'</span>'+esc(q.legacy.replace(/^\d+\./,''));
    b.onclick=function(){S.p=i;S.open={};S.cyc=null;S.tidy=false;S.sel={};closeDrawer();paintAll();window.scrollTo(0,0);};
    sw.appendChild(b);
  });
  paintRes(); paintRuler(); paintFilters();
}

/* [約束3][約束7] 五大資源入口：收件匣不是分頁而是硬碟抽屜裡的真資料夾；LINE 停用 */
function paintRes(){
  var p=P(), bar=$('#resBar'); bar.innerHTML='';
  function chip(key,label,icon,cnt,hot){
    var b=el('button','rchip'); b.innerHTML=svg(icon)+'<span>'+label+'</span>'+(cnt!=null?'<span class="cnt'+(hot?' hot':'')+'">'+cnt+'</span>':'');
    b.onclick=function(){openDrawer(key);}; bar.appendChild(b);
  }
  var nf=0; (function cf(ns){ns.forEach(function(n){nf+=(n.f||0);if(n.kids)cf(n.kids);});})(p.drive);
  chip('drive','雲端硬碟','M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',nf);
  chip('meet','會議','M17 11a5 5 0 1 0-10 0M3 20c0-3 3-5 6-5M15 15c3 0 6 2 6 5',p.meetings.length);
  chip('chat','聊天室','M21 12a8 8 0 1 1-3.2-6.4L21 4l-1 4.6A8 8 0 0 1 21 12z',p.chatCh.reduce(function(a,c){return a+c.open;},0));
  chip('plan','工作計劃','M12 3l8 5-8 5-8-5zM4 13l8 5 8-5',p.plan.length);
  /* [約束3] 收件匣以「真資料夾」的身分出現，點它直接進硬碟抽屜並選中那個節點 */
  var ib=el('button','rchip');
  ib.innerHTML=svg('M4 13h4l2 3h4l2-3h4M4 13l2-8h12l2 8v6H4z')+'<span>收件匣</span><span class="cnt'+(p.inbox.length?' hot':'')+'">'+p.inbox.length+' 待整理</span>';
  ib.onclick=function(){openDrawer('drive',true);}; bar.appendChild(ib);
  /* [約束7] LINE 僅以停用狀態的入口呈現，不假裝可用 */
  var ln=el('button','rchip dis');
  ln.setAttribute('aria-disabled','true');
  ln.title='本階段不實作（PLN-075 OD-H）。技術上也拿不回 bot 加入前的歷史訊息；LINE Notify 已於 2025-03-31 終止服務。';
  ln.innerHTML=svg('M21 11c0 4-4 7-9 7-1 0-2-.1-3-.4L4 20l1.2-3A7.6 7.6 0 0 1 3 11c0-4 4-7 9-7s9 3 9 7z')+'<span>LINE 群</span><span class="off">未啟用</span>';
  ln.onclick=function(e){e.preventDefault();};
  bar.appendChild(ln);
}
</script>
<script>
"use strict";
/* [約束2] 期尺：——「期」是獨立的一層，不是平面 enum。
   同一期內 執行→驗收 可以重複，色段以虛線表示重複段。 */
function paintRuler(){
  var p=P(), r=$('#ruler'); r.innerHTML='';
  p.cycles.forEach(function(c){
    var b=el('button','cyc'+(S.cyc===c.ord?' now':''));
    var seg=c.stages.map(function(s){return '<span class="'+(s.s==='done'?'done':s.s==='cur'?'cur':'')+'" title="'+esc(s.k)+'"></span>';}).join('');
    b.innerHTML='<div class="ct"><span class="ord">期 '+c.ord+'</span>'+esc(c.title.split(' · ')[1]||c.title)+'</div>'+
      '<div class="cd">'+c.from+' → '+(c.to||'進行中')+'</div>'+
      '<div class="stg">'+seg+'</div>'+
      '<div class="cs">'+c.stages.map(function(s){return '<b>'+esc(s.k)+'</b>';}).join('·')+'</div>';
    b.onclick=function(){S.cyc=(S.cyc===c.ord?null:c.ord);paintRuler();paintFlow();};
    r.appendChild(b);
  });
  var all=el('button','cyc'+(S.cyc===null?' now':''));
  all.style.minWidth='104px';
  all.innerHTML='<div class="ct">全部期</div><div class="cd">'+p.cycles.length+' 期 · 階層 期→階段→里程碑→任務</div>';
  all.onclick=function(){S.cyc=null;paintRuler();paintFlow();};
  r.appendChild(all);
}

/* 篩選列＝入流規則的操作面 */
function paintFilters(){
  var p=P(), f=$('#filters'); f.innerHTML='';
  var counts={}; p.events.forEach(function(e){counts[e.kind]=(counts[e.kind]||0)+1;});
  var order=['milestone','meeting','file','chat','money','contract','gap','tidy'];
  var all=el('button','fchip'+(S.kinds===null?' on':''),null);
  all.innerHTML='全部 <span class="n">'+p.events.length+'</span>';
  all.onclick=function(){S.kinds=null;paintFilters();paintFlow();};
  f.appendChild(all);
  f.appendChild(el('span','fsep'));
  order.forEach(function(k){
    if(!counts[k])return;
    var on=S.kinds&&S.kinds[k];
    var b=el('button','fchip'+(on?' on':''));
    b.innerHTML='<span class="d" style="background:'+KINDS[k].color+'"></span>'+KINDS[k].label+' <span class="n">'+counts[k]+'</span>';
    b.onclick=function(){
      if(S.kinds===null){S.kinds={};S.kinds[k]=1;}
      else if(S.kinds[k]){delete S.kinds[k]; if(!Object.keys(S.kinds).length)S.kinds=null;}
      else S.kinds[k]=1;
      paintFilters();paintFlow();
    };
    f.appendChild(b);
  });
  var hint=el('button','fhint');
  hint.textContent='入流規則：哪些事進流、哪些不進 ↗';
  hint.onclick=function(){openDrawer('rules');};
  f.appendChild(hint);
}
</script>
<script>
"use strict";
/* ============================ 時間流 ============================ */
function paintFlow(){
  var p=P(), f=$('#flow'); f.innerHTML='';
  var evs=p.events.filter(function(e){
    if(S.cyc!==null && e.cyc!==S.cyc) return false;
    if(S.kinds && !S.kinds[e.kind]) return false;
    return true;
  });
  if(!evs.length){
    f.appendChild(el('div','empty','這個篩選條件下沒有事件。時間流只收「事件」，不收每一次編輯與每一則訊息。'));
    return;
  }
  var lc=null, ls=null, ld=null;
  evs.forEach(function(e,i){
    if(e.cyc!==lc){
      var c=p.cycles.filter(function(x){return x.ord===e.cyc;})[0];
      if(c) f.appendChild(cycBreak(c, lc!==null));
      lc=e.cyc; ls=null; ld=null;
    }
    if(e.stg!==ls){
      var band=el('div','stgband');
      band.innerHTML='<span class="dot"></span><span class="k">階段</span>'+esc(e.stg)+
        '<span class="k">期 '+e.cyc+'</span>';
      f.appendChild(band); ls=e.stg;
    }
    if(e.d!==ld){
      var dv=el('div','ddiv');
      dv.innerHTML='<span class="dd">'+e.d+'</span><span class="dw">'+wd(e.d)+'</span><span class="dl"></span>';
      f.appendChild(dv); ld=e.d;
    }
    f.appendChild(evCard(e,i));
  });
  var tail=el('div','note');
  tail.innerHTML='流到這裡為止。往下是「記一筆」—— 新增的事件會自動落到它所屬的那一天、那一期、那一個階段。';
  f.appendChild(tail);
}

/* [約束2] 期分隔器：時間流上「二期從哪一天開始」的斷點 */
function cycBreak(c, mid){
  var d=el('div','cycbreak');
  var h='<div class="cbh"><span class="ord">期 '+c.ord+'</span><b>'+esc(c.title)+'</b>'+
    '<span class="dt">'+c.from+' 起'+(c.to?' · 至 '+c.to:'')+'</span>'+
    (mid?'<span class="tag t-hot">時間軸斷點</span>':'')+'</div>';
  h+='<p>'+esc(c.note)+'</p>';
  h+='<div class="cbtags">'+
    '<span class="tag t-ct">合約：'+esc(c.contract)+'</span>'+
    '<span class="tag t-ct">金額：'+esc(c.budget)+'</span>'+
    c.stages.map(function(s){
      return '<span class="tag '+(s.s==='done'?'t-ok':s.s==='cur'?'t-warn':'t-pl')+'">'+esc(s.k)+'</span>';
    }).join('')+'</div>';
  d.innerHTML=h;
  return d;
}

function tagsHtml(e){
  var t=(e.tags||[]).map(function(x){return '<span class="tag '+x[0]+'">'+esc(x[1])+'</span>';}).join('');
  return t;
}

function evCard(e,i){
  var K=KINDS[e.kind];
  var wrap=el('div','ev');
  var sp=el('div','evspine'); sp.innerHTML='<span class="evdot" style="border-color:'+K.color+'"></span>';
  var card=el('div','evcard'+(S.open[e.d+'#'+i]?' open':''));
  var top=el('button','evtop');
  top.innerHTML='<span class="ic '+K.cls+'" style="color:'+K.color+'">'+svg(K.ic)+'</span>'+
    '<span class="evmain"><span class="evttl">'+esc(e.title)+'<span class="tag '+K.cls+'">'+K.label+'</span>'+tagsHtml(e)+'</span>'+
    (e.sub?'<span class="evsub">'+esc(e.sub)+'</span>':'')+'</span>'+
    '<span class="evtime">'+(e.t&&e.t!=='—'?e.t:'')+'</span>'+
    '<span class="caret">›</span>';
  top.onclick=function(){var k=e.d+'#'+i; S.open[k]=!S.open[k]; card.classList.toggle('open');};
  card.appendChild(top);
  var body=el('div','evbody');
  body.innerHTML=evBody(e,i);
  card.appendChild(body);
  wireBody(body,e,i);
  var right=el('div'); right.appendChild(card);
  wrap.appendChild(sp); wrap.appendChild(right);
  return wrap;
}
</script>
<script>
"use strict";
function fileRows(fs){
  return '<div class="files">'+fs.map(function(f){
    return '<div class="frow"><span class="fkind">'+esc(f.k)+'</span><span class="fname">'+esc(f.n)+'</span>'+
      (f.s&&f.s!=='—'?'<span class="fsz">'+esc(f.s)+'</span>':'')+visTag(f.v)+'</div>';
  }).join('')+'</div>';
}

function evBody(e,i){
  var h='';
  /* [約束4] 會議資料夾四個屬性（參與者、產生時間、結論、注意事項），屬性跟著資料夾 */
  if(e.kind==='meeting'&&e.meeting){
    var m=e.meeting;
    h+='<div class="fset"><span>會議資料夾屬性 · 一個資料夾＝一場會議</span><span class="ln"></span><span class="tag t-mt">folder.role = meeting</span></div>';
    h+='<dl class="attr">'+
      '<dt>參與者</dt><dd>'+esc(m.who)+'</dd>'+
      '<dt>產生時間</dt><dd>'+esc(m.born)+'</dd>'+
      '<dt>結論</dt><dd>'+fieldBtn(i,'recap',m.recap,'（尚未填寫結論，點一下填）')+'</dd>'+
      '<dt>注意事項</dt><dd>'+fieldBtn(i,'caution',m.caution,'（尚未填寫注意事項，點一下填）')+'</dd>'+
      '</dl>';
    h+='<div class="fset"><span>夾內材料 · 會議四件套（錄音／逐字稿／完整紀錄／摘要）</span><span class="ln"></span><span class="tag t-pl">'+
      m.kit.filter(function(k){return k.have;}).length+' / '+m.kit.length+' 已有</span></div>';
    h+='<div class="files">'+m.kit.map(function(k){
      return '<div class="frow"'+(k.have?'':' style="opacity:.55"')+'><span class="fkind">'+esc(k.k)+'</span>'+
        '<span class="fname">'+esc(k.n)+(k.have?'':' <span class="tag t-pl">缺</span>')+'</span>'+
        (k.s&&k.s!=='—'?'<span class="fsz">'+esc(k.s)+'</span>':'')+visTag(k.v)+'</div>';
    }).join('')+'</div>';
    if(m.extra) h+='<p class="note">'+esc(m.extra)+'</p>';
    h+='<div class="ebar"><button class="btn sm" data-act="openmeet">在會議抽屜裡開啟 ↗</button>'+
       '<button class="btn sm" data-act="toTask">把待辦升級成任務</button></div>';
  }
  if(e.files) h+=(e.kind==='meeting'?'':'<div class="fset"><span>這一則收攏的檔案</span><span class="ln"></span><span class="tag t-pl">逐檔不進流</span></div>')+fileRows(e.files);
  if(e.chat){
    h+='<div class="fset"><span>當天訊息</span><span class="ln"></span><span class="tag t-pl">一天＝一則，展開才看</span></div>';
    h+='<div class="msgs">'+e.chat.map(function(m){
      return '<div class="msg'+(m.pin?' pin':'')+'"><span class="avatar '+m.w.c+'">'+m.w.a+'</span>'+
        '<span class="bd"><span class="nm">'+esc(m.w.n)+'<time>'+m.t+'</time>'+(m.pin?'<span class="tag t-warn">⚑ 已標成決議</span>':'')+'</span>'+
        '<span class="tx">'+esc(m.x)+'</span></span></div>';
    }).join('')+'</div>';
    h+='<p class="note">只有被標成決議或升級成任務的訊息會另外變成流上的一則。其餘留在抽屜的完整訊息串裡，不淹掉時間流。</p>';
    h+='<div class="ebar"><button class="btn sm" data-act="openchat">開啟完整訊息串 ↗</button></div>';
  }
  if(e.kind==='gap'){
    h+='<div class="gap"><b>缺口：</b>'+esc(e.gap)+'</div>';
    h+='<p class="note">'+esc(e.todo)+'</p>';
    h+='<div class="ebar"><button class="btn sm pri" data-act="fixgap">標記已補</button></div>';
  }
  if(e.kind==='tidy'){
    h+='<p class="note">整理是空間性的工作，不適合在時間序上做。整理模式有自己的版面（收件匣 × 資料夾樹），流上只留這一則結果。</p>';
    h+='<div class="ebar"><button class="btn sm" data-act="tidy">開啟整理模式 ↗</button></div>';
  }
  if(e.note) h+='<p class="note">'+esc(e.note)+'</p>';
  if(!h) h='<p class="note">這一則沒有附帶材料。</p>';
  return h;
}

function fieldBtn(i,key,val,ph){
  var k='f'+i+'-'+key;
  if(S.edit===k) return '<textarea data-ed="'+k+'">'+esc(val||'')+'</textarea>'+
    '<div class="ebar"><button class="btn sm pri" data-save="'+k+'">儲存</button><button class="btn sm" data-cancel="1">取消</button></div>';
  return '<button class="edit'+(val?'':' ph')+'" data-field="'+k+'">'+esc(val||ph)+'</button>';
}

function wireBody(body,e,i){
  Array.prototype.forEach.call(body.querySelectorAll('[data-field]'),function(b){
    b.onclick=function(){S.edit=b.getAttribute('data-field');paintFlow();
      var ta=document.querySelector('[data-ed="'+S.edit+'"]'); if(ta){ta.focus();ta.selectionStart=ta.value.length;}};
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-save]'),function(b){
    b.onclick=function(){
      var k=b.getAttribute('data-save'), ta=document.querySelector('[data-ed="'+k+'"]');
      var key=k.split('-')[1];
      if(e.meeting) e.meeting[key]=ta.value.trim();
      S.edit=null; paintFlow(); toast('會議屬性已更新：'+(key==='recap'?'結論':'注意事項')+'（屬性存在資料夾上，夾內材料換了也不動）');
    };
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-cancel]'),function(b){
    b.onclick=function(){S.edit=null;paintFlow();};
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-act]'),function(b){
    var a=b.getAttribute('data-act');
    b.onclick=function(){
      if(a==='openmeet')openDrawer('meet');
      else if(a==='openchat')openDrawer('chat');
      else if(a==='tidy')enterTidy();
      else if(a==='fixgap'){e.tags=[['t-ok','已補成合約條款']];e.kind='contract';paintFlow();paintFilters();toast('已把這個外部缺口標記為已補；它在流上改記成合約事件。');}
      else if(a==='toTask'){openDrawer('plan');toast('會議待辦 → 任務：在工作計劃抽屜裡挑一個里程碑掛上去。');}
    };
  });
}
</script>
<script>
"use strict";
/* ============================ 側抽屜 ============================ */
var DRAWER_META={
  drive:{t:'雲端硬碟',k:'resource ② · project_folder tree'},
  meet :{t:'會議',    k:'resource ⑤ · folder.role = meeting'},
  chat :{t:'專案聊天室',k:'resource ① · 一列一訊息'},
  plan :{t:'工作計劃',k:'resource ③ · 期→階段→里程碑→任務'},
  rules:{t:'時間流的入流規則',k:'event granularity'}
};
function openDrawer(which,focusInbox){
  S.drawer=which; if(focusInbox)S.focusInbox=true;
  var m=DRAWER_META[which];
  $('#dTitle').textContent=m.t; $('#dKey').textContent=m.k;
  $('#dBody').innerHTML=''; $('#dBody').appendChild(drawerBody(which));
  $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden','false');
  $('#scrim').classList.add('on');
}
function closeDrawer(){S.drawer=null;S.focusInbox=false;$('#drawer').classList.remove('on');$('#drawer').setAttribute('aria-hidden','true');$('#scrim').classList.remove('on');}

function drawerBody(which){
  var p=P(), w=el('div');
  if(which==='drive'){
    w.innerHTML='<p class="note" style="margin-top:0">時間流只記<b>檔案事件</b>。多層資料夾的瀏覽與整理是空間性的工作，放在這裡與「整理模式」，不塞進時間序。</p>'+
      '<div class="dsec">專案硬碟 · '+esc(p.legacy)+'</div>';
    var tw=el('div','tree'); tw.appendChild(treeNodes(p.drive,0)); w.appendChild(tw);
    var b=el('div'); b.style.marginTop='14px';
    b.innerHTML='<button class="btn pri" id="goTidy">整理收件匣（'+p.inbox.length+'）→</button> <button class="btn" id="mkFolder">＋ 新資料夾</button>';
    w.appendChild(b);
    w.appendChild(hint('資料夾慣例直接沿用 Owner 現場已在用的那一套：[共用]（對客戶那一層）、開案前 → 專案啟動［正式資料］、YYYYMMDD_Mnn_（＝里程碑序列）、YYYYMMDD 事件（＝會議）、(僅內部)、修改需求／第二次修改（＝二期入口）。系統不另設 01_Docs / 02_Assets。'));
    setTimeout(function(){
      var g=$('#goTidy'); if(g)g.onclick=function(){closeDrawer();enterTidy();};
      var f=$('#mkFolder'); if(f)f.onclick=function(){toast('原型：新資料夾會建在目前選中的節點底下；收件匣與根是系統資料夾，不可改名、不可刪除。');};
    },0);
  }
  else if(which==='meet'){
    w.innerHTML='<p class="note" style="margin-top:0">會議是時序的，所以它在時間流上是原生公民。這裡是同一批會議的<b>時間序清單</b>，每一場就是硬碟裡的一個資料夾。</p>';
    if(!p.meetings.length) w.appendChild(el('div','empty','這個專案還沒有會議資料夾。在底下「記一筆」選「會議」就會同時建一個。'));
    p.meetings.forEach(function(m){
      var c=el('div','evcard'); c.style.marginBottom='9px';
      c.innerHTML='<div class="evtop"><span class="ic t-mt" style="color:var(--teal)">'+svg(KINDS.meeting.ic)+'</span>'+
        '<span class="evmain"><span class="evttl">'+m.d+' '+esc(m.n)+'</span>'+
        '<span class="evsub">參與者：'+esc(m.who)+' · 四件套 '+m.kit+'/4'+(m.kit>=4?'':' <span class="tag t-pl">缺 '+(4-m.kit)+'</span>')+'</span></span></div>';
      w.appendChild(c);
    });
    w.appendChild(hint('四個屬性（參與者／產生時間／結論／注意事項）存在資料夾上，不是存在某一個檔案上。夾內可以放錄音、逐字稿、完整紀錄、摘要、決策分析等多種材料，換掉任何一份都不影響屬性。'));
  }
  else if(which==='chat'){
    w.innerHTML='<p class="note" style="margin-top:0">完整訊息串住在這裡。時間流上只有<b>一天一則的折疊摘要</b>，加上被標成決議或升級成任務的那幾則——這是避免聊天把流淹掉的做法。</p>';
    p.chatCh.forEach(function(c){
      var r=el('div','frow'); r.style.border='1px solid var(--border)'; r.style.borderRadius='8px'; r.style.marginBottom='7px';
      r.innerHTML='<span class="fkind">'+(c.open?'open':'—')+'</span><span class="fname">'+esc(c.n)+'</span><span class="fsz">'+esc(c.last)+'</span>';
      w.appendChild(r);
    });
    var lastChat=null; p.events.forEach(function(e){if(e.chat)lastChat=e;});
    if(lastChat){
      w.appendChild(el('div','dsec','最近一天 · '+lastChat.d));
      var m=el('div','msgs'); m.innerHTML=lastChat.chat.map(function(x){
        return '<div class="msg'+(x.pin?' pin':'')+'"><span class="avatar '+x.w.c+'">'+x.w.a+'</span><span class="bd">'+
          '<span class="nm">'+esc(x.w.n)+'<time>'+x.t+'</time></span><span class="tx">'+esc(x.x)+'</span></span></div>';
      }).join(''); w.appendChild(m);
    }
    w.appendChild(hint('訊息 → 任務、結論 → 決議兩條升級路徑都從這裡走；升級的那一刻會在時間流上長出獨立的一則。'));
  }
  else if(which==='plan'){
    w.innerHTML='<p class="note" style="margin-top:0">階層是 <b>期 → 階段 → 里程碑 → 任務</b>。時間流負責「什麼時候發生」，這裡負責「結構長什麼樣」。</p>';
    p.cycles.forEach(function(c){
      w.appendChild(el('div','dsec','期 '+c.ord+' · '+c.title+'（'+c.from+' → '+(c.to||'進行中')+'）'));
      var st=el('div'); st.style.margin='0 0 8px';
      st.innerHTML=c.stages.map(function(s){return '<span class="tag '+(s.s==='done'?'t-ok':s.s==='cur'?'t-warn':'t-pl')+'" style="margin-right:5px">'+esc(s.k)+'</span>';}).join('');
      w.appendChild(st);
      p.plan.filter(function(m){return m.cyc===c.ord;}).forEach(function(m){
        var c2=el('div','evcard'); c2.style.marginBottom='7px';
        var tk=m.tasks.map(function(t){
          return '<div class="frow"><span class="fkind">'+t[0]+'</span><span class="fname">'+esc(t[1])+'</span>'+
            '<span class="tag '+(t[2]==='done'?'t-ok':'t-pl')+'">'+(t[2]==='done'?'完成':'未完成')+'</span></div>';
        }).join('');
        c2.innerHTML='<div class="evtop"><span class="ic t-ms" style="color:var(--warn)">'+svg(KINDS.milestone.ic)+'</span>'+
          '<span class="evmain"><span class="evttl">'+m.m+' '+esc(m.n)+'<span class="tag '+(m.d==='日期待補'?'t-pl':'t-ct')+'">'+m.d+'</span>'+
          (m.s==='done'?'<span class="tag t-ok">已達成</span>':'')+'</span>'+
          (tk?'<span class="evsub">'+m.tasks.length+' 個任務（TODO／REVIEW 兩種型別）</span>':'<span class="evsub">尚未掛任務</span>')+'</span></div>'+
          (tk?'<div class="files" style="margin:0 13px 11px 48px">'+tk+'</div>':'');
        w.appendChild(c2);
      });
    });
    w.appendChild(hint('「日期待補」沿用既有語彙：沒有日期的里程碑不進時間流、不進日曆——刻意不猜日期。加三期只要插一列，不需要 migration。'));
  }
  else if(which==='rules'){
    w.appendChild(el('div','dsec','一則的粒度 ＝ 一個事件，不是一次操作'));
    var p1=el('p','note'); p1.style.borderLeftColor='var(--pri)';
    p1.textContent='時間流回答的是「這個案子到今天為止發生了什麼」。所以一則＝一件在專案外部看得見的事，而不是一次點擊、一次存檔、一則訊息。';
    w.appendChild(p1);
    w.appendChild(el('div','dsec','進流'));
    var u1=el('div','files'); u1.innerHTML=FLOW_RULES.in.map(function(x){return '<div class="frow"><span class="fkind">in</span><span class="fname" style="white-space:normal">'+esc(x)+'</span></div>';}).join(''); w.appendChild(u1);
    w.appendChild(el('div','dsec','不進流'));
    var u2=el('div','files'); u2.innerHTML=FLOW_RULES.out.map(function(x){return '<div class="frow" style="opacity:.6"><span class="fkind">out</span><span class="fname" style="white-space:normal">'+esc(x)+'</span></div>';}).join(''); w.appendChild(u2);
    w.appendChild(hint('聊天不會淹掉流的三道閘：① 一天折疊成一則 ② 只有被標記的訊息單獨成一則 ③ 篩選列可以把「對話」整個關掉，骨幹（期／里程碑／會議／合約）仍然完整。'));
  }
  return w;
}
function hint(t){var p=el('p','note',t);p.style.marginTop='16px';return p;}
</script>
<script>
"use strict";
/* [約束3][約束5][約束6] 資料夾樹：收件匣是真資料夾（標「系統 role=inbox」）；
   [共用] 標「對客戶可見」，其餘預設「僅內部」；節點名稱全部用 Owner 現場的名字。 */
function treeNodes(list,depth){
  var box=el('div');
  list.forEach(function(n){
    var node=el('div','tnode'+(depth===0&&n.kids&&n.kids.length?' open':''));
    var row=el('button','trow'+(n.kids&&n.kids.length&&depth===0?' open':'')+(S.focusInbox&&n.role==='inbox'?' sel':''));
    var ic = n.role==='inbox' ? 'M4 13h4l2 3h4l2-3h4M4 13l2-8h12l2 8v6H4z'
           : n.role==='meeting' ? 'M17 11a5 5 0 1 0-10 0M3 20c0-3 3-5 6-5M15 15c3 0 6 2 6 5'
           : 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z';
    row.innerHTML='<span class="tw">'+(n.kids&&n.kids.length?'›':'')+'</span>'+
      '<span class="ti">'+svg(ic)+'</span>'+
      '<span class="tn">'+esc(n.n)+'</span>'+
      (n.role==='inbox'?'<span class="tag t-sys">系統 role=inbox</span>':'')+
      (n.role==='meeting'?'<span class="tag t-mt">會議</span>':'')+
      (n.cnt?'<span class="tag t-warn">'+n.cnt+' 待整理</span>':'')+
      (n.f?'<span class="tag t-pl">'+n.f+' 檔</span>':'')+
      (n.v?visTag(n.v):'');
    row.onclick=function(){ if(n.kids&&n.kids.length){node.classList.toggle('open');row.classList.toggle('open');} else toast('選中：'+n.n+(n.note?'　—　'+n.note:'')); };
    node.appendChild(row);
    if(n.note){var nt=el('div',null,n.note);nt.style.cssText='font-size:11px;color:var(--text-3);margin:-2px 0 3px 33px';node.appendChild(nt);}
    if(n.kids&&n.kids.length){var kw=el('div','tkids');kw.appendChild(treeNodes(n.kids,depth+1));node.appendChild(kw);}
    box.appendChild(node);
  });
  return box;
}

/* ============================ 整理模式 ============================
   檔案整理彆扭問題的正面解法：整理是空間性的工作，給它自己的版面，
   時間流讓位；整理完只在流上留一則結果。 */
function enterTidy(){S.tidy=true;S.sel={};S.dst=null;paintTidy();}
function exitTidy(){S.tidy=false;paintAll();}
function paintTidy(){
  var p=P(), t=$('#tidy');
  $('#flowWrap').hidden=S.tidy; $('#composer').hidden=S.tidy; t.hidden=!S.tidy;
  if(!S.tidy)return;
  t.innerHTML='';
  var left=el('div','tpanel');
  var selN=Object.keys(S.sel).filter(function(k){return S.sel[k];}).length;
  var lh=el('div','tph');
  lh.innerHTML='<span>收件匣</span><span class="tag t-sys">role=inbox · 真資料夾</span><span class="sp"></span>'+
    '<span class="tag '+(p.inbox.length?'t-warn':'t-ok')+'">'+p.inbox.length+' 個檔案待整理</span>';
  left.appendChild(lh);
  if(!p.inbox.length) left.appendChild(el('div','empty','收件匣清空了。任何不指定資料夾的上傳（聊天附件、手機拍照、會議錄音直傳）都會落在這裡，filedAt 留空。'));
  p.inbox.forEach(function(f,i){
    var r=el('label','tfile');
    r.innerHTML='<input type="checkbox" '+(S.sel[i]?'checked':'')+'><span class="fkind">'+esc(f.k)+'</span>'+
      '<span class="fname">'+esc(f.n)+'</span><span class="fsz">'+esc(f.s)+'</span>'+
      '<span class="tag t-pl">'+esc(f.from)+'</span>';
    r.querySelector('input').onchange=function(ev){S.sel[i]=ev.target.checked;paintTidy();};
    left.appendChild(r);
  });
  t.appendChild(left);

  var right=el('div','tpanel');
  var rh=el('div','tph'); rh.innerHTML='<span>移到哪裡</span><span class="sp"></span><span class="tag t-pl">只改 folderId，不動 R2 bytes</span>';
  right.appendChild(rh);
  var dst=el('div','tdst');
  var flat=[]; (function walk(ns,pre,dp){ns.forEach(function(n){ if(n.role!=='inbox') flat.push({leaf:n.n,path:pre,dp:dp,n:pre+n.n,v:n.v,r:n.role}); if(n.kids)walk(n.kids,pre+n.n+' / ',dp+1);});})(p.drive,'',0);
  flat.forEach(function(f,i){
    var b=el('button','trow'+(S.dst===i?' sel':''));
    b.style.paddingLeft=(7+f.dp*13)+'px';
    b.innerHTML='<span class="ti">'+svg(f.r==='meeting'?'M17 11a5 5 0 1 0-10 0M3 20c0-3 3-5 6-5M15 15c3 0 6 2 6 5':'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z')+'</span>'+
      '<span class="tn" title="'+esc(f.n)+'">'+esc(f.leaf)+'</span>'+(f.v?visTag(f.v):'');
    b.onclick=function(){S.dst=i;paintTidy();};
    dst.appendChild(b);
  });
  right.appendChild(dst);
  var bar=el('div'); bar.style.cssText='padding:10px 13px;border-top:1px solid var(--border);display:flex;gap:7px;flex-wrap:wrap;align-items:center';
  var mv=el('button','btn pri','移動 '+selN+' 個檔案');
  mv.disabled=(!selN||S.dst===null);
  mv.onclick=function(){
    var moved=[], keep=[];
    p.inbox.forEach(function(f,i){ (S.sel[i]?moved:keep).push(f); });
    p.inbox=keep; S.sel={};
    p.events.push({d:'2026-10-03',t:'11:40',cyc:p.cycles[p.cycles.length-1].ord,
      stg:curStage(p.cycles[p.cycles.length-1]),
      kind:'tidy',title:'整理了 '+moved.length+' 個檔案 → '+flat[S.dst].n,
      sub:'由收件匣移出；只改 folderId，R2 的 objectKey 不變',
      tags:[['t-pl','收件匣 −'+moved.length]],
      files:moved.map(function(f){return {k:f.k,n:f.n,s:f.s,v:flat[S.dst].v||'int'};}),
      note:'整理在整理模式做完，時間流上只留這一則結果——這就是 B 對「檔案整理在時間流裡很彆扭」的解法。'});
    p.events.sort(function(a,b){ return a.d===b.d ? 0 : (a.d<b.d?-1:1); });
    S.dst=null; paintTidy(); toast('已移動 '+moved.length+' 個檔案，並在時間流上留下一則整理紀錄。');
  };
  bar.appendChild(mv);
  var back=el('button','btn','← 回到時間流'); back.onclick=exitTidy; bar.appendChild(back);
  var tip=el('span',null,'整理是空間性的工作，所以它有自己的版面。'); tip.style.cssText='font-size:11.5px;color:var(--text-3)';
  bar.appendChild(tip);
  right.appendChild(bar);
  t.appendChild(right);
}
</script>
<script>
"use strict";
/* ============================ 記一筆（新增流程） ============================ */
function curCycle(ds){
  var p=P(), hit=p.cycles[0];
  p.cycles.forEach(function(c){ if(ds>=c.from) hit=c; });
  return hit;
}
function curStage(c){
  var cur=null; c.stages.forEach(function(s){ if(s.s==='cur') cur=s; });
  return cur?cur.k:c.stages[c.stages.length-1].k;
}
function addEvent(){
  var kind=$('#cKind').value, ds=$('#cDate').value, tx=$('#cText').value.trim();
  if(!tx){ $('#cText').focus(); toast('先寫一句話，才知道這一則是什麼。'); return; }
  var p=P(), c=curCycle(ds), st=curStage(c);
  var e={d:ds,t:new Date().toTimeString().slice(0,5),cyc:c.ord,stg:st,kind:kind==='note'?'contract':kind,title:tx,
    sub:'在時間流上手動記的 · 自動歸到 期 '+c.ord+' · '+st,tags:[['t-int','僅內部']]};
  if(kind==='meeting'){
    e.kind='meeting';
    e.meeting={who:'戴宇星、Lily',born:ds+' '+e.t,recap:'',caution:'',
      kit:[{k:'mp3',n:'會議錄音檔',s:'—',v:'own',have:false},{k:'txt',n:'會議逐字稿',s:'—',v:'own',have:false},
           {k:'docx',n:'完整紀錄',s:'—',v:'int',have:false},{k:'md',n:'摘要',s:'—',v:'int',have:false}],
      extra:'新建的會議資料夾預設帶四件套空位，四個屬性（參與者／產生時間／結論／注意事項）掛在資料夾上。'};
    p.meetings.push({d:ds,n:tx,kit:0,who:'戴宇星、Lily'});
    var mr=null; p.drive.forEach(function(n){ if(n.n==='會議') mr=n; });
    if(!mr){ mr={n:'會議',v:'int',kids:[]}; p.drive.push(mr); }
    mr.kids.push({n:ds.replace(/-/g,'')+' '+tx,role:'meeting',v:'int',f:0,kids:[]});
  }
  if(kind==='milestone'){ e.tags=[['t-pl','日期已填']]; p.plan.push({m:'M'+(p.plan.length+1<10?'0':'')+(p.plan.length+1),n:tx,d:ds,cyc:c.ord,s:'open',tasks:[]}); }
  if(kind==='money'){ e.kind='money'; e.tags=[['t-warn','金額待補']]; }
  p.events.push(e);
  p.events.sort(function(a,b){ return a.d===b.d ? 0 : (a.d<b.d?-1:1); });
  $('#cText').value='';
  paintAll();
  toast('已記上去：'+tx+'（期 '+c.ord+' · '+st+'）'+(kind==='meeting'?'；硬碟裡同時建了一個會議資料夾。':''));
}

/* ============================ 雜項 ============================ */
var toastT=null;
function toast(msg){
  var t=$('#toast');
  if(!t){ t=el('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(620px,92vw);'+
      'background:var(--surface-3);border:1px solid var(--border-3);color:var(--text);font-size:12.5px;'+
      'padding:9px 14px;border-radius:9px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:opacity .15s';
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(toastT); toastT=setTimeout(function(){t.style.opacity='0';},4200);
}
function measureHead(){
  var h=$('#phead'); if(!h)return;
  document.documentElement.style.setProperty('--headh', h.offsetHeight+'px');
}
function paintAll(){ paintHead(); paintFlow(); paintTidy(); setTimeout(measureHead,0); }

$('#themeBtn').onclick=function(){
  var d=document.documentElement.getAttribute('data-theme')==='light';
  document.documentElement.setAttribute('data-theme', d?'dark':'light');
  this.textContent = d?'◐ 深色':'◑ 淺色';
};
$('#dClose').onclick=closeDrawer;
