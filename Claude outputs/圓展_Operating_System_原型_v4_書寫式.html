   ================================================================== */
const GRPDEF={st:['Todo','Doing','Review','Done'],owner:['yz','lily'],pri:['1','2','3','4'],size:['S','M','L']};
const GRPNM={st:x=>x,owner:x=>person(x),pri:x=>PRI[x][0],size:x=>x+' 尺寸'};
const GRPCOL={Todo:'#626b77',Doing:'#3987e5',Review:'#a78bf5',Done:'#199e70'};
function groupIssues(list){
  const key=S.groupBy,out=[];
  GRPDEF[key].forEach(v=>{
    const items=list.filter(i=>String(i[key]||(key==='pri'?4:''))===String(v));
    out.push({v,nm:GRPNM[key](v),items});
  });
  return out;
}
function issueRow(i){
  return `<div class="row" onclick="openDrawer('issue','${i.id}')">
    ${stChip(i.st)}<span class="t">${esc(i.t)}</span>
    ${i.rel&&i.rel.length?`<span class="chip c-n" title="有關聯">⇄ ${i.rel.length}</span>`:''}
    ${i.sub&&i.sub.length?`<span class="chip c-n">子 ${i.sub.length}</span>`:''}
    ${priFlag(i.pri)}${sizeChip(i.size)}
    <span class="m" style="width:44px">${person(i.owner)}</span>
    ${i.st==='Done'?`<span class="m" style="width:78px">${i.done}</span>`:ageChip(i)}
    <span class="rowacts">${i.st!=='Done'?mini('check',`setIssueStatus('${i.id}','${i.st==='Todo'?'Doing':i.st==='Doing'?'Review':'Done'}')`,'','推進'):''}${mini('pen',`formIssue('${i.id}')`)}${mini('trash',`delIssue('${i.id}')`,'dgr')}</span></div>`;
}
function listView(list){
  const gs=groupIssues(list);
  return `<div class="panel" style="overflow:hidden">${gs.map(g=>`
    <div class="grp"><i class="dotc" style="background:${GRPCOL[g.v]||'var(--text-3)'}"></i>
      <span class="nm">${esc(g.nm)}</span><span class="ct">${g.items.length}</span><i class="ln"></i>
      <button class="btn sm" onclick="formIssue(null,'${S.proj}')">${svg('plus')}</button></div>
    <div class="rows">${g.items.map(issueRow).join('')||'<div class="empty" style="padding:12px">—</div>'}</div>`).join('')}</div>`;
}
function boardView(list){
  const gs=groupIssues(list);
  return `<div class="board">${gs.map(g=>`
    <div class="bcol" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')"
         ondrop="this.classList.remove('over');dropCard(event,'${g.v}')">
      <div class="bcol-h"><i class="dot" style="background:${GRPCOL[g.v]||'var(--text-3)'}"></i>
        <span class="nm">${esc(g.nm)}</span><span class="ct">${g.items.length}</span></div>
      <div class="bcol-b">${g.items.map(i=>`
        <div class="bcard" draggable="true" ondragstart="dragCard(event,'${i.id}')" onclick="openDrawer('issue','${i.id}')">
          <div class="tt">${esc(i.t)}</div>
          <div class="mt">${priFlag(i.pri)}${sizeChip(i.size)}<span class="chip c-n">${person(i.owner)}</span>
            ${i.st!=='Done'?ageChip(i):''}${i.rel&&i.rel.length?`<span class="chip c-n">⇄ ${i.rel.length}</span>`:''}</div>
        </div>`).join('')||'<div class="empty" style="padding:14px">拖曳卡片到這裡</div>'}</div>
      <button class="bcol-add" onclick="quickAdd('${g.v}')">＋ 新增</button></div>`).join('')}</div>
    <div style="height:10px"></div><div class="note">拖曳卡片改變<b>${S.groupBy==='st'?'狀態':'分組欄位'}</b> —— 它是真的寫入，CFD、Aging、WIP 會立刻重算。</div>`;
}
let _drag=null;
function dragCard(e,id){_drag=id;e.dataTransfer.effectAllowed='move';e.target.classList.add('drag')}
function dropCard(e,v){
  if(!_drag)return; const i=ISS(_drag);_drag=null;
  if(S.groupBy==='st'){ if(i.st!==v)setIssueStatus(i.id,v); else render(); return }
  const b={...i},k=S.groupBy;
  commit('update','工作',`${i.t} · ${k} → ${GRPNM[k](v)}`,()=>{i[k]=k==='pri'?Number(v):v;return[`${k} 欄位已更新`,'所有視圖同步（清單／看板／表格）']},()=>Object.assign(i,b));
}
function quickAdd(v){
  const pre={}; pre[S.groupBy]=v;
  formIssue(null,S.proj,pre);
}
function tableView(list){
  const cf=[...new Set(list.flatMap(i=>Object.keys(i.cf||{})))];
  return `<div class="panel"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>ID</th><th>Task</th><th>狀態</th><th>優先</th><th>Owner</th><th>Size</th><th>Started</th><th>Done</th><th>Age</th><th>關聯</th>${cf.map(c=>`<th>${esc(c)}</th>`).join('')}<th></th></tr></thead>
    <tbody>${list.map(i=>`<tr onclick="openDrawer('issue','${i.id}')">
      <td class="k">${i.id}</td><td class="k">${esc(i.t)}</td><td>${stChip(i.st)}</td><td>${priFlag(i.pri)}</td>
      <td>${person(i.owner)}</td><td>${sizeChip(i.size)}</td><td>${i.started||'—'}</td><td>${i.done||'—'}</td>
      <td>${i.st==='Done'?'—':ageChip(i)}</td><td>${i.rel&&i.rel.length?i.rel.length:'—'}</td>
      ${cf.map(c=>`<td>${esc((i.cf||{})[c]||'—')}</td>`).join('')}
      <td><span class="rowacts">${mini('pen',`formIssue('${i.id}')`)}${mini('trash',`delIssue('${i.id}')`,'dgr')}</span></td></tr>`).join('')
      ||'<tr><td colspan="12"><div class="empty">沒有符合篩選的工作</div></td></tr>'}</tbody>
  </table></div></div>
  <div style="height:10px"></div><div class="note">表格視圖把<b>自訂欄位</b>拉成欄 —— ClickUp 稱為 Custom Fields，同一個 Task 在清單與看板上不會顯示它們，只有在需要比較時才展開。</div>`;
}

VIEWS.capacity=(tab)=>{

    return guide('<b>週配置是百分比，不是工時。</b>兩人公司排不出人天，但排得出注意力比例。淺色直線是契約 §2.4 的約定方向，色塊是實際 —— 差距本身就是月營運會議的議題。')
      +`<div class="g g2">${['yz','lily'].map(k=>panel('Weekly Capacity · '+person(k),
          k==='lily'?'對照契約 §2.4':'負責人無工時上限',
          vAlloc(k)+`<div class="note" style="margin-top:8px">${k==='lily'
            ?`本月工時 <b>${hoursUsed()} / 130 h</b>　·　WIP <b>${wip()} / 3</b>　·　距 143h（110%）警戒線尚遠`
            :'Management 若長期超過 10%，代表交付工作沒有真的移交出去。'}</div>`,
          `<button class="btn sm" onclick="formAlloc('${k}')">${svg('pen')} 調整</button>`)).join('')}</div>
      <div style="height:12px"></div>
      ${panel('工作項目只要六欄','不填 Estimate、不填 Actual',`<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Task</th><th>Project</th><th>Size</th><th>Status</th><th>Started</th><th>Done</th><th>Age</th><th></th></tr></thead>
        <tbody>${DB.issues.map(i=>`<tr onclick="openDrawer('issue','${i.id}')">
          <td class="k">${esc(i.t)}</td><td>${P(i.p)?esc(P(i.p).t.split('·')[0].trim()):'—'}</td>
          <td>${sizeChip(i.size)}</td><td>${stChip(i.st)}</td><td>${i.started||'—'}</td><td>${i.done||'—'}</td>
          <td>${i.st==='Done'?'<span class="m">—</span>':ageChip(i)}</td>
          <td><span class="rowacts">${mini('pen',`formIssue('${i.id}')`)}</span></td></tr>`).join('')}</tbody>
      </table></div>`,`<button class="btn pri" onclick="formIssue()">${svg('plus')} 新增</button>`,true)}`;
  }
  if(tab===1){
    const avg=throughputAvg().toFixed(1);
    return guide("<b>Little's Law：平均 WIP ＝ 平均 Throughput × 平均 Cycle Time。</b>三個數字是同一個系統的三個面，所以放在一起看。樣本不足 30 筆時，介面會誠實說「樣本不足」，不給假的 P85。",'w')
      +`<div class="kpis" style="margin-bottom:12px">
        <div class="kpi"><div class="lb">Throughput</div><div class="v">${avg}<span style="font-size:12px;color:var(--text-3)"> 件/週</span></div><div class="s">近 ${DB.weekly.length} 週平均</div></div>
        <div class="kpi"><div class="lb">目前 WIP</div><div class="v" style="color:${wip()>3?'var(--warn)':'var(--text)'}">${wip()}<span style="font-size:12px;color:var(--text-3)"> / 3</span></div><div class="s">契約 §2.5 上限</div></div>
        <div class="kpi"><div class="lb">推得平均 Cycle Time</div><div class="v">${(wip()/(throughputAvg()/7)).toFixed(1)}<span style="font-size:12px;color:var(--text-3)"> 天</span></div><div class="s">WIP ÷ Throughput</div></div>
        <div class="kpi"><div class="lb">停滯中</div><div class="v" style="color:${DB.issues.filter(i=>i.st!=='Done'&&agingRisk(i)==='crit').length?'var(--danger)':'var(--text)'}">${DB.issues.filter(i=>i.st!=='Done'&&agingRisk(i)==='crit').length}</div><div class="s">age 超過同尺寸 P85</div></div>
      </div>
      ${vWeekly()}<div style="height:12px"></div>${vScatter()}<div style="height:12px"></div>${vAging()}`;
  }
  const rem=DB.issues.filter(i=>i.st!=='Done').length;
  return guide('<b>預測輸出的是機率，不是日期。</b>Monte Carlo 用近 9 週的實際 throughput 重抽樣 4000 次。對內規劃看 P50，對客戶承諾用 P85。')
    +vForecast(Math.max(1,rem),'2026-10-31')
    +`<div style="height:12px"></div>`
    +vForecast(12,'2026-11-15')
    +`<div style="height:12px"></div>
      <div class="hint w">${svg('bolt',13)}<div><b>這頁在 2027 Q1 之前不應該上線。</b>樣本要 8–12 週才夠。但 <code style="font-family:var(--mono);color:var(--teal)">Issue.started_at / done_at</code> 必須第一天就存在 —— 資料從第一天開始收，介面晚半年再做。整份路線圖唯一一個「欄位先行、介面後補」的例外。</div></div>`;
};

function pickDoc(id){S.doc=id;const d=DB.docs.find(x=>x.id===id);S.clause=d.clauses[0].id;render()}
VIEWS.commit=(tab)=>{
  const dir=tab===0?'內部':'外部';
  const docs=DB.docs.filter(d=>d.dir===dir);
  if(!docs.find(d=>d.id===S.doc)){S.doc=docs[0].id;S.clause=docs[0].clauses[0].id}
  const doc=DB.docs.find(d=>d.id===S.doc);
  if(!doc.clauses.find(c=>c.id===S.clause))S.clause=doc.clauses[0].id;
  const cm=DB.commitments.find(c=>c.clause===S.clause);
  const stc={'履行中':'c-o','落後':'c-w','已完成':'c-o','待回顧':'c-n'};
  return guide('<b>左：文件。中：條文，可標記。右：那一條的履行證據。</b>沒有承諾紀錄的條文會顯示「從此條文建立承諾」—— 這是 create 的入口。')
    +`<div class="panel" style="overflow:hidden"><div class="deck">
      <div class="col" style="flex:0 0 200px">
        <div class="col-h"><span class="ti">文件</span><span class="ct">${docs.length}</span></div>
        <div class="rows">${docs.map(d=>`<div class="row ${d.id===S.doc?'sel':''}" onclick="pickDoc('${d.id}')">
          <span class="t">${esc(d.t)}</span><span class="m">${d.clauses.length}</span></div>`).join('')}</div></div>
      <div class="col" style="flex:1.3">
        <div class="col-h"><span class="ti">${esc(doc.t)}</span><span class="ct">點條文 →</span></div>
        <div class="docbody" style="padding:12px 14px">${doc.clauses.map(c=>{
          const has=DB.commitments.some(x=>x.clause===c.id);
          return `<span class="cl ${c.id===S.clause?'on':''}" onclick="S.clause='${c.id}';render()">
            <b>${esc(c.ref)}</b>　${esc(c.text)}${has?'':' <span class="chip c-w">未建立承諾</span>'}</span>`}).join('')}</div></div>
      <div class="col" style="flex:1">
        <div class="col-h"><span class="ti">履行證據</span>${cm?`<span class="ct">${cm.id}</span>`:''}</div>
        ${cm?`<div style="padding:12px 14px">
          <div style="display:flex;gap:7px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
            <span class="chip ${stc[commitStatus(cm)]||'c-n'}">${commitStatus(cm)}</span>
            <span class="chip ${cm.dir==='內部'?'c-i':'c-t'}">${cm.dir}</span>
            <span class="m">Owner ${person(cm.owner)}</span><span class="m">${esc(cm.due)}</span></div>
          <div style="font-size:13px;color:var(--text);margin-bottom:12px">${esc(cm.t)}</div>
          <div class="rows" style="border-top:1px solid var(--border)">${cm.logs.map((l,i)=>`
            <div class="row" style="padding-left:0;padding-right:0">
              <span class="chip ${l.ok===true?'c-o':l.ok===false?'c-d':'c-n'}">${l.ok===true?'✓':l.ok===false?'✗':'…'}</span>
              <span class="m" style="width:76px">${l.d}</span>
              <span class="t" style="white-space:normal">${esc(l.t)}<span class="m" style="display:block">${esc(l.src)}</span></span>
              <span class="rowacts">${mini('trash',`delLog('${cm.id}',${i})`,'dgr')}</span></div>`).join('')
            ||'<div class="empty">尚無履行紀錄 —— 熱圖上會是一整排空白</div>'}</div>
          <button class="btn" style="margin-top:12px;width:100%" onclick="formLog('${cm.id}')">${svg('plus')} 月度回顧補 log</button>
        </div>`
        :`<div class="empty">這一條還沒有承諾紀錄。<br><br>
          <button class="btn pri" onclick="formCommitment('${doc.id}','${S.clause}')">${svg('plus')} 從此條文建立承諾</button>
          <div class="note" style="margin-top:12px;max-width:240px;margin-left:auto;margin-right:auto">
            欄位參考承諾登記簿：編號／承諾日／內容／方向／Owner／狀態／期限／履行證據。</div></div>`}
      </div></div></div>
    <div style="height:12px"></div>
    ${vHeat(dir)}
    <div style="height:12px"></div>
    ${panel(dir+'承諾總覽','',`<div class="rows" style="margin:-12px -14px">${DB.commitments.filter(c=>c.dir===dir).map(c=>`
      <div class="row ${c.clause===S.clause?'sel':''}" onclick="S.doc='${c.doc}';S.clause='${c.clause}';render()">
        <span class="chip ${stc[commitStatus(c)]||'c-n'}">${commitStatus(c)}</span>
        <span class="m" style="width:60px">${c.id}</span><span class="t">${esc(c.t)}</span>
        <span class="m">${person(c.owner)}</span><span class="m" style="width:88px;text-align:right">${esc(c.due)}</span>
        <span class="m">${c.logs.length} log</span>
        <span class="rowacts">${mini('plus',`formLog('${c.id}')`,'','補 log')}</span></div>`).join('')

      ${fld('未稅收入',`<span style="font-family:var(--mono)">${nt(revenue(id))}</span>`)}
      ${fld('可分配毛利',`<span style="font-family:var(--mono);color:var(--ok)">${nt(gross(id))}</span>`)}
      ${fld('Issue',`${iss.filter(i=>i.st==='Done').length} / ${iss.length} 完成`)}
      ${fld('Repo',p.repo)}
      ${fld('交付標準',p.delivery.length?p.delivery.map(d=>'• '+esc(d)).join('<br>'):'尚未確認')}</div>`,
    foot:`<button class="btn pri" onclick="closeDrawer();S.proj='${id}';nav('project',0)">${svg('goto')} 開啟專案</button>
      <button class="btn" onclick="formProject('${id}')">${svg('pen')} 編輯</button>`};
};
DRAWERS.txn=id=>{
  const t=TX(id); if(!t)return{crumb:'—',title:'找不到',sub:'',body:'',foot:''};
  const KINDS=['發票','收據','合約','匯款單','對帳單'];
  return {crumb:t.d.slice(5),title:esc(t.t),sub:`${t.d} · ${t.cat} · ${nt(t.amt)}`,
    body:`<div class="vouchers" style="margin-bottom:14px">
      ${t.v.map((v,i)=>`<div class="vch" data-tip="${atip('原始憑證必須附隨於傳票，否則該分錄缺乏入帳依據')}">
        <button class="x" onclick="delVoucher('${id}',${i})" title="移除">${svg('trash',11)}</button>
        <div class="ph">${esc(v)}</div><div class="ty">${esc(v)}</div><div class="ex">已附</div></div>`).join('')}
      <button class="vch add" onclick="pickVoucher('${id}')">${svg('plus',16)}<span class="ex" style="margin-top:4px">加憑證</span></button></div>
    ${!t.v.length?`<div class="hint w" style="margin-bottom:14px">${svg('bolt',13)}<div><b>缺原始憑證。</b>依台灣會計憑證鏈，原始憑證必須附隨於傳票，否則這筆分錄沒有入帳依據。</div></div>`:''}
    <div class="fields">
      ${fld('歸屬專案',t.p.startsWith('PRJ')?`<span class="lnk" onclick="peek('project','${t.p}')">${esc(P(t.p).t)}</span>`:'公司層級')}
      ${fld('成本類別',t.cat)}
      ${fld('代收代付',t.pass?'<span class="chip c-w">是 · 不計入可分配毛利（§9.3）</span>':'否')}
      ${fld('影響',t.pass?'不影響獎金計算':t.p.startsWith('PRJ')?`可分配毛利 ${t.amt>0?'+':''}${nt(t.amt)} → 目前 <b>${nt(gross(t.p))}</b>`:'公司層級，不進入任何專案毛利')}
      ${t.p==='PRJ-2026-004'?fld('連動',`<span class="lnk" onclick="peek('bonus','PRJ-2026-004')">獎金單 BS-2026-09-003</span>`):''}
      ${t.note?fld('備註',esc(t.note)):''}</div>`,
    foot:`<button class="btn" onclick="formTxn('${id}')">${svg('pen')} 編輯</button>
      ${t.p.startsWith('PRJ')?`<button class="btn" onclick="peek('project','${t.p}')">${svg('goto')} 專案</button>`:''}
      <button class="btn dgr" style="margin-left:auto" onclick="delTxn('${id}')">${svg('trash')}</button>`};
};
function pickVoucher(id){
  openModal('加入原始憑證','選一種憑證類型。實際系統會在這裡上傳影像並做 OCR。','',
    ['發票','收據','合約','匯款單','對帳單'].map(k=>`<button class="btn" onclick="closeModal();addVoucher('${id}','${k}')">${k}</button>`).join('')
    +`<button class="btn" onclick="closeModal()">取消</button>`);
}
DRAWERS.event=id=>{
  const e=EVT(id);
  return {crumb:e.d.slice(5),title:esc(e.t),sub:`${e.layer}層 · ${e.d}`,
    body:`<div class="fields">
      ${fld('層級',`<span class="chip ${LAYER[e.layer]}">${e.layer}</span>`)}
      ${fld('重要',e.star?'<span style="color:var(--warn)">★ 已標星</span>':'—')}
      ${fld('日期',e.d)}${fld('提醒',e.remind)}
      ${fld('來源',e.derived?`<span class="chip c-n">${svg('lock',10)} ${esc(e.derived)}</span><span class="sub">由條文推導，不可刪除</span>`:'手動建立<span class="sub">可自由編輯與刪除</span>')}
      ${e.link?fld('連結',`<span class="lnk" onclick="peek('project','${e.link}')">${esc(P(e.link).t)}</span>`):''}
      ${e.note?fld('說明',esc(e.note)):''}
      ${e.done?fld('狀態','<span class="chip c-o">已履行</span>'):''}</div>`,
    foot:e.derived
      ?`<button class="btn pri" onclick="fulfilEvent('${id}')">${svg('check')} 標記已履行</button>
        <button class="btn" onclick="toast('已協議變更需填寫理由，原事件保留為紀錄')">已協議變更</button>
        <button class="btn" disabled style="margin-left:auto">${svg('lock')} 不可刪除</button>`
      :`<button class="btn" onclick="formEvent('${id}')">${svg('pen')} 編輯</button>
        <button class="btn dgr" style="margin-left:auto" onclick="delEvent('${id}')">${svg('trash')}</button>`};
};
DRAWERS.decision=id=>{
  const d=DB.decisions.find(x=>x.id===id);
  if(!d)return{crumb:'—',title:'找不到',sub:'',body:'',foot:''};
  const old=d.sup?DB.decisions.find(x=>x.id===d.sup):null;
  return {crumb:d.id,title:esc(d.t),sub:`${d.id} · ${d.date}`,
    body:`<div class="fields">
      ${fld('狀態',`<span class="chip ${d.st==='現行'?'c-o':'c-n'}">${d.st}</span>`)}
      ${fld('Context',esc(d.ctx))}${fld('Evidence',esc(d.ev))}${fld('Owner',person(d.owner))}
      ${d.sup?fld('Supersedes',`<span class="lnk" onclick="peek('decision','${d.sup}')">${d.sup} · ${esc(old?old.t:'')}</span>`):''}</div>
    <div class="hint i" style="margin-top:14px">${svg('bolt',13)}<div><b>舊 Decision 不抹除。</b>它本身就是當時 Context 的 Evidence（Handbook 05.3）。</div></div>`,
    foot:d.st==='現行'?`<button class="btn" onclick="formDecision('${id}')">${svg('plus')} 以新決策取代</button>`:''};
};
DRAWERS.bonus=id=>{
  const p=P(id),g=GATE();
  return {crumb:'獎金單',title:'專案獎金確認單',sub:'BS-2026-09-003 · 附件二',
    body:`<div class="fields">
      ${fld('專案',`<span class="lnk" onclick="peek('project','${id}')">${esc(p.t)}</span>`)}
      ${fld('類型',`${p.type}<span class="sub">${Math.min(p.rate,p.cap)}% · 上限 ${p.cap}%</span>`)}
      ${fld('主要執行者',`${person(p.owner)} <span class="chip c-o">啟動前已指定</span>`)}
      ${fld('可分配毛利',`<span style="font-family:var(--mono)">${nt(gross(id))}</span>`)}
      ${fld('應付獎金',`<span style="font-family:var(--mono);color:var(--ok)">${nt(bonus(id))}</span>`)}</div>
    <div style="height:12px"></div>
    <div class="panel" style="background:var(--surface-2)"><div class="panel-h"><h3>結算閘門</h3><span class="sub">§13.1</span></div>
      <div class="panel-b">${g.map(([t,ok,m])=>`<div class="gate"><span class="ix ${ok?'y':'n'}">${ok?'✓':'…'}</span><span class="tt">${esc(t)}</span><span class="mm">${esc(m)}</span></div>`).join('')}</div></div>`,
    foot:`<button class="btn" onclick="closeDrawer();nav('money',3)">${svg('goto')} 人事分頁</button>`};
};
DRAWERS.flow=()=>{
  const cl=DB.changelog;
  const opc={create:'op-c',update:'op-u',delete:'op-d'},opn={create:'新增',update:'更新',delete:'刪除'};
  return {crumb:'資料流',title:'資料流',sub:`本次操作 ${cl.length} 筆寫入`,
    body:cl.length?`<div style="margin:-14px -14px 0">${cl.map(c=>`
      <div class="cl-i"><div class="top">
        <span class="op ${opc[c.op]}">${opn[c.op]}</span>
        <span style="color:var(--text-3);font-family:var(--mono);font-size:11px">${esc(c.ent)}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.label)}</span>
        <span class="ts">${c.ts}</span></div>
        ${c.eff.length?`<div class="ch">${c.eff.map(e=>`<div><span class="ar">→</span><span>${e}</span></div>`).join('')}</div>`:''}
      </div>`).join('')}</div>`
      :`<div class="empty">還沒有任何寫入。<br><br>試試：在日誌新增一個模板、在帳本新增一筆交易、把一個 Issue 推進到 Done。<br>每一次寫入都會在這裡留下它<b>串到哪裡</b>的紀錄。</div>`,
    foot:cl.length?`<button class="btn" onclick="DB.changelog=[];paintFlowBadge();paintDrawer()">清空紀錄</button>`:''};
};

/* ==================================================================
   init
   ================================================================== */
renderRail(); render(); paintFlowBadge();
setTimeout(()=>toast('日誌是一張<b>空白書寫頁</b>：Enter 換行、Tab 縮排、打 <b>#</b> 召喚 component'),900);
</script>
</body>
</html>
