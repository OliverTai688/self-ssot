<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圓展 Operating System v4 · 書寫式工作系統</title>
<style>
/* ==================== tokens ==================== */
:root{
  --bg:#0a0c0f; --surface:#111418; --surface-2:#161a20; --surface-3:#1d232b; --surface-4:#242b34;
  --border:#232931; --border-2:#333b45; --border-3:#465060;
  --text:#e9ecf1; --text-2:#99a2af; --text-3:#626b77;

  --pri:#6cb6ff; --pri-bg:#11212e; --pri-br:#2d5a7d;
  --ok:#5fd09a; --ok-bg:#0f2620;
  --warn:#f2b95e; --warn-bg:#2a2111;
  --danger:#ef8a82; --danger-bg:#2b1614;
  --info:#a78bf5; --info-bg:#1c1830;
  --teal:#4fcfc0; --teal-bg:#0d2724;

  /* ---- data-viz tokens (validated: see 圖表說明) ---- */
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#c98500;
  --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
  --seq-1:#184f95; --seq-2:#256abf; --seq-3:#3987e5; --seq-4:#6da7ec; --seq-5:#9ec5f4;
  --grid:#252c35; --axis:#39414c;

  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --rail:78px; --rowpad:9px; --r:8px;
  --shadow:0 18px 44px rgba(0,0,0,.55);
}
body.compact{--rowpad:5px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a313a;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a424d}
::-webkit-scrollbar-track{background:transparent}

/* ==================== shell ==================== */
.app{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:48px 1fr;height:100vh;height:100dvh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);z-index:30}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .mk{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#6cb6ff,#a78bf5);flex:none}
.brand b{font-size:13.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-family:var(--mono);font-size:10.5px;color:var(--text-3);white-space:nowrap}
.omni{flex:1;min-width:0;max-width:400px;margin:0 auto;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;color:var(--text-3);font-size:12.5px;cursor:pointer;transition:.12s;white-space:nowrap;overflow:hidden}
.omni:hover{border-color:var(--border-3);color:var(--text-2)}
.omni kbd{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--surface-3);border:1px solid var(--border-2);border-radius:4px;padding:1px 5px}
.tb-right{display:flex;align-items:center;gap:5px;margin-left:auto}
.iconbtn{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--text-3);transition:.12s;position:relative}
.iconbtn:hover{background:var(--surface-3);color:var(--text)}
.iconbtn.on{background:var(--pri-bg);color:var(--pri)}
.iconbtn .n{position:absolute;top:1px;right:1px;min-width:13px;height:13px;padding:0 3px;border-radius:7px;background:var(--pri);color:#07121b;font-size:9px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
.avatar{width:26px;height:26px;border-radius:50%;background:#2b3440;display:grid;place-items:center;font-size:11px;font-weight:650;color:var(--text-2)}

.rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:8px 0;gap:2px;overflow-y:auto;z-index:20}
.rail-i{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;margin:0 6px;border-radius:9px;color:var(--text-3);transition:.12s;position:relative}
.rail-i:hover{background:var(--surface-2);color:var(--text-2)}
.rail-i.on{background:var(--pri-bg);color:var(--pri)}
.rail-i.on::before{content:"";position:absolute;left:-6px;top:12px;bottom:12px;width:2.5px;border-radius:0 2px 2px 0;background:var(--pri)}
.rail-i svg{width:19px;height:19px;stroke-width:1.6}
.rail-i em{font-style:normal;font-size:10.5px;letter-spacing:.02em;font-weight:500;white-space:nowrap}
.rail-i .bdg{position:absolute;top:5px;right:10px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--danger);color:#1a0e0d;font-size:9.5px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
.rail-sp{flex:1}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);overflow-x:hidden}
.wbhead{padding:14px 20px 0;border-bottom:1px solid var(--border);background:var(--surface)}
.wbtitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.wbtitle h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.015em}
.wbtitle .scn{font-family:var(--mono);font-size:11.5px;color:var(--warn);opacity:.85}
.wbtitle .rule{margin-left:auto;font-size:11px;color:var(--text-3);font-family:var(--mono)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px}
.tab{padding:7px 12px 9px;font-size:13px;color:var(--text-3);white-space:nowrap;border-bottom:2px solid transparent;transition:.12s;border-radius:5px 5px 0 0}
.tab:hover{color:var(--text-2);background:var(--surface-2)}
.tab.on{color:var(--text);border-bottom-color:var(--pri);font-weight:550}
.surface{flex:1;overflow:auto;padding:18px 20px 80px}
.surface-inner{max-width:1200px}

/* ==================== primitives ==================== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;row-gap:7px}
.panel-h h3{margin:0;font-size:13px;font-weight:600;white-space:nowrap}
.panel-h .sub{font-size:11.5px;color:var(--text-3);font-family:var(--mono)}
.panel-h .sp{flex:1}
.panel-b{padding:12px 14px}
.panel-b.flush{padding:0}
.g{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g21{grid-template-columns:1.8fr 1fr}
.g12{grid-template-columns:220px 1fr}
@media(max-width:980px){.g2,.g3,.g21,.g12{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:6px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-2);font-size:12.5px;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--surface-3);color:var(--text);border-color:var(--border-3)}
.btn.pri{background:var(--pri-bg);border-color:var(--pri-br);color:var(--pri)}
.btn.pri:hover{background:#163044}
.btn.dgr{background:var(--danger-bg);border-color:#5d2b26;color:var(--danger)}
.btn.dgr:hover{background:#3a1c19}
.btn.sm{height:24px;padding:0 8px;font-size:11.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn svg{width:13px;height:13px;stroke-width:1.8}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px}
.seg button{padding:4px 11px;border-radius:5px;font-size:12.5px;color:var(--text-3);transition:.12s;white-space:nowrap}
.seg button:hover{color:var(--text-2)}
.seg button.on{background:var(--surface-4);color:var(--text);font-weight:550}

.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;padding:1.5px 6px;border-radius:4px;white-space:nowrap;letter-spacing:.02em}
.c-n{background:var(--surface-3);color:var(--text-2)}
.c-p{background:var(--pri-bg);color:var(--pri)}
.c-o{background:var(--ok-bg);color:var(--ok)}
.c-w{background:var(--warn-bg);color:var(--warn)}
.c-d{background:var(--danger-bg);color:var(--danger)}
.c-i{background:var(--info-bg);color:var(--info)}
.c-t{background:var(--teal-bg);color:var(--teal)}
.dotc{width:7px;height:7px;border-radius:50%;flex:none}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:var(--rowpad) 14px;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;transition:background .1s}
.rows .row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--pri-bg);box-shadow:inset 2px 0 0 var(--pri)}
.row.flash,tr.flash td{animation:flash 1.1s ease}
@keyframes flash{0%,40%{background:#1d3346}100%{background:transparent}}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.row .m{font-family:var(--mono);font-size:11px;color:var(--text-3);white-space:nowrap}
.row .n{font-family:var(--mono);font-size:12px;color:var(--text);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rowacts{display:flex;gap:3px;opacity:0;transition:.12s}
.row:hover .rowacts{opacity:1}
.miniact{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--text-3)}
.miniact:hover{background:var(--surface-4);color:var(--text)}
.miniact.dgr:hover{background:var(--danger-bg);color:var(--danger)}
.miniact svg{width:12px;height:12px;stroke-width:1.9}
.star{color:var(--text-3);transition:.12s;flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:4px}
.star:hover{background:var(--surface-3)}
.star.on{color:var(--warn)}
.star svg{width:13px;height:13px}

.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.tbl th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;padding:7px 12px;font-size:10.5px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:var(--rowpad) 12px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text-2)}
table.tbl td.k{color:var(--text)}
table.tbl td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--text)}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover td{background:var(--surface-2)}
table.tbl tbody tr.sel td{background:var(--pri-bg)}
table.tbl tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--pri)}
table.tbl tfoot td{padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--text);background:var(--surface-2);border-top:1px solid var(--border-2)}
table.tbl td .rowacts{justify-content:flex-end}

.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
.kpi .lb{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3);margin-bottom:5px}
.kpi .v{font-family:var(--mono);font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.45}
.meter{height:5px;border-radius:3px;background:var(--surface-4);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:3px;transition:width .4s cubic-bezier(.2,.8,.2,1)}

.hint{display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-left:2px solid var(--pri);border-radius:6px;padding:9px 12px;font-size:12.5px;color:var(--text-2);line-height:1.65}
.hint.w{border-left-color:var(--warn)}
.hint.i{border-left-color:var(--info)}
.hint.d{border-left-color:var(--danger)}
.hint b{color:var(--text)}
.hint svg{flex:none;margin-top:3px}
.note{font-size:12.5px;color:var(--text-3);line-height:1.7}
.note b{color:var(--text-2)}
.empty{padding:26px 14px;text-align:center;color:var(--text-3);font-size:12.5px}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3);font-family:var(--mono)}
.legendrow span{display:inline-flex;align-items:center;gap:5px}

.deck{display:flex;align-items:stretch}
.col{flex:1;min-width:0;border-right:1px solid var(--border)}
.col:last-child{border-right:none}
.col-h{padding:9px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--surface-2)}
.col-h .ti{font-size:12.5px;font-weight:600}
.col-h .ct{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin-left:auto}
.col.now{background:#0e1319}
.col.now .col-h{background:var(--pri-bg)}
@media(max-width:880px){.deck{flex-direction:column}.col{border-right:none;border-bottom:1px solid var(--border)}}

.gate{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.gate:last-child{border-bottom:none}
.gate .ix{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-family:var(--mono);flex:none}
.gate .ix.y{background:var(--ok-bg);color:var(--ok)}
.gate .ix.n{background:var(--warn-bg);color:var(--warn)}
.gate .tt{flex:1;color:var(--text)}
.gate .mm{font-family:var(--mono);font-size:11px;color:var(--text-3)}

/* ==================== forms ==================== */
.form{display:flex;flex-direction:column;gap:13px}
.frow{display:flex;flex-direction:column;gap:5px}
.frow.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flab{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);display:flex;gap:5px;align-items:center}
.flab .req{color:var(--danger)}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border-2);border-radius:6px;
  color:var(--text);font-family:var(--sans);font-size:13px;padding:7px 10px;transition:.12s;
}
input[type=number]{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:64px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);background:var(--surface-3);box-shadow:0 0 0 3px rgba(108,182,255,.13)}
input.err,select.err,textarea.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(239,138,130,.12)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#626b77 50%),linear-gradient(135deg,#626b77 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.fhint{font-size:11.5px;color:var(--text-3);line-height:1.55}
.ferr{font-size:11.5px;color:var(--danger);display:none}
.ferr.on{display:block}
.chipset{display:flex;gap:5px;flex-wrap:wrap}
.chipset button{padding:4px 10px;border-radius:6px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-3);font-size:12px;transition:.12s}
.chipset button:hover{color:var(--text)}
.chipset button.on{background:var(--pri-bg);border-color:var(--pri-br);color:var(--pri);font-weight:550}
.effects{background:var(--surface-2);border:1px solid var(--border);border-left:2px solid var(--v3);border-radius:6px;padding:9px 11px;font-size:12px;color:var(--text-2)}
.effects .h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:5px}
.effects .e{display:flex;gap:7px;padding:2.5px 0;align-items:flex-start}
.effects .e b{color:var(--text);font-weight:500}
.effects .ar{color:var(--v3);font-family:var(--mono);flex:none}

/* ==================== drawer / modal ==================== */
.scrim{position:fixed;inset:0;background:rgba(4,6,9,.5);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);border-left:1px solid var(--border-2);box-shadow:var(--shadow);z-index:50;transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-top{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);min-height:44px}
.crumb{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-3);font-family:var(--mono);overflow:hidden;flex:1}
.crumb b{color:var(--text-2);font-weight:500;cursor:pointer}
.crumb b:hover{color:var(--pri)}
.dr-body{flex:1;overflow:auto;padding:14px}
.dr-h{font-size:15px;font-weight:620;margin:0 0 3px;letter-spacing:-.01em}
.dr-sub{font-family:var(--mono);font-size:11px;color:var(--text-3);margin:0 0 14px}
.fields{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.fld{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:baseline}
.fld .k{width:76px;flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding-top:2px}
.fld .v{flex:1;color:var(--text);min-width:0}
.fld .v .sub{display:block;font-size:11.5px;color:var(--text-3);font-family:var(--mono);margin-top:1px}
.lnk{color:var(--pri);cursor:pointer;border-bottom:1px solid rgba(108,182,255,.3)}
.lnk:hover{border-bottom-color:var(--pri)}
.dr-foot{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}

.modal-wrap{position:fixed;inset:0;z-index:62;display:none;align-items:center;justify-content:center;background:rgba(4,6,9,.62);padding:20px}
.modal-wrap.on{display:flex}
.modal{width:min(430px,100%);background:var(--surface);border:1px solid var(--border-2);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.modal-h{padding:14px 16px 0}
.modal-h h3{margin:0 0 4px;font-size:15px;font-weight:620}
.modal-h p{margin:0;font-size:12.5px;color:var(--text-2);line-height:1.65}
.modal-b{padding:12px 16px}
.modal-f{padding:12px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border);background:var(--surface-2)}

/* ==================== cmdk ==================== */
.cmdk-wrap{position:fixed;inset:0;z-index:64;display:none;padding-top:11vh;justify-content:center;background:rgba(4,6,9,.62)}
.cmdk-wrap.on{display:flex}
.cmdk{width:min(620px,94vw);max-height:66vh;background:var(--surface);border:1px solid var(--border-2);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.cmdk input{width:100%;height:46px;padding:0 16px;background:none;border:none;outline:none;color:var(--text);font-size:15px;border-bottom:1px solid var(--border);border-radius:0;box-shadow:none}
.cmdk input:focus{box-shadow:none;background:none;border-color:var(--border)}
.cmdk-list{overflow:auto;padding:6px}
.cmdk-g{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);padding:8px 10px 4px}
.cmdk-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer}
.cmdk-i .ic{width:18px;height:18px;border-radius:5px;background:var(--surface-3);display:grid;place-items:center;flex:none;color:var(--text-3)}
.cmdk-i .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdk-i .h{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.cmdk-i.on{background:var(--pri-bg)}
.cmdk-i.on .ic{background:#1d3446;color:var(--pri)}
.cmdk-foot{border-top:1px solid var(--border);padding:7px 12px;display:flex;gap:14px;font-size:11px;color:var(--text-3);font-family:var(--mono)}

/* ==================== toast ==================== */
.toasts{position:fixed;bottom:16px;left:calc(var(--rail) + 16px);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none;max-width:min(440px,calc(100vw - 120px))}
.toast{background:var(--surface-3);border:1px solid var(--border-3);border-radius:8px;padding:8px 10px 8px 14px;font-size:12.5px;color:var(--text);box-shadow:var(--shadow);animation:tin .25s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:12px;pointer-events:auto}
.toast b{color:var(--pri);font-weight:600}
.toast .undo{border:1px solid var(--border-3);background:var(--surface-4);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--text);white-space:nowrap}
.toast .undo:hover{background:#2e3742}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* ==================== journal template ==================== */
.tmpl{border:1px solid var(--border-2);border-radius:8px;background:var(--surface-2);overflow:hidden}
.tmpl-h{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--border);background:#12161c}
.tmpl-h .nm{font-family:var(--mono);font-size:11px;color:var(--pri)}
.tmpl-h .sp{flex:1}
.tsec{padding:8px 11px;border-bottom:1px solid var(--border)}
.tsec:last-child{border-bottom:none}
.tsec-h{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.tsec-h .hh{font-size:12.5px;font-weight:650;color:var(--text);letter-spacing:.01em}
.tsec-h .hh:hover{background:var(--surface-4);border-radius:4px}
.tsec-h .cnt{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.tsec-h .acts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.12s}
.tsec:hover .acts{opacity:1}
.tline{display:flex;gap:8px;align-items:flex-start;padding:2px 0 2px 14px;font-size:13px;position:relative}
.tline::before{content:"–";position:absolute;left:2px;color:var(--text-3);font-family:var(--mono);font-size:11px;top:3px}
.tline .tx{flex:1;min-width:0;color:var(--text-2);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.tline .tx:hover{background:var(--surface-3);border-radius:4px}
.tline .acts{display:flex;gap:2px;opacity:0;transition:.12s}
.tline:hover .acts{opacity:1}
.tadd{padding:4px 0 2px 14px}
.tadd button{font-size:11.5px;color:var(--text-3);font-family:var(--mono)}
.tadd button:hover{color:var(--pri)}
.ed{outline:none;border-radius:4px;padding:1px 4px;margin:-1px -4px;transition:.1s}
.ed:focus{background:var(--surface-4);box-shadow:0 0 0 2px rgba(108,182,255,.3)}
.ed:empty::before{content:attr(data-ph);color:var(--text-3)}

/* outline (free blocks) */
.outline{font-size:13.5px;line-height:1.95}
.blk{display:flex;gap:8px;padding:1px 0;border-radius:5px;align-items:flex-start}
.blk:hover{background:var(--surface-2)}
.blk .bul{color:var(--text-3);flex:none;width:12px;text-align:center;font-size:11px;line-height:1.95}
.blk .bd{flex:1;min-width:0;cursor:pointer}
.blk .acts{opacity:0;display:flex;gap:2px}
.blk:hover .acts{opacity:1}
.blk .meta{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-left:6px}
.ind1{margin-left:20px}.ind2{margin-left:40px}.ind3{margin-left:60px}
.slash{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border-2);align-items:center}
.slash .lb{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-right:2px}

.tree{font-family:var(--mono);font-size:12.5px;line-height:2}
.tree .ln{display:flex;align-items:center;gap:6px;border-radius:4px;padding:0 4px}
.tree .ln:hover{background:var(--surface-2)}
.tree .d{color:var(--pri)}
.tree .f{color:var(--text-2);cursor:pointer}
.tree .cm{color:var(--text-3);font-size:11.5px}
.tree .acts{margin-left:auto;opacity:0;display:flex;gap:2px}
.tree .ln:hover .acts{opacity:1}

.docbody{font-size:13px;line-height:1.95;color:var(--text-2)}
.docbody .cl{display:block;padding:6px 9px;border-radius:6px;margin:2px -9px;cursor:pointer;transition:.12s}
.docbody .cl:hover{background:var(--surface-2)}
.docbody .cl.on{background:var(--warn-bg);color:var(--text);box-shadow:inset 2px 0 0 var(--warn)}
.docbody .cl b{color:var(--text)}

.vouchers{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
.vch{border:1px solid var(--border-2);border-radius:7px;background:var(--surface-2);padding:7px 6px;text-align:center;cursor:pointer;transition:.12s;position:relative}
.vch:hover{border-color:var(--pri);background:var(--pri-bg)}
.vch .ph{height:34px;border-radius:4px;background:linear-gradient(135deg,#1c222a,#252d38);margin-bottom:6px;display:grid;place-items:center;color:var(--text-3);font-size:9.5px;font-family:var(--mono)}
.vch .ty{font-size:11.5px;color:var(--text-2)}
.vch .ex{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.vch .x{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:var(--text-3);opacity:0}
.vch:hover .x{opacity:1}
.vch .x:hover{background:var(--danger-bg);color:var(--danger)}
.vch.add{border-style:dashed;display:grid;place-items:center;min-height:86px;color:var(--text-3)}

.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:120px 1fr 74px;gap:10px;align-items:center;font-size:12.5px}
.barrow .nm{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .pc{font-family:var(--mono);font-size:11.5px;color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:4px;background:var(--surface-4);overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:4px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.track .goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-2)}

/* ==================== charts ==================== */
.viz{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.viz-h{display:flex;align-items:baseline;gap:9px;padding:11px 14px 6px;flex-wrap:wrap}
.viz-h h4{margin:0;font-size:13px;font-weight:620}
.viz-h .q{font-size:11.5px;color:var(--text-3)}
.viz-h .sp{flex:1}
.viz-b{padding:0 8px 8px}
.viz-f{padding:8px 14px 12px;font-size:12px;color:var(--text-2);line-height:1.7;border-top:1px solid var(--border);margin-top:2px;padding-top:10px}
.viz-f b{color:var(--text)}
.vleg{display:flex;gap:12px;flex-wrap:wrap;padding:2px 14px 10px;font-size:11.5px;color:var(--text-2);font-family:var(--mono)}
.vleg span{display:inline-flex;align-items:center;gap:5px}
.vleg i{width:9px;height:9px;border-radius:2px;display:block}
.vtip{position:fixed;z-index:80;pointer-events:none;background:#20262e;border:1px solid var(--border-3);border-radius:7px;padding:7px 10px;font-size:12px;color:var(--text);box-shadow:var(--shadow);opacity:0;transition:opacity .1s;max-width:240px;line-height:1.6}
.vtip.on{opacity:1}
.vtip .tt{font-family:var(--mono);font-size:10.5px;color:var(--text-3);display:block}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{font-family:var(--mono);font-size:9.5px;fill:var(--text-3)}
svg.chart text.lab{font-family:var(--sans);font-size:10.5px;fill:var(--text-2)}
svg.chart .gl{stroke:var(--grid);stroke-width:1}
svg.chart .ax{stroke:var(--axis);stroke-width:1}
svg.chart .pct{stroke-dasharray:4 3;stroke-width:1.5;fill:none}
svg.chart .dot{cursor:pointer}
svg.chart .dot:hover{stroke:#fff;stroke-width:2}
svg.chart rect.hit{fill:transparent;cursor:pointer}
.tblview{font-size:12px;border-top:1px solid var(--border);max-height:200px;overflow:auto}
.tblview table{width:100%;border-collapse:collapse}
.tblview th,.tblview td{padding:5px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.tblview th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);position:sticky;top:0;background:var(--surface-2)}
.tblview td{color:var(--text-2)}
.tblview td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}

/* changelog */
.cl-i{padding:10px 14px;border-bottom:1px solid var(--border)}
.cl-i .top{display:flex;gap:8px;align-items:center;font-size:12.5px}
.cl-i .op{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px}
.op-c{background:var(--ok-bg);color:var(--ok)}
.op-u{background:var(--pri-bg);color:var(--pri)}
.op-d{background:var(--danger-bg);color:var(--danger)}
.cl-i .ts{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.cl-i .ch{margin-top:6px;padding-left:6px;border-left:2px solid var(--v3);display:flex;flex-direction:column;gap:2px}
.cl-i .ch div{font-size:11.5px;color:var(--text-2);display:flex;gap:6px}
.cl-i .ch .ar{color:var(--v3);font-family:var(--mono)}

/* ==================== v4：書寫式編輯器 ==================== */
.doc{padding:6px 2px 40px;min-height:360px;cursor:text}
.eb{
  position:relative;display:flex;align-items:flex-start;gap:6px;
  padding:2px 6px 2px 2px;border-radius:5px;transition:background .1s;
}
.eb:hover{background:rgba(255,255,255,.022)}
.eb.cur{background:rgba(108,182,255,.05)}
.eb-h{
  flex:none;width:22px;display:flex;align-items:center;justify-content:center;
  color:var(--text-3);opacity:0;cursor:grab;user-select:none;padding-top:3px;
}
.eb:hover .eb-h{opacity:.55}
.eb-h:hover{opacity:1!important;color:var(--text-2)}
.eb-h svg{width:13px;height:13px}
.eb-bul{flex:none;width:14px;text-align:center;color:var(--text-3);font-size:12px;user-select:none;padding-top:3px;line-height:1.7}
.eb-tx{
  flex:1;min-width:0;outline:none;line-height:1.75;font-size:14px;color:var(--text);
  word-break:break-word;white-space:pre-wrap;padding:1px 2px;border-radius:3px;
}
.eb-tx:empty::before{content:attr(data-ph);color:var(--text-3);pointer-events:none}
.eb[data-t="h1"] .eb-tx{font-size:21px;font-weight:680;letter-spacing:-.02em;line-height:1.4;margin-top:10px}
.eb[data-t="h2"] .eb-tx{font-size:16.5px;font-weight:650;letter-spacing:-.01em;line-height:1.5;margin-top:8px}
.eb[data-t="h3"] .eb-tx{font-size:14px;font-weight:650;color:var(--text-2);letter-spacing:.02em;margin-top:6px}
.eb[data-t="quote"] .eb-tx{border-left:2px solid var(--border-3);padding-left:10px;color:var(--text-2);font-style:normal}
.eb[data-t="code"] .eb-tx{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--teal)}
.eb[data-t="todo"] .eb-tx.done{color:var(--text-3);text-decoration:line-through}
.eb-ck{flex:none;width:15px;height:15px;margin-top:5px;border:1.5px solid var(--border-3);border-radius:4px;display:grid;place-items:center;cursor:pointer;transition:.12s}
.eb-ck:hover{border-color:var(--pri)}
.eb-ck.on{background:var(--pri);border-color:var(--pri)}
.eb-ck svg{width:10px;height:10px;stroke:#0a0c0f;stroke-width:3;opacity:0}
.eb-ck.on svg{opacity:1}
.eb-div{flex:1;height:1px;background:var(--border-2);margin:11px 0}
.eb-obj{
  flex:1;min-width:0;border:1px solid var(--border-2);border-radius:8px;background:var(--surface-2);
  padding:8px 11px;transition:.12s;
}
.eb-obj:hover{border-color:var(--pri-br)}
.eb-obj-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eb-obj-h .ti{font-size:13.5px;color:var(--text);font-weight:550;flex:1;min-width:0;outline:none}
.eb-obj-p{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;padding-top:7px;border-top:1px dashed var(--border)}
.eb-obj-p .pf{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-3);background:var(--surface-3);border-radius:5px;padding:2px 7px;cursor:pointer;transition:.12s}
.eb-obj-p .pf:hover{background:var(--surface-4);color:var(--text-2)}
.eb-obj-p .pf b{color:var(--text-2);font-weight:500}
.eb-obj-p .pf svg{width:11px;height:11px}
.ind0{margin-left:0}.ind1{margin-left:24px}.ind2{margin-left:48px}.ind3{margin-left:72px}.ind4{margin-left:96px}.ind5{margin-left:120px}
.eb-guide{position:absolute;left:-1px;top:0;bottom:0;width:1px;background:var(--border)}

/* # 召喚選單 */
.summon{
  position:fixed;z-index:66;width:290px;max-height:330px;overflow:auto;
  background:var(--surface);border:1px solid var(--border-2);border-radius:10px;box-shadow:var(--shadow);
  padding:6px;display:none;
}
.summon.on{display:block}
.summon-g{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);padding:7px 9px 3px}
.summon-i{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:7px;cursor:pointer}
.summon-i .ic{width:22px;height:22px;border-radius:5px;background:var(--surface-3);display:grid;place-items:center;flex:none;color:var(--text-3);font-family:var(--mono);font-size:11px}
.summon-i .ic svg{width:12px;height:12px}
.summon-i .bd{flex:1;min-width:0}
.summon-i .nm{font-size:13px;color:var(--text);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summon-i .ds{font-size:11px;color:var(--text-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summon-i .kb{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.summon-i.on{background:var(--pri-bg)}
.summon-i.on .ic{background:#1d3446;color:var(--pri)}
.summon-f{border-top:1px solid var(--border);margin-top:4px;padding:6px 9px 2px;font-size:10.5px;color:var(--text-3);font-family:var(--mono);display:flex;gap:10px}

/* 編輯器工具列 */
.doc-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 0 10px;border-bottom:1px solid var(--border);margin-bottom:8px}
.doc-bar .tt{font-size:19px;font-weight:680;letter-spacing:-.02em;outline:none;flex:1;min-width:120px}
.kbdhint{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-3);font-family:var(--mono)}
.kbdhint kbd{background:var(--surface-3);border:1px solid var(--border-2);border-radius:4px;padding:1px 5px;font-size:10px}

/* ==================== v4：ClickUp 式視圖列 ==================== */
.viewbar{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow-x:auto;padding-bottom:0}
.viewbar .vb{display:inline-flex;align-items:center;gap:6px;padding:7px 11px 9px;font-size:12.5px;color:var(--text-3);white-space:nowrap;border-bottom:2px solid transparent;border-radius:5px 5px 0 0;transition:.12s}
.viewbar .vb:hover{color:var(--text-2);background:var(--surface-2)}
.viewbar .vb.on{color:var(--text);border-bottom-color:var(--pri);font-weight:550}
.viewbar .vb svg{width:13px;height:13px}
.viewbar .sp{flex:1}
.viewcfg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cfgchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--border-2);background:var(--surface-2);font-size:12px;color:var(--text-3);white-space:nowrap}
.cfgchip b{color:var(--text-2);font-weight:500}
.cfgchip select{height:20px;padding:0 16px 0 4px;font-size:12px;border:none;background:transparent;color:var(--text);box-shadow:none;background-position:calc(100% - 4px) 9px,calc(100% - 1px) 9px}
.cfgchip select:focus{box-shadow:none;background:transparent}

/* 群組標頭 */
.grp{display:flex;align-items:center;gap:9px;padding:9px 14px 7px;font-size:12px}
.grp .nm{font-weight:600;color:var(--text)}
.grp .ct{font-family:var(--mono);font-size:11px;color:var(--text-3);background:var(--surface-3);border-radius:10px;padding:1px 7px}
.grp .ln{flex:1;height:1px;background:var(--border)}

/* 看板 */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.bcol{flex:0 0 268px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;max-height:640px}
.bcol-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.bcol-h .dot{width:8px;height:8px;border-radius:50%;flex:none}
.bcol-h .nm{font-size:12.5px;font-weight:600}
.bcol-h .ct{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-left:auto}
.bcol-b{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:60px}
.bcard{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:9px 10px;cursor:pointer;transition:.12s}
.bcard:hover{border-color:var(--border-3);background:var(--surface-3)}
.bcard.drag{opacity:.4}
.bcard .tt{font-size:12.5px;color:var(--text);line-height:1.5;margin-bottom:6px}
.bcard .mt{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.bcol.over{border-color:var(--pri);box-shadow:0 0 0 2px rgba(108,182,255,.18)}
.bcol-add{padding:7px 10px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);text-align:left}
.bcol-add:hover{color:var(--pri)}

/* 日曆 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.cal .dh{background:var(--surface-2);padding:6px 8px;font-family:var(--mono);font-size:10.5px;color:var(--text-3);text-align:center;letter-spacing:.06em}
.cal .dc{background:var(--surface);min-height:92px;padding:6px 7px;display:flex;flex-direction:column;gap:4px}
.cal .dc.out{background:#0d1014}
.cal .dc .dn{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.cal .dc.today .dn{color:var(--pri);font-weight:700}
.cal .ev{font-size:11px;padding:2px 5px;border-radius:4px;background:var(--surface-3);color:var(--text-2);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev:hover{background:var(--surface-4);color:var(--text)}
.cal .ev.p{background:var(--pri-bg);color:var(--pri)}
.cal .ev.d{background:var(--danger-bg);color:var(--danger)}
.cal .ev.i{background:var(--info-bg);color:var(--info)}

/* 優先級旗標 */
.flag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-family:var(--mono)}
.flag svg{width:11px;height:11px}
.pri-1{color:var(--danger)}.pri-2{color:var(--warn)}.pri-3{color:var(--pri)}.pri-4{color:var(--text-3)}

/* 關聯 */
.rel{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.rel:last-child{border-bottom:none}
.rel .ty{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.rel .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--pri);cursor:pointer}
.ty-block{background:var(--danger-bg);color:var(--danger)}
.ty-wait{background:var(--warn-bg);color:var(--warn)}
.ty-link{background:var(--pri-bg);color:var(--pri)}
.ty-doc{background:var(--info-bg);color:var(--info)}

/* 階層麵包屑 */
.hier{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);font-family:var(--mono);margin-bottom:10px;flex-wrap:wrap}
.hier b{color:var(--text-2);font-weight:500;cursor:pointer}
.hier b:hover{color:var(--pri)}
.hier .sep{opacity:.5}

/* 自訂欄位 */
.cfs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ---------- 產生歷史樣本（讓 P50/P85、預測、CFD 有真實分布） ---------- */
function genHistory(){
  const conf={S:[0.6,1.6],M:[1.2,3.4],L:[3.0,7.0]}, out=[];
  const mix=[['S',41],['M',34],['L',6]];
  mix.forEach(([sz,n])=>{
    for(let i=0;i<n;i++){
      const [a,b]=conf[sz];
      const r=rnd(), lognormish=a+(b-a)*Math.pow(r,0.55)+(rnd()<0.12?(b-a)*1.6*rnd():0);
      const cyc=Math.max(0.5,Math.round(lognormish*10)/10);
      const back=Math.floor(rnd()*84)+3;
      const done=dadd(TODAY,-back);
      out.push({id:`H${sz}${i}`,size:sz,done,cycle:cyc,p:['PRJ-2026-004','PRJ-2026-007','PRJ-2026-009'][Math.floor(rnd()*3)]});
    }
  });
  return out.sort((x,y)=>x.done<y.done?-1:1);
}
DB.history=genHistory();

const P=id=>DB.projects.find(x=>x.id===id);
const ISS=id=>DB.issues.find(x=>x.id===id);
const TX=id=>DB.txns.find(x=>x.id===id);
const EVT=id=>DB.events.find(x=>x.id===id);
const CMT=id=>DB.commitments.find(x=>x.id===id);
const person=k=>(DB.people[k]||{n:k}).n;
const nt=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);

function projTxns(pid){return DB.txns.filter(t=>t.p===pid)}
function gross(pid){return projTxns(pid).filter(t=>!t.pass).reduce((a,b)=>a+b.amt,0)}
function revenue(pid){return projTxns(pid).filter(t=>!t.pass&&t.amt>0).reduce((a,b)=>a+b.amt,0)}
function costs(pid){return -projTxns(pid).filter(t=>!t.pass&&t.amt<0).reduce((a,b)=>a+b.amt,0)}
function bonus(pid){const p=P(pid);return Math.max(0,Math.round(gross(pid)*Math.min(p.rate,p.cap)/100))}
function actualSpend(pid){return costs(pid)}

function ageOf(i){return i.started? ddiff(i.started,TODAY):0}
function cycleOf(i){return (i.started&&i.done)? ddiff(i.started,i.done):null}
function samples(size){
  const h=DB.history.filter(x=>x.size===size).map(x=>x.cycle);
  DB.issues.filter(i=>i.size===size&&i.done&&i.started).forEach(i=>h.push(ddiff(i.started,i.done)||0.5));
  return h.sort((a,b)=>a-b);
}
function pct(arr,q){ if(!arr.length)return null; const i=Math.min(arr.length-1,Math.ceil(q*arr.length)-1); return arr[Math.max(0,i)] }
function sle(size){const s=samples(size);return {n:s.length,p50:pct(s,.5),p85:pct(s,.85)}}
function wip(){return DB.issues.filter(i=>i.st==='Doing'||i.st==='Review').length}
function throughputAvg(){const w=DB.weekly.map(x=>x[1]);return (w.reduce((a,b)=>a+b,0)/w.length)}
function agingRisk(i){const s=sle(i.size);const a=ageOf(i);if(!s.p85)return 'ok';return a>s.p85?'crit':a>s.p50?'warn':'ok'}
function commitStatus(c){
  if(c.st==='已完成')return '已完成';
  const recent=c.logs.slice(0,2);
  if(recent.some(l=>l.ok===false))return '落後';
  if(!c.logs.length)return '待回顧';
  return '履行中';
}

   ================================================================== */
function nid(pre){DB.seq[pre]=(DB.seq[pre]||0)+1;return pre+'-'+String(DB.seq[pre]).padStart(3,'0')}
function nowts(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')}

/**
 * commit — 唯一的寫入入口
 * op: 'create' | 'update' | 'delete'
 * ent: 物件種類中文名
 * label: 這一筆的名字
 * apply: 實際改資料的函式，回傳「下游影響」字串陣列
 * undo: 可選，回復用
 */
function commit(op,ent,label,apply,undo){
  const eff=apply()||[];
  DB.changelog.unshift({ts:nowts(),op,ent,label,eff});
  if(DB.changelog.length>60)DB.changelog.pop();
  render(); paintFlowBadge();
  const opw={create:'新增',update:'更新',delete:'刪除'}[op];
  toast(`${opw} <b>${esc(ent)}</b>　${esc(label)}` + (eff.length?`　<span style="color:var(--text-3)">· 連動 ${eff.length} 處</span>`:''), undo);
  return eff;
}
function paintFlowBadge(){ const n=DB.changelog.length; const el=$('#flowN'); el.textContent=n; el.style.display=n?'grid':'none'; }

/* 下游影響計算 —— 這是「資料流會怎麼串」的實作 */
function effProject(pid){
  const p=P(pid); if(!p)return [];
  const out=[`專案 <b>${esc(p.t)}</b> 可分配毛利 → <b>${nt(gross(pid))}</b>`];
  if(p.rate>0) out.push(`獎金（${Math.min(p.rate,p.cap)}%）→ <b>${nt(bonus(pid))}</b>`);
  if(p.budget) out.push(`預算用量 → <b>${Math.round(actualSpend(pid)/p.budget*100)}%</b>`);
  out.push(`金流 · 洞察：毛利率圖表重算`);
  if(pid==='PRJ-2026-004') out.push(`人事 · 獎金閘門⑤「成本可確定」重新判定`);
  return out;
}
function effFlow(){
  const m=sle('M');
  return [`容量 · Throughput / Cycle Time 重算`,
          `M 尺寸樣本 n=<b>${m.n}</b>　P50 <b>${m.p50}d</b>　P85 <b>${m.p85}d</b>`,
          `工作台「現在」欄的 age 警示重新判定`];
}

/* ---------- toast + undo ---------- */
let toastSeq=0;
function toast(msg,undo){
  const el=document.createElement('div'); el.className='toast'; const id=++toastSeq;
  el.innerHTML=`<span>${msg}</span>`;
  if(undo){
    const b=document.createElement('button'); b.className='undo'; b.textContent='復原';
    b.onclick=()=>{undo();render();paintFlowBadge();el.remove();toast('已復原');};
    el.appendChild(b);
  }
  const box=$('#toasts'); box.appendChild(el);
  while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),320)}, undo?5200:2400);
}

function filterCmdk(q){
  q=q.trim().toLowerCase();
  const hits=q?cmdkItems.filter(i=>(i.t+i.h+i.g).toLowerCase().includes(q)):cmdkItems.slice(0,15);
  window._hits=hits; cmdkSel=Math.min(cmdkSel,Math.max(0,hits.length-1));
  let html='',lg='';
  hits.slice(0,40).forEach((i,n)=>{
    if(i.g!==lg){html+=`<div class="cmdk-g">${i.g}</div>`;lg=i.g}

  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#cmdkWrap').classList.contains('on')?closeCmdk():openCmdk();return}

/* ---------- 3. 累積流程圖 CFD ----------
   堆疊順序 由下而上 Done → Review → Doing → Todo，色票依驗證過的相鄰順序
   v1→v2→v3→v4 指派，確保每一對相鄰色帶都通過 CVD 分離檢查。            */
function vCFD(){
  const days=42, W=720, H=240, ml=36, mr=88, mt=14, mb=28;
  const dates=[]; for(let i=days;i>=0;i--)dates.push(dadd(TODAY,-i));
  const live=DB.issues;
  const at=d=>{
    const done=DB.history.filter(h=>h.done<=d).length+live.filter(i=>i.done&&i.done<=d).length;
    const review=live.filter(i=>i.st==='Review'&&i.started&&i.started<=d&&(!i.done||i.done>d)).length;
    const doing=live.filter(i=>i.st!=='Review'&&i.started&&i.started<=d&&(!i.done||i.done>d)).length;
    const todo=live.filter(i=>i.created<=d&&(!i.started||i.started>d)).length;
    return [done,review,doing,todo];
  };
  let rows=dates.map(at);
  // 只看視窗內的累積：把視窗起點的 Done 當作基線，否則歷史 Done 會壓扁其他色帶
  const base=rows[0][0];
  rows=rows.map(r=>[r[0]-base,r[1],r[2],r[3]]);
  const maxY=Math.max(...rows.map(r=>r.reduce((a,b)=>a+b,0)))*1.08||1;
  const x=i=>ml+(W-ml-mr)*(i/(dates.length-1));
  const y=v=>mt+(H-mt-mb)*(1-v/maxY);
  const names=['Done','Review','Doing','Todo'], cols=[VC.v1,VC.v2,VC.v3,VC.v4];
  let g='';
  for(let t=0;t<=maxY;t+=Math.ceil(maxY/4))g+=`<line class="gl" x1="${ml}" y1="${y(t)}" x2="${W-mr}" y2="${y(t)}"/><text x="${ml-6}" y="${y(t)+3}" text-anchor="end">${t}</text>`;
  [42,28,14,0].forEach(d=>{const i=dates.indexOf(dadd(TODAY,-d));if(i>=0)g+=`<text class="lab" x="${x(i)}" y="${H-9}" text-anchor="middle">${d?d+'d 前':'今天'}</text>`});
  // 由下往上堆疊，帶間留 2px 表面色縫隙
  const labs=[];
  for(let s=0;s<4;s++){
    const lower=rows.map(r=>r.slice(0,s).reduce((a,b)=>a+b,0));
    const upper=rows.map(r=>r.slice(0,s+1).reduce((a,b)=>a+b,0));
    const up=upper.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    const dn=lower.map((v,i)=>`${x(i)},${y(v)}`).reverse().join(' ');
    g+=`<polygon points="${up} ${dn}" fill="${cols[s]}" fill-opacity=".85" stroke="${VC.surf}" stroke-width="2"/>`;
    const last=upper[upper.length-1], prev=lower[lower.length-1], band=last-prev;
    if(band>0)labs.push({y:(y(last)+y(prev))/2+4,t:`${names[s]} ${band}`,c:cols[s]});
  }
  // 標籤防重疊：由上而下強制 15px 間距
  labs.sort((a,b)=>a.y-b.y);
  for(let i=1;i<labs.length;i++) if(labs[i].y-labs[i-1].y<15) labs[i].y=labs[i-1].y+15;
  labs.forEach(l=>{g+=`<text class="lab" x="${W-mr+8}" y="${l.y}" fill="${l.c}">${l.t}</text>`});
  // 垂直 hit 區（游標讀數）
  dates.forEach((d,i)=>{
    const r=rows[i], w=(W-ml-mr)/(dates.length-1);
    g+=`<rect class="hit" x="${x(i)-w/2}" y="${mt}" width="${w}" height="${H-mt-mb}"
        data-tip="${atip(`<b>${d}</b>`+names.map((n,k)=>`<span class="tt">${n}　${r[k]}</span>`).join(''))}"/>`;
  });
  const now=rows[rows.length-1];
  const tbl=`<table><thead><tr><th>日期</th>${names.map(n=>`<th class="n">${n}</th>`).join('')}</tr></thead><tbody>
    ${dates.filter((d,i)=>i%7===0).map((d,i2)=>{const r=rows[dates.indexOf(d)];return `<tr><td>${d}</td>${r.map(v=>`<td class="n">${v}</td>`).join('')}</tr>`}).join('')}</tbody></table>`;
  return vizFrame({title:'累積流程圖 CFD',q:'工作在哪一站塞住了？',
    svg:`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<line class="ax" x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}"/></svg>`,
    legend:names.map((n,i)=>lgi(cols[i],n)).join(''),
    table:tbl,
    foot:`色帶的<b>厚度</b>就是那一站的在製品數量，<b>水平寬度</b>就是停留時間。帶子平行往上＝流動穩定；某一帶持續變厚＝那一站塞住。目前 Todo ${now[3]}、Doing ${now[2]}、Review ${now[1]}。<b>Done 帶只會上升，往下代表資料有錯。</b><br><span style="color:var(--text-3)">縱軸以 42 天前為基線，只看這段期間內的累積。</span>`});
}

/* ---------- 4. Monte Carlo 預測直方圖（日粒度） ---------- */
function vForecast(remaining,deadline){
  const w=DB.weekly.map(x=>x[1]), runs=4000, res=[];
  const r2=mulberry(977+remaining);
  for(let k=0;k<runs;k++){
    let left=remaining,d=0;
    while(left>0&&d<250){                 // 抽「一週的實際產出」，最後一週按比例換算到日
      const cap=w[Math.floor(r2()*w.length)];
      if(cap<=0){d+=7;continue}
      if(left<=cap){d+=Math.max(1,Math.ceil(left/cap*7));left=0}
      else{left-=cap;d+=7}
    }
    res.push(d);
  }
  res.sort((a,b)=>a-b);
  const p50=res[Math.floor(runs*.5)],p85=res[Math.floor(runs*.85)];
  const lo=res[0],hi=res[Math.floor(runs*.985)];
  const step=Math.max(1,Math.ceil((hi-lo+1)/34));
  const bins=[];
  for(let v=lo;v<=hi;v+=step)bins.push({v,n:0});
  res.forEach(d=>{const i=Math.min(bins.length-1,Math.floor((d-lo)/step));if(i>=0)bins[i].n++});
  const W=720,H=210,ml=42,mr=16,mt=30,mb=32;
  const maxC=Math.max(...bins.map(b=>b.n))||1;
  const bw=(W-ml-mr)/bins.length;
  const xOf=d=>ml+((d-lo)/step)*bw+bw/2;
  let g='';
  for(let t=0;t<=maxC;t+=Math.ceil(maxC/3))g+=`<line class="gl" x1="${ml}" y1="${mt+(H-mt-mb)*(1-t/maxC)}" x2="${W-mr}" y2="${mt+(H-mt-mb)*(1-t/maxC)}"/><text x="${ml-6}" y="${mt+(H-mt-mb)*(1-t/maxC)+3}" text-anchor="end">${Math.round(t/runs*100)}%</text>`;
  bins.forEach((b,i)=>{
    const h=(H-mt-mb)*(b.n/maxC),x0=ml+i*bw;
    const col=b.v<=p50?VC.seq[2]:b.v<=p85?VC.seq[3]:VC.seq[4];
    g+=`<rect x="${x0+0.8}" y="${H-mb-h}" width="${Math.max(1,bw-1.6)}" height="${Math.max(1,h)}" rx="2" fill="${col}"
        data-tip="${atip(`<b>${dadd(TODAY,b.v)}</b><span class="tt">第 ${b.v} 天完成 · ${Math.round(b.n/runs*100)}% 的模擬落在這裡</span>`)}"/>`;
  });
  [[p50,'P50 '+dadd(TODAY,p50),VC.ink,-16],[p85,'P85 '+dadd(TODAY,p85),VC.warn,-4]].forEach(([v,lab,c,dy])=>{
    g+=`<line x1="${xOf(v)}" y1="${mt-2}" x2="${xOf(v)}" y2="${H-mb}" stroke="${c}" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="${xOf(v)+4}" y="${mt+dy}" fill="${c}">${lab}</text>`;
  });
  [0,0.5,1].forEach(f=>{const d=Math.round(lo+(hi-lo)*f);
    g+=`<text class="lab" x="${Math.min(W-mr-24,Math.max(ml+12,xOf(d)))}" y="${H-10}" text-anchor="middle">${dadd(TODAY,d).slice(5)}</text>`});
  const okBy=deadline?Math.round(res.filter(v=>v<=ddiff(TODAY,deadline)).length/runs*100):null;
  const tbl=`<table><thead><tr><th>完成日</th><th class="n">天數</th><th class="n">累積機率</th></tr></thead><tbody>
    ${[0.25,0.5,0.7,0.85,0.95].map(q=>{const v=res[Math.floor(runs*q)];
      return `<tr><td>${dadd(TODAY,v)}</td><td class="n">${v} 天</td><td class="n">${Math.round(q*100)}%</td></tr>`}).join('')}</tbody></table>`;
  return vizFrame({title:'Monte Carlo 完成預測',q:`剩下 ${remaining} 件，什麼時候做得完？`,
    svg:`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<line class="ax" x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}"/></svg>`,
    legend:lgi(VC.seq[2],'P50 以內')+lgi(VC.seq[3],'P50–P85')+lgi(VC.seq[4],'P85 之後')
      +(deadline?`<span>目標日 ${deadline} 達成機率 <b style="color:${okBy>=80?VC.good:okBy>=50?VC.warn:VC.crit}">${okBy}%</b></span>`:''),
    table:tbl,
    foot:`用近 ${w.length} 週的實際 throughput 逐日重抽樣 ${runs} 次。<b>輸出是機率不是日期</b>：對內規劃看 P50（${dadd(TODAY,p50)}），對客戶承諾用 P85（${dadd(TODAY,p85)}）。兩者差 <b>${p85-p50} 天</b> —— 這段差距就是你的不確定性成本。`});
}

/* ---------- 5. 可分配毛利瀑布圖 ---------- */
function vWaterfall(pid){
  const p=P(pid), tx=projTxns(pid).filter(t=>!t.pass);
  const inc=tx.filter(t=>t.amt>0), cost=tx.filter(t=>t.amt<0);
  const steps=[{l:'未稅收入',v:inc.reduce((a,b)=>a+b.amt,0),k:'in'}];
  const byCat={}; cost.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amt);
  Object.keys(byCat).forEach(c=>steps.push({l:c,v:byCat[c],k:'out'}));
  const total=steps.reduce((a,b)=>a+b.v,0);
  steps.push({l:'可分配毛利',v:total,k:'sum'});
  const W=720,H=220,ml=8,mr=8,mt=24,mb=34;
  const maxV=Math.max(...steps.map(s=>Math.abs(s.v)),Math.abs(total))*1.05||1;
  const top=Math.max(steps[0].v,total)*1.08||1;
  const y=v=>mt+(H-mt-mb)*(1-v/top);
  const bw=(W-ml-mr)/steps.length;
  let g='',run=0;
  steps.forEach((s,i)=>{
    const x0=ml+i*bw+bw*0.16, w=bw*0.68;
    let yTop,h,col;
    if(s.k==='sum'){yTop=y(total);h=y(0)-y(total);col=VC.v3}
    else if(s.k==='in'){yTop=y(s.v);h=y(0)-y(s.v);col=VC.v1;run=s.v}
    else{const from=run;run=run+s.v;yTop=y(from);h=y(run)-y(from);col=VC.v2}
    g+=`<rect x="${x0}" y="${yTop}" width="${w}" height="${Math.max(2,h)}" rx="3" fill="${col}"
        data-tip="${atip(`<b>${esc(s.l)}</b><span class="tt">${nt(s.v)}</span>`)}"/>`;
    g+=`<text class="lab" x="${x0+w/2}" y="${H-18}" text-anchor="middle">${esc(s.l)}</text>`;
    g+=`<text x="${x0+w/2}" y="${H-6}" text-anchor="middle" fill="${col}">${nt(s.v)}</text>`;
    if(i<steps.length-1)g+=`<line x1="${x0+w}" y1="${s.k==='in'?y(run):y(run)}" x2="${ml+(i+1)*bw+bw*0.16}" y2="${y(run)}" stroke="${VC.axis}" stroke-dasharray="2 3"/>`;
  });
  const rate=inc.reduce((a,b)=>a+b.amt,0)?Math.round(total/inc.reduce((a,b)=>a+b.amt,0)*100):0;
  const pass=projTxns(pid).filter(t=>t.pass).reduce((a,b)=>a+b.amt,0);
  const tbl=`<table><thead><tr><th>項目</th><th class="n">金額</th></tr></thead><tbody>
    ${steps.map(s=>`<tr><td>${esc(s.l)}</td><td class="n">${nt(s.v)}</td></tr>`).join('')}
    ${pass?`<tr><td style="color:var(--warn)">代收代付（不計入 §9.3）</td><td class="n" style="color:var(--warn)">${nt(pass)}</td></tr>`:''}</tbody></table>`;
  return vizFrame({title:'可分配毛利　'+esc(p.t.split('·')[0].trim()),q:'獎金是乘在哪個數字上？',
    svg:`<svg class="chart" viewBox="0 0 ${W} ${H}"><line class="ax" x1="${ml}" y1="${y(0)}" x2="${W-mr}" y2="${y(0)}"/>${g}</svg>`,
    legend:lgi(VC.v1,'收入')+lgi(VC.v2,'扣除項')+lgi(VC.v3,'可分配毛利')+(pass?`<span style="color:var(--warn)">代收代付 ${nt(pass)} 已排除</span>`:''),
    table:tbl,
    foot:`毛利率 <b>${rate}%</b>。獎金 ${Math.min(p.rate,p.cap)}% 乘在<b>可分配毛利</b>（${nt(total)}）上，不是乘在收入上 —— 契約 §9、§10。${pass?`代收代付的廣告媒體費 ${nt(-pass)} 依 §9.3 分列且不計入。`:''}在帳本新增或刪除一筆歸屬此專案的交易，這張圖會立刻變。`});
}

    g+=`<rect x="${ml}" y="${yy+4}" width="${bl}" height="18" rx="4" fill="${VC.grid}"

    g+=`<text x="${W-mr+8}" y="${yy+17}" fill="${over?VC.crit:VC.ink}">${Math.round(act/p.budget*100)}%</text>`;

  return vizFrame({title:'預算 vs 實際',q:'哪個專案吃掉了比預期多的成本？',
    svg:`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`,
    legend:lgi(VC.grid,'預算範圍')+lgi(VC.v1,'實際支出')+lgi(VC.crit,'已超支')+`<span><i style="background:${VC.ink};width:2px;height:12px"></i>預算線</span>`,
    table:tbl,
    foot:'實際支出＝該專案在帳本裡所有成本類交易的總和。<b>它不是另一份資料</b>，是帳本用 project_id 篩出來的同一批交易。'});

/* ---------- 7. sparkline ---------- */
function vSpark(series,color,w,h){
  w=w||120;h=h||30;
  const vals=series.map(s=>s[1]),mn=Math.min(...vals),mx=Math.max(...vals),sp=mx-mn||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-2-((v-mn)/sp)*(h-6)}`).join(' ');
  const last=vals[vals.length-1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="width:${w}px" data-tip="${atip(series.map(s=>s[0]+'：'+s[1]).join('　'))}">
    <polyline points="${pts}" fill="none" stroke="${color||VC.v1}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${w}" cy="${h-2-((last-mn)/sp)*(h-6)}" r="3" fill="${color||VC.v1}"/></svg>`;
}

  const cs=DB.commitments.filter(c=>c.dir===dir);
  const W=720,cell=30,ml=210,mt=22,H=mt+cs.length*cell+10;

  months.forEach((m,i)=>g+=`<text class="lab" x="${ml+i*((W-ml-10)/months.length)+((W-ml-10)/months.length)/2}" y="${mt-8}" text-anchor="middle">${m.slice(5)}月</text>`);
  cs.forEach((c,r)=>{
    g+=`<text class="lab" x="${ml-10}" y="${mt+r*cell+19}" text-anchor="end">${esc(c.t.length>16?c.t.slice(0,15)+'…':c.t)}</text>`;
    months.forEach((m,i)=>{
      const logs=c.logs.filter(l=>l.d.startsWith(m));

      const cw=(W-ml-10)/months.length;
      const col=bad?VC.crit:n===0?'#1b2029':VC.seq[Math.max(0,3-Math.min(n,3))];
      g+=`<rect x="${ml+i*cw+2}" y="${mt+r*cell+2}" width="${cw-4}" height="${cell-6}" rx="4" fill="${col}"
          data-tip="${atip(`<b>${esc(c.t)}</b><span class="tt">${m}　${n?n+' 筆紀錄':'無紀錄'}${bad?' · 有未履行':''}</span>${logs.map(l=>'<span class="tt">'+esc(l.t)+'</span>').join('')}`)}"
          onclick="S.doc='${c.doc}';S.clause='${c.clause}';render()" style="cursor:pointer"/>`;
      if(bad)g+=`<text x="${ml+i*cw+cw/2}" y="${mt+r*cell+18}" text-anchor="middle" fill="#1a0d0d" style="font-weight:700">✕</text>`;
      else if(n)g+=`<text x="${ml+i*cw+cw/2}" y="${mt+r*cell+18}" text-anchor="middle" fill="#eaf2fb">${n}</text>`;
    });
  });
  const tbl=`<table><thead><tr><th>承諾</th>${months.map(m=>`<th class="n">${m.slice(5)}月</th>`).join('')}</tr></thead><tbody>
    ${cs.map(c=>`<tr><td>${esc(c.t)}</td>${months.map(m=>{const l=c.logs.filter(x=>x.d.startsWith(m));return `<td class="n">${l.some(x=>x.ok===false)?'未履行':l.length||'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table>`;
  return vizFrame({title:dir+'承諾履行熱圖',q:'說到的，每個月都有做到嗎？',
    svg:`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`,

    table:tbl,
    foot:'空白格不代表沒做，代表<b>沒有留下紀錄</b> —— 這兩件事在爭議發生時是同一件事。點任一格跳到該條承諾。'});
}

/* ---------- 10. 週產出長條 ---------- */
function vWeekly(){
  const W=720,H=120,ml=32,mr=10,mt=12,mb=24;
  const d=DB.weekly,mx=Math.max(...d.map(x=>x[1]));
  const bw=(W-ml-mr)/d.length;
  let g='';
  for(let t=0;t<=mx;t+=Math.ceil(mx/2))g+=`<line class="gl" x1="${ml}" y1="${mt+(H-mt-mb)*(1-t/mx)}" x2="${W-mr}" y2="${mt+(H-mt-mb)*(1-t/mx)}"/><text x="${ml-6}" y="${mt+(H-mt-mb)*(1-t/mx)+3}" text-anchor="end">${t}</text>`;
  d.forEach(([w,v],i)=>{
    const h=(H-mt-mb)*(v/mx);
    g+=`<rect x="${ml+i*bw+bw*0.2}" y="${H-mb-h}" width="${bw*0.6}" height="${h}" rx="3" fill="${VC.v1}"
        data-tip="${atip(`<b>${w}</b><span class="tt">完成 ${v} 件</span>`)}"/>`;
    g+=`<text class="lab" x="${ml+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${w}</text>`;
  });
  const avg=(d.reduce((a,b)=>a+b[1],0)/d.length).toFixed(1);
  g+=`<line class="pct" x1="${ml}" y1="${mt+(H-mt-mb)*(1-avg/mx)}" x2="${W-mr}" y2="${mt+(H-mt-mb)*(1-avg/mx)}" stroke="${VC.warn}"/>`;
  return vizFrame({title:'每週 Throughput',q:'我們一週吃得下幾件？',
    svg:`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<line class="ax" x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}"/></svg>`,
    legend:lgi(VC.v1,'每週完成件數')+lgl(VC.warn,`平均 ${avg} 件`),
    foot:`Little's Law：平均 WIP ＝ 平均 Throughput × 平均 Cycle Time。目前 WIP <b>${wip()}</b>、Throughput <b>${avg}</b> 件/週 → 推得平均 Cycle Time 約 <b>${(wip()/(avg/7)).toFixed(1)} 天</b>。`});
}

let FORM=null;
function openForm(cfg){FORM=cfg;openDrawer('form','x',cfg.replace)}
function fInput(f,v){
  const id='f_'+f.k, val=v==null?'':v;
  if(f.type==='select')
    return `<select id="${id}">${f.opts.map(o=>{const[ov,ol]=Array.isArray(o)?o:[o,o];
      return `<option value="${esc(ov)}" ${String(ov)===String(val)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  if(f.type==='chips')
    return `<div class="chipset" id="${id}" data-val="${esc(val)}">${f.opts.map(o=>{const[ov,ol]=Array.isArray(o)?o:[o,o];
      return `<button type="button" class="${String(ov)===String(val)?'on':''}" onclick="pickChip('${id}','${esc(ov)}')">${esc(ol)}</button>`}).join('')}</div>`;
  if(f.type==='textarea')
    return `<textarea id="${id}" rows="${f.rows||4}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
  return `<input type="${f.type||'text'}" id="${id}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.step?`step="${f.step}"`:''}>`;
}
function pickChip(id,v){
  const el=document.getElementById(id); el.dataset.val=v;
  [...el.children].forEach(b=>b.classList.toggle('on',b.textContent.trim()===v||b.getAttribute('onclick').includes(`'${v}'`)));
  if(FORM&&FORM.onChange)FORM.onChange();
}
function fVal(k){
  const el=document.getElementById('f_'+k); if(!el)return '';
  if(el.classList.contains('chipset'))return el.dataset.val;
  return el.value;
}
function formBody(){
  const c=FORM;
  const rows=[];
  for(let i=0;i<c.fields.length;i++){
    const f=c.fields[i];
    if(f.half&&c.fields[i+1]&&c.fields[i+1].half){
      const g=c.fields[i+1];
      rows.push(`<div class="frow two">
        <div class="frow"><label class="flab" for="f_${f.k}">${esc(f.label)}${f.req?'<span class="req">*</span>':''}</label>${fInput(f,c.values[f.k])}${f.hint?`<div class="fhint">${f.hint}</div>`:''}</div>
        <div class="frow"><label class="flab" for="f_${g.k}">${esc(g.label)}${g.req?'<span class="req">*</span>':''}</label>${fInput(g,c.values[g.k])}${g.hint?`<div class="fhint">${g.hint}</div>`:''}</div>
      </div>`); i++;
    } else {
      rows.push(`<div class="frow"><label class="flab" for="f_${f.k}">${esc(f.label)}${f.req?'<span class="req">*</span>':''}</label>
        ${fInput(f,c.values[f.k])}${f.hint?`<div class="fhint">${f.hint}</div>`:''}</div>`);
    }
  }
  return `<div class="form">${rows.join('')}
    <div class="ferr" id="fErr"></div>
    ${c.effects?`<div class="effects"><div class="h">存檔後會連動到</div>${c.effects.map(e=>`<div class="e"><span class="ar">→</span><span>${e}</span></div>`).join('')}</div>`:''}
  </div>`;
}
function saveForm(){
  const c=FORM, vals={};
  let bad=null;
  c.fields.forEach(f=>{
    const v=fVal(f.k); vals[f.k]=v;
    const el=document.getElementById('f_'+f.k);
    const empty=(v==null||String(v).trim()==='');
    if(el)el.classList.toggle('err',!!(f.req&&empty));
    if(f.req&&empty&&!bad)bad=f.label;
  });
  const err=$('#fErr');
  if(bad){err.textContent='「'+bad+'」為必填';err.classList.add('on');return}
  err.classList.remove('on');
  c.onSave(vals);
  if(!c.keepOpen)closeDrawer();
}

  openForm({crumb:e?e.id:'新 Issue',title:e?'編輯 Issue':'新增 Issue',sub:e?e.id:'建立後會同時出現在專案、工作台、容量統計',
    fields:[

      {k:'p',label:'專案',type:'select',opts:PROJ_OPTS(),req:true,half:true},
      {k:'owner',label:'Owner',type:'select',opts:PEOPLE_OPTS(),req:true,half:true},
      {k:'size',label:'Size',type:'chips',opts:['S','M','L'],req:true,hint:'只填相對尺寸，不填工時估計'},
      {k:'pri',label:'優先級',type:'chips',opts:[['1','緊急'],['2','高'],['3','普通'],['4','低']],req:true},
      {k:'st',label:'Status',type:'chips',opts:['Todo','Doing','Review','Done'],req:true},
      {k:'started',label:'Started',type:'date',half:true,hint:'流量指標的唯一來源'},
      {k:'done',label:'Done',type:'date',half:true},
      {k:'exp',label:'Expected Output',ph:'另一個人看到什麼，算完成'},
      {k:'blocker',label:'Blocker',ph:'沒有就留空'}
    ],
    values:e?{...e,pri:String(e.pri||4)}:{t:'',p:presetP||S.proj,owner:'yz',size:'M',pri:'3',st:'Todo',started:'',done:'',exp:'',blocker:'',...Object.fromEntries(Object.entries(pre).map(([k,v])=>[k,String(v)]))},
    effects:['專案 · 工作分頁的清單與完成數','工作台「現在／未來」欄與 WIP 計數',
             '容量 · Aging WIP、CFD、Cycle Time 散布圖','填了 Started 與 Done 才會進入 P50/P85 樣本'],
    onDelete:e?()=>delIssue(id):null,
    onSave:v=>{
      if(e){
        const before={...e};
        commit('update','Issue',v.t,()=>{
          Object.assign(e,{t:v.t,p:v.p,owner:v.owner,size:v.size,pri:Number(v.pri),st:v.st,started:v.started,done:v.done,exp:v.exp,blocker:v.blocker});
          if(e.st!=='Todo'&&!e.started)e.started=TODAY;
          if(e.st==='Done'&&!e.done)e.done=TODAY;
          const ef=['專案 <b>'+esc(P(e.p).t)+'</b> 的工作清單已更新','工作台 WIP → <b>'+wip()+'</b>'];
          if(e.done&&e.started)ef.push(...effFlow());
          return ef;
        },()=>Object.assign(e,before));
      }else{
        const it={id:nid('ISS'),t:v.t,p:v.p,owner:v.owner,size:v.size,pri:Number(v.pri),st:v.st,created:TODAY,
                  started:v.st!=='Todo'?(v.started||TODAY):v.started,done:v.st==='Done'?(v.done||TODAY):v.done,
                  blocker:v.blocker,exp:v.exp,ev:0,rel:[],cf:{},sub:[]};
        commit('create','Issue',v.t,()=>{
          DB.issues.unshift(it);
          const ef=[`專案 <b>${esc(P(it.p).t)}</b> 工作數 → <b>${DB.issues.filter(x=>x.p===it.p).length}</b>`,
                    `工作台 WIP → <b>${wip()}</b>${wip()>3?'　<span style="color:var(--warn)">已超過上限 3（契約 §2.5）</span>':''}`,
                    `CFD 的 ${it.st} 帶 +1`];
          if(it.done)ef.push(...effFlow());
          return ef;
        },()=>{DB.issues=DB.issues.filter(x=>x.id!==it.id)});
      }
    }});
}
function delIssue(id){
  const e=ISS(id),i=DB.issues.indexOf(e);
  confirmDelete('Issue',e.t,`它在 <b>${esc(P(e.p).t)}</b> 底下，並計入 WIP 與流量指標。`,()=>{
    closeDrawer();
    commit('delete','Issue',e.t,()=>{DB.issues.splice(i,1);
      return [`專案工作數 −1`,`工作台 WIP → <b>${wip()}</b>`,`CFD 與 Aging 圖重畫`]},
      ()=>DB.issues.splice(i,0,e));
  });
}
function setIssueStatus(id,st){
  const e=ISS(id),before={...e};
  commit('update','Issue 狀態',`${e.t} → ${st}`,()=>{
    e.st=st;
    if(st!=='Todo'&&!e.started)e.started=TODAY;
    if(st==='Done'){e.done=e.done||TODAY}else{e.done=''}
    const ef=[`CFD：移到 <b>${st}</b> 帶`,`工作台 WIP → <b>${wip()}</b>`];
    if(st==='Done'&&e.started)ef.push(`Cycle Time 新樣本 <b>${ddiff(e.started,e.done)} 天</b>`,...effFlow());
    if(st==='Done'&&!e.ev)ef.push(`<span style="color:var(--warn)">此 Issue 沒有 Evidence（Handbook 03.3）</span>`);
    return ef;
  },()=>Object.assign(e,before));
}

    effects:['時間線清單與層級篩選','標星者進入工作台「未來」欄','有連結專案者出現在該專案總覽'],

    onSave:v=>{
      if(e){const b={...e};
        commit('update','事件',v.t,()=>{Object.assign(e,{d:v.d,layer:v.layer,t:v.t,star:v.star==='是',link:v.link,remind:v.remind,note:v.note});
          return ['時間線重新排序',v.star==='是'?'已進入工作台「未來」欄':'已移出「未來」欄']},()=>Object.assign(e,b));
      }else{
        const ev={id:nid('EVT'),d:v.d,t:v.t,layer:v.layer,star:v.star==='是',derived:'',link:v.link,remind:v.remind,note:v.note};

function delEvent(id){
  const e=EVT(id);
  if(e.derived){toast('由 <b>'+e.derived+'</b> 推導的承諾事件不可刪除');return}
  const i=DB.events.indexOf(e);
  confirmDelete('事件',`${e.d}　${e.t}`,'',()=>{closeDrawer();
    commit('delete','事件',e.t,()=>{DB.events.splice(i,1);return ['時間線 −1 筆',e.star?'已移出工作台「未來」欄':'']. filter(Boolean)},
      ()=>DB.events.splice(i,0,e));
  });
}
function toggleStar(id,ev){
  ev.stopPropagation(); const e=EVT(id);
  commit('update','事件',`${e.t} ${e.star?'取消標星':'標星'}`,()=>{e.star=!e.star;
    return [e.star?'已加入工作台「未來」欄':'已移出工作台「未來」欄']},()=>{e.star=!e.star});
}
function fulfilEvent(id){
  const e=EVT(id);
  commit('update','承諾事件',e.t+' 已履行',()=>{
    e.done=true;
    const c=DB.commitments.find(c=>e.derived&&e.derived.includes(c.clause)||false);
    return ['標記為已履行，原事件保留為紀錄','承諾工作台寫入一筆自動 log'];
  },()=>{e.done=false});
  if(S.stack.length)paintDrawer();
}

        commit('create','報帳',v.t,()=>{DB.reimb.unshift(r);
          return ['狀態：待送','產生外部報帳連結 yz.app/r/'+Math.random().toString(36).slice(2,8),'核准後會自動寫入帳本']},
          ()=>{DB.reimb=DB.reimb.filter(x=>x.id!==r.id)})}
    }});

function advReimb(id){
  const r=DB.reimb.find(x=>x.id===id), i=RSTEPS.indexOf(r.st);
  if(i>=RSTEPS.length-1){toast('已是最終狀態');return}
  const next=RSTEPS[i+1], before=r.st;
  commit('update','報帳狀態',`${r.t} → ${next}`,()=>{
    r.st=next;
    if(next==='已核'){
      const t={id:nid('TXN'),d:r.d,t:r.t+'（報帳）',p:'公司層級',cat:'場地',amt:-r.amt,pass:false,v:['收據'],note:'由報帳 '+r.id+' 自動產生'};
      DB.txns.unshift(t); r.txn=t.id;
      return [`核准 → <b>自動在帳本產生一筆支出 ${nt(-r.amt)}</b>`,'憑證「收據」一併帶入','本月淨額重算'];
    }
    return [`狀態機前進到 <b>${next}</b>`];
  },()=>{r.st=before; if(r.txn){DB.txns=DB.txns.filter(x=>x.id!==r.txn);r.txn=null}});
}

let SM={open:false,q:'',sel:0,blockId:null,start:0,hits:[]};

function summonHits(q){
  const out=[];q=(q||'').toLowerCase();
  SUMMON.forEach(g=>g.items.forEach(it=>{
    if(!q||it.k.includes(q)||it.nm.toLowerCase().includes(q)||it.ds.toLowerCase().includes(q))out.push({...it,g:g.g});
  }));
  return out;
}
function openSummon(blockId,start,q,rect){
  SM={open:true,q,sel:0,blockId,start,hits:summonHits(q)};
  const el=$('#summon');
  el.classList.add('on');
  const top=Math.min(rect.bottom+6,innerHeight-350),left=Math.min(rect.left,innerWidth-306);
  el.style.top=Math.max(60,top)+'px';el.style.left=Math.max(8,left)+'px';
  paintSummon();
}
function paintSummon(){
  let html='',lg='';
  if(!SM.hits.length)html='<div class="empty" style="padding:18px">沒有符合的 component</div>';
  SM.hits.forEach((h,i)=>{
    if(h.g!==lg){html+=`<div class="summon-g">${h.g}</div>`;lg=h.g}

/* ---- caret 工具 ---- */
function caretOff(el){
  const s=getSelection();if(!s.rangeCount)return 0;
  const r=s.getRangeAt(0).cloneRange();const m=document.createRange();
  m.selectNodeContents(el);m.setEnd(r.endContainer,r.endOffset);
  return m.toString().length;
}
function setCaret(el,off){
  if(!el)return; el.focus();
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n,acc=0;
  while(n=w.nextNode()){
    if(acc+n.length>=off){const r=document.createRange();r.setStart(n,Math.max(0,off-acc));r.collapse(true);
      const s=getSelection();s.removeAllRanges();s.addRange(r);return}
    acc+=n.length;
  }
  const r=document.createRange();r.selectNodeContents(el);r.collapse(false);
  const s=getSelection();s.removeAllRanges();s.addRange(r);
}
function focusB(id,off){
  window._afterRender=()=>{
    const el=document.querySelector(`.eb[data-id="${id}"] .eb-tx`);
    if(el)setCaret(el,off==null?el.innerText.length:off);
    S.curBlock=id;
  };
}
function syncAll(){
  document.querySelectorAll('#doc .eb-tx[data-id]').forEach(el=>{
    const b=bOf(el.dataset.id); if(b&&TEXTY(b.t))b.text=el.innerText.replace(/\n$/,'');
  });
}

/* ---- 鍵盤：Enter / Tab / Backspace / 方向鍵 / # ---- */
function docKey(e){
  const tx=e.target.closest('.eb-tx'); if(!tx)return;
  const id=tx.dataset.id, b=bOf(id); if(!b)return;
  const i=bIdx(id), arr=blks(), off=caretOff(tx), len=tx.innerText.length;

  if(SM.open){
    if(e.key==='ArrowDown'){e.preventDefault();SM.sel=Math.min(SM.sel+1,SM.hits.length-1);paintSummon();return}
    if(e.key==='ArrowUp'){e.preventDefault();SM.sel=Math.max(SM.sel-1,0);paintSummon();return}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();applySummon(SM.sel);return}
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeSummon();return}
  }
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault(); syncAll();
    if(!b.text.trim()&&b.ind>0){b.ind--;render();focusB(id,0);render();return}
    if(!b.text.trim()&&b.t!=='p'){b.t='p';render();focusB(id,0);render();return}
    const before=b.text.slice(0,off),after=b.text.slice(off);
    b.text=before;
    const nt2=(b.t==='h1'||b.t==='h2'||b.t==='h3'||b.t==='quote'||b.t==='code')?'p':b.t;
    const nb={id:newBid(),t:nt2,ind:b.ind,text:after,done:false};
    arr.splice(i+1,0,nb); focusB(nb.id,0); render(); return;
  }
  if(e.key==='Tab'){
    e.preventDefault(); syncAll();
    if(e.shiftKey){ if(b.ind>0)b.ind-- }
    else { const prev=arr[i-1]; const max=prev?Math.min(5,prev.ind+1):0; if(b.ind<max)b.ind++ }
    focusB(id,off); render(); return;
  }
  if(e.key==='Backspace'&&off===0&&!getSelection().toString()){
    syncAll();
    if(b.ind>0){e.preventDefault();b.ind--;focusB(id,0);render();return}
    if(b.t!=='p'){e.preventDefault();b.t='p';focusB(id,0);render();return}
    if(i>0){
      e.preventDefault();
      const prev=arr[i-1];
      if(!TEXTY(prev.t)){ arr.splice(i-1,1); focusB(id,0); render(); return }
      const cut=prev.text.length; prev.text+=b.text; arr.splice(i,1);
      focusB(prev.id,cut); render(); return;
    }
  }
  if(e.key==='ArrowUp'&&off===0){
    for(let k=i-1;k>=0;k--) if(TEXTY(arr[k].t)){e.preventDefault();syncAll();focusB(arr[k].id,arr[k].text.length);render();return}
  }
  if(e.key==='ArrowDown'&&off===len){
    for(let k=i+1;k<arr.length;k++) if(TEXTY(arr[k].t)){e.preventDefault();syncAll();focusB(arr[k].id,0);render();return}
  }
}
function docInput(e){
  const tx=e.target.closest('.eb-tx'); if(!tx)return;
  const b=bOf(tx.dataset.id); if(!b)return;
  b.text=tx.innerText.replace(/\n$/,'');
  const off=caretOff(tx), upto=b.text.slice(0,off);
  const m=upto.match(/(?:^|\s)#([^\s#]{0,24})$/);
  if(m){
    const start=off-m[1].length-1;
    const r=getSelection().getRangeAt(0).getBoundingClientRect();
    const rect=(r.width||r.height)?r:tx.getBoundingClientRect();
    if(!SM.open||SM.blockId!==b.id)openSummon(b.id,start,m[1],rect);
    else{SM.q=m[1];SM.hits=summonHits(m[1]);SM.sel=0;paintSummon()}

/* ---- 套用召喚 ---- */
const TPL={
  standup:{h:'Standup',secs:['Yesterday','Today','Blocker','Need Decision']},
  '1on1':{h:'1:1 檢核',secs:['近況','進展與證據','阻礙','需要公司支持','下次檢核前要做的']},
  meeting:{h:'會議紀錄',secs:['出席','議題','決議','待辦','未解問題']},
  retro:{h:'回顧',secs:['做得好','做不好','下次改什麼']},
  research:{h:'研究筆記',secs:['問題','來源','發現','對我們的意義']}
};
function applySummon(n){
  const h=SM.hits[n]; if(!h)return;
  const b=bOf(SM.blockId),i=bIdx(SM.blockId),arr=blks();
  syncAll();
  // 把 #token 從文字裡拿掉
  const keep=(b.text.slice(0,SM.start)+b.text.slice(SM.start+1+SM.q.length)).replace(/\s+$/,'');
  closeSummon();
  const k=h.k;

  if(TPL[k]){
    const t=TPL[k];
    b.text=keep; if(!keep.trim()){arr.splice(i,1)}
    const at=keep.trim()?i+1:i;
    const nb=[{id:newBid(),t:'h2',ind:b.ind,text:t.h}];
    t.secs.forEach(sx=>{nb.push({id:newBid(),t:'h3',ind:b.ind,text:sx});
                        nb.push({id:newBid(),t:'p',ind:b.ind+1,text:''})});
    arr.splice(at,0,...nb);
    commit('create','日誌模板',t.h,()=>[`展開成 <b>${t.secs.length}</b> 個小標題 + 縮排內文`,'每一行都可直接編輯、Tab 再縮排','標題可以自己增減，這就是一般 Template 的長法']);
    focusB(nb[2].id,0); render(); return;
  }
  if(['h1','h2','h3','p','todo','quote','code'].includes(k)){
    b.t=k;b.text=keep;if(k==='todo')b.done=false;
    focusB(b.id,keep.length);render();return;
  }
  if(k==='divider'){
    b.text=keep;
    const nb={id:newBid(),t:'divider',ind:b.ind,text:''},nb2={id:newBid(),t:'p',ind:b.ind,text:''};
    if(!keep.trim()){arr.splice(i,1,nb,nb2)}else{arr.splice(i+1,0,nb,nb2)}
    focusB(nb2.id,0);render();return;
  }
  // 物件類：開表單，存檔後把這一行變成物件區塊
  b.text=keep;
  summonObject(k,b.id,keep);
  render();
}
function replaceWithObj(blockId,ty,rid){
  const b=bOf(blockId); if(!b)return;
  const arr=blks(),i=bIdx(blockId);
  if(b.text.trim()){
    const nb={id:newBid(),t:'obj',ind:b.ind+0,text:'',obj:{ty,rid}};
    arr.splice(i+1,0,nb);
    const after={id:newBid(),t:'p',ind:b.ind,text:''};arr.splice(i+2,0,after);
    focusB(after.id,0);
  }else{
    b.t='obj';b.obj={ty,rid};
    const after={id:newBid(),t:'p',ind:b.ind,text:''};arr.splice(i+1,0,after);
    focusB(after.id,0);
  }
  render();
}

function insertAt(ch){
  const arr=blks();syncAll();

  if(!TEXTY(last.t)||last.text.trim()){target={id:newBid(),t:'p',ind:0,text:''};arr.push(target)}
  target.text='#';
  focusB(target.id,1);render();
  setTimeout(()=>{const el=document.querySelector(`.eb[data-id="${target.id}"] .eb-tx`);
    if(el){el.focus();setCaret(el,1);const r=el.getBoundingClientRect();openSummon(target.id,0,'',r)}},60);
}
function newDay(){
  openForm({crumb:'日期',title:'新增日誌日期',sub:'',fields:[{k:'d',label:'日期',type:'date',req:true}],values:{d:TODAY},

function calendarView(list){
  const y=2026,mo=8; // 9 月（0-index）
  const first=new Date(Date.UTC(y,mo,1)), start=new Date(first); start.setUTCDate(1-first.getUTCDay());
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);
    const ds=d.toISOString().slice(0,10),out=d.getUTCMonth()!==mo;
    const evs=list.filter(e=>e.d===ds);
    const dues=DB.issues.filter(x=>x.done===ds);
    cells+=`<div class="dc ${out?'out':''} ${ds===TODAY?'today':''}">
      <span class="dn">${d.getUTCDate()}</span>
      ${evs.map(e=>`<span class="ev ${e.layer==='專案'?'p':e.layer==='行政'?'i':''}" onclick="openDrawer('event','${e.id}')">${e.star?'★ ':''}${esc(e.t)}</span>`).join('')}
      ${dues.map(x=>`<span class="ev d" onclick="openDrawer('issue','${x.id}')">✓ ${esc(x.t.slice(0,10))}</span>`).join('')}
    </div>`;
  }
  return `<div class="cal">${['日','一','二','三','四','五','六'].map(x=>`<div class="dh">${x}</div>`).join('')}${cells}</div>
    <div style="height:10px"></div><div class="note">日曆與清單是<b>同一批事件的兩種視圖</b>，不是兩份資料 —— 這是 ClickUp 的核心概念：view 是存起來的設定，不是另一個資料表。</div>`;
}

/* ==================================================================
