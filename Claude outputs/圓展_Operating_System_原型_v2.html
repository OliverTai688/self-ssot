<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圓展 Operating System · 互動原型</title>
<style>
/* ============ tokens ============ */
:root{
  --bg:#0a0c0f;
  --surface:#111418;
  --surface-2:#161a20;
  --surface-3:#1d232b;
  --surface-4:#242b34;
  --border:#232931;
  --border-2:#333b45;
  --border-3:#465060;

  --text:#e9ecf1;
  --text-2:#99a2af;
  --text-3:#626b77;

  --pri:#6cb6ff;
  --pri-dim:#2c6a9e;
  --pri-bg:#11212e;
  --pri-br:#2b557d;

  --ok:#5fd09a;      --ok-bg:#0f2620;
  --warn:#f2b95e;    --warn-bg:#2a2111;
  --danger:#ef8a82;  --danger-bg:#2b1614;
  --info:#a78bf5;    --info-bg:#1c1830;
  --teal:#4fcfc0;    --teal-bg:#0d2724;

  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;

  --rail:78px;
  --rowpad:9px;
  --r:8px;
  --shadow:0 18px 44px rgba(0,0,0,.55);
}
body.compact{--rowpad:5px}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid #6cb6ff;outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a313a;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a424d}
::-webkit-scrollbar-track{background:transparent}

/* ============ shell ============ */
.app{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:48px 1fr;height:100vh;height:100dvh}
.topbar{
  grid-column:1/-1;display:flex;align-items:center;gap:12px;
  padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .mk{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#6cb6ff,#a78bf5);flex:none}
.brand b{font-size:13.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-family:var(--mono);font-size:10.5px;color:var(--text-3);white-space:nowrap}

.omni{
  flex:1;min-width:0;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:8px;
  height:30px;padding:0 10px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:7px;color:var(--text-3);font-size:12.5px;cursor:pointer;transition:.12s;
  white-space:nowrap;overflow:hidden;
}
.omni:hover{border-color:var(--border-3);color:var(--text-2)}
.omni kbd{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--surface-3);border:1px solid var(--border-2);border-radius:4px;padding:1px 5px;color:var(--text-3)}

.tb-right{display:flex;align-items:center;gap:6px;margin-left:auto}
.iconbtn{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--text-3);transition:.12s}
.iconbtn:hover{background:var(--surface-3);color:var(--text)}
.iconbtn.on{background:var(--pri-bg);color:var(--pri)}
.avatar{width:26px;height:26px;border-radius:50%;background:#2b3440;display:grid;place-items:center;font-size:11px;font-weight:650;color:var(--text-2)}

/* rail */
.rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:8px 0;gap:2px;overflow-y:auto;z-index:20}
.rail-i{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;margin:0 6px;
  border-radius:9px;color:var(--text-3);transition:.12s;position:relative;
}
.rail-i:hover{background:var(--surface-2);color:var(--text-2)}
.rail-i.on{background:var(--pri-bg);color:var(--pri)}
.rail-i.on::before{content:"";position:absolute;left:-6px;top:12px;bottom:12px;width:2.5px;border-radius:0 2px 2px 0;background:var(--pri)}
.rail-i svg{width:19px;height:19px;stroke-width:1.6}
.rail-i em{font-style:normal;font-size:10.5px;letter-spacing:.02em;font-weight:500;white-space:nowrap}
.rail-i .bdg{position:absolute;top:5px;right:10px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--danger);color:#1a0e0d;font-size:9.5px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
.rail-sp{flex:1}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);overflow-x:hidden}
.wbhead{padding:14px 20px 0;border-bottom:1px solid var(--border);background:var(--surface)}
.wbtitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.wbtitle h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.015em}
.wbtitle .scn{font-family:var(--mono);font-size:11.5px;color:var(--warn);opacity:.85}
.wbtitle .rule{margin-left:auto;font-size:11px;color:var(--text-3);font-family:var(--mono)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px}
.tab{
  padding:7px 12px 9px;font-size:13px;color:var(--text-3);white-space:nowrap;
  border-bottom:2px solid transparent;transition:.12s;border-radius:5px 5px 0 0;
}
.tab:hover{color:var(--text-2);background:var(--surface-2)}
.tab.on{color:var(--text);border-bottom-color:var(--pri);font-weight:550}
.surface{flex:1;overflow:auto;padding:18px 20px 60px}
.surface-inner{max-width:1180px}

/* ============ primitives ============ */
.sect{margin-bottom:22px}
.sect-h{display:flex;align-items:center;gap:10px;margin:0 0 9px}
.sect-h h2{margin:0;font-size:11px;font-family:var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.sect-h .ln{flex:1;height:1px;background:var(--border)}
.sect-h .act{font-size:12px;color:var(--text-3)}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;row-gap:7px}
.panel-h h3{margin:0;font-size:13px;font-weight:600;white-space:nowrap}
.panel-h .sub{font-size:11.5px;color:var(--text-3);font-family:var(--mono)}
.panel-h .sp{flex:1}
.panel-b{padding:12px 14px}
.panel-b.flush{padding:0}

.g{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g21{grid-template-columns:1.8fr 1fr}
.g12{grid-template-columns:220px 1fr}
@media(max-width:960px){.g2,.g3,.g21,.g12{grid-template-columns:1fr}}

.btn{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:6px;
  border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-2);
  font-size:12.5px;transition:.12s;white-space:nowrap;
}
.btn:hover{background:var(--surface-3);color:var(--text);border-color:var(--border-3)}
.btn.pri{background:var(--pri-bg);border-color:#2d5a7d;color:var(--pri)}
.btn.pri:hover{background:#163044}
.btn.sm{height:24px;padding:0 8px;font-size:11.5px}
.btn svg{width:13px;height:13px;stroke-width:1.8}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px}
.seg button{padding:4px 11px;border-radius:5px;font-size:12.5px;color:var(--text-3);transition:.12s;white-space:nowrap}
.seg button:hover{color:var(--text-2)}
.seg button.on{background:var(--surface-4);color:var(--text);font-weight:550}

/* chips / status */
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;padding:1.5px 6px;border-radius:4px;white-space:nowrap;letter-spacing:.02em}
.c-n{background:var(--surface-3);color:var(--text-2)}
.c-p{background:var(--pri-bg);color:var(--pri)}
.c-o{background:var(--ok-bg);color:var(--ok)}
.c-w{background:var(--warn-bg);color:var(--warn)}
.c-d{background:var(--danger-bg);color:var(--danger)}
.c-i{background:var(--info-bg);color:var(--info)}
.c-t{background:var(--teal-bg);color:var(--teal)}
.dotc{width:6px;height:6px;border-radius:50%;flex:none}

/* rows */
.rows{display:flex;flex-direction:column}
.row{
  display:flex;align-items:center;gap:10px;padding:var(--rowpad) 14px;
  border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;transition:background .1s;
  min-height:0;
}
.rows .row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--pri-bg);box-shadow:inset 2px 0 0 var(--pri)}
.row.flash{animation:flash 1.1s ease}
@keyframes flash{0%,40%{background:#1d3346}100%{background:transparent}}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.row .m{font-family:var(--mono);font-size:11px;color:var(--text-3);white-space:nowrap}
.row .n{font-family:var(--mono);font-size:12px;color:var(--text);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .w{width:var(--w);flex:none}
.star{color:var(--text-3);transition:.12s;flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:4px}
.star:hover{background:var(--surface-3)}
.star.on{color:var(--warn)}
.star svg{width:13px;height:13px}

/* table */
.tbl-wrap{overflow:auto;max-height:none}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.tbl th{
  position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;
  padding:7px 12px;font-size:10.5px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.tbl td{padding:var(--rowpad) 12px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text-2)}
table.tbl td.k{color:var(--text)}
table.tbl td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--text)}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover td{background:var(--surface-2)}
table.tbl tbody tr.sel td{background:var(--pri-bg)}
table.tbl tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--pri)}
table.tbl tbody tr.flash td{animation:flash 1.1s ease}
table.tbl tfoot td{padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--text);background:var(--surface-2);border-top:1px solid var(--border-2)}

/* kpi */
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
.kpi .lb{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3);margin-bottom:5px;display:flex;gap:6px;align-items:center}
.kpi .v{font-family:var(--mono);font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.45}
.meter{height:5px;border-radius:3px;background:var(--surface-4);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:3px;transition:width .4s cubic-bezier(.2,.8,.2,1)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(4,6,9,.5);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40;backdrop-filter:blur(1px)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);
  border-left:1px solid var(--border-2);box-shadow:var(--shadow);z-index:50;
  transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.dr-top{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);min-height:44px}
.crumb{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-3);font-family:var(--mono);overflow:hidden;flex:1}
.crumb b{color:var(--text-2);font-weight:500;cursor:pointer}
.crumb b:hover{color:var(--pri)}
.dr-body{flex:1;overflow:auto;padding:14px}
.dr-h{font-size:15px;font-weight:620;margin:0 0 3px;letter-spacing:-.01em}
.dr-sub{font-family:var(--mono);font-size:11px;color:var(--text-3);margin:0 0 14px}
.fields{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.fld{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:baseline}
.fld .k{width:74px;flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding-top:2px}
.fld .v{flex:1;color:var(--text);min-width:0}
.fld .v .sub{display:block;font-size:11.5px;color:var(--text-3);font-family:var(--mono);margin-top:1px}
.lnk{color:var(--pri);cursor:pointer;border-bottom:1px solid rgba(108,182,255,.3)}
.lnk:hover{border-bottom-color:var(--pri)}
.dr-foot{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}

/* cmdk */
.cmdk-wrap{position:fixed;inset:0;z-index:60;display:none;padding-top:12vh;justify-content:center;background:rgba(4,6,9,.62);backdrop-filter:blur(3px)}
.cmdk-wrap.on{display:flex}
.cmdk{width:min(620px,94vw);max-height:64vh;background:var(--surface);border:1px solid var(--border-2);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.cmdk input{
  width:100%;height:46px;padding:0 16px;background:none;border:none;outline:none;
  color:var(--text);font-size:15px;font-family:var(--sans);border-bottom:1px solid var(--border);
}
.cmdk input::placeholder{color:var(--text-3)}
.cmdk-list{overflow:auto;padding:6px}
.cmdk-g{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);padding:8px 10px 4px}
.cmdk-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer}
.cmdk-i .ic{width:18px;height:18px;border-radius:5px;background:var(--surface-3);display:grid;place-items:center;flex:none;color:var(--text-3)}
.cmdk-i .ic svg{width:11px;height:11px}
.cmdk-i .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdk-i .h{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.cmdk-i.on{background:var(--pri-bg)}
.cmdk-i.on .ic{background:#1d3446;color:var(--pri)}
.cmdk-foot{border-top:1px solid var(--border);padding:7px 12px;display:flex;gap:14px;font-size:11px;color:var(--text-3);font-family:var(--mono)}

/* toast */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--surface-3);border:1px solid var(--border-3);border-radius:8px;
  padding:8px 14px;font-size:12.5px;color:var(--text);box-shadow:var(--shadow);
  animation:tin .25s cubic-bezier(.2,.8,.2,1);max-width:88vw;
}
.toast b{color:var(--pri);font-weight:600}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* journal outline */
.outline{font-size:13.5px;line-height:1.95}
.blk{display:flex;gap:8px;padding:1px 0;border-radius:5px;cursor:pointer;align-items:flex-start}
.blk:hover{background:var(--surface-2)}
.blk.typed{cursor:pointer}
.blk .bul{color:var(--text-3);flex:none;width:12px;text-align:center;font-size:11px;line-height:1.95}
.blk .bd{flex:1;min-width:0}
.blk .meta{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-left:6px}
.ind1{margin-left:20px}.ind2{margin-left:40px}.ind3{margin-left:60px}
.tp{font-family:var(--mono);font-size:11.5px;padding:0 5px;border-radius:4px;margin-right:5px}
.ref{color:var(--pri);font-family:var(--mono);font-size:12.5px}
.cmpt{border:1px solid var(--border-2);border-radius:7px;background:var(--surface-2);padding:8px 11px;margin:4px 0}
.cmpt-h{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.cmpt-h .nm{font-family:var(--mono);font-size:11px;color:var(--pri)}
.cmpt-f{display:flex;gap:8px;font-size:12.5px;padding:2px 0}
.cmpt-f .k{width:92px;flex:none;font-family:var(--mono);font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;padding-top:2px;white-space:nowrap}
.cmpt-f .v{flex:1;color:var(--text)}
.slash{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border-2)}
.slash .lb{font-family:var(--mono);font-size:11px;color:var(--text-3);align-self:center;margin-right:2px}

/* tree */
.tree{font-family:var(--mono);font-size:12.5px;line-height:2.05}
.tree .d{color:var(--pri)}
.tree .f{color:var(--text-2);cursor:pointer;padding:0 3px;border-radius:3px}
.tree .f:hover{background:var(--surface-3);color:var(--text)}
.tree .ok{color:var(--ok)}
.tree .cm{color:var(--text-3)}

/* misc */
.note{font-size:12.5px;color:var(--text-3);line-height:1.7}
.note b{color:var(--text-2)}
.hint{display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-left:2px solid var(--pri);border-radius:6px;padding:9px 12px;font-size:12.5px;color:var(--text-2);line-height:1.65}
.hint.w{border-left-color:var(--warn)}
.hint.i{border-left-color:var(--info)}
.hint b{color:var(--text)}
.empty{padding:28px 14px;text-align:center;color:var(--text-3);font-size:12.5px}
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;font-size:12.5px}
.barrow .nm{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .pc{font-family:var(--mono);font-size:11.5px;color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:4px;background:var(--surface-4);overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:4px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.track .goal{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text-3);opacity:.85}

.gate{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.gate:last-child{border-bottom:none}
.gate .ix{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-family:var(--mono);flex:none}
.gate .ix.y{background:var(--ok-bg);color:var(--ok)}
.gate .ix.n{background:var(--warn-bg);color:var(--warn)}
.gate .tt{flex:1;color:var(--text)}
.gate .mm{font-family:var(--mono);font-size:11px;color:var(--text-3)}

.vouchers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.vch{border:1px solid var(--border-2);border-radius:7px;background:var(--surface-2);padding:8px 6px;text-align:center;cursor:pointer;transition:.12s}
.vch:hover{border-color:var(--pri);background:var(--pri-bg)}
.vch .ty{font-size:11.5px;color:var(--text-2);margin-bottom:2px}
.vch .ex{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.vch .ph{height:34px;border-radius:4px;background:linear-gradient(135deg,#1c222a,#252d38);margin-bottom:6px;display:grid;place-items:center;color:var(--text-3);font-size:9.5px;font-family:var(--mono)}

.docbody{font-size:13px;line-height:1.95;color:var(--text-2)}
.docbody .cl{display:block;padding:6px 9px;border-radius:6px;margin:2px -9px;cursor:pointer;transition:.12s}
.docbody .cl:hover{background:var(--surface-2)}
.docbody .cl.on{background:var(--warn-bg);color:var(--text);box-shadow:inset 2px 0 0 var(--warn)}

function openDrawer(type, id, replace){

}
function peek(type,id){ openDrawer(type,id); }
function drawerBack(){
  if(S.stack.length<=1){ closeDrawer(); return; }
  S.stack.pop(); paintDrawer();
}
function closeDrawer(silent){
  $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on');
  S.stack=[];
  if(!silent){ document.querySelectorAll('.row.sel,tr.sel').forEach(e=>e.classList.remove('sel')); }
}
function paintDrawer(){
  const cur = S.stack[S.stack.length-1];
  const d = DRAWERS[cur.type] ? DRAWERS[cur.type](cur.id) : {title:'—', sub:'', body:'', foot:''};
  $('#crumb').innerHTML = S.stack.map((s,i)=>{
    const label = DRAWERS[s.type] ? (DRAWERS[s.type](s.id).crumb || s.type) : s.type;
    return (i? ' <span>›</span> ':'') + `<b onclick="gotoStack(${i})">${esc(label)}</b>`;
  }).join('');
  $('#drBack').style.visibility = S.stack.length>1 ? 'visible':'hidden';
  $('#drBody').innerHTML = `<h2 class="dr-h">${d.title}</h2><p class="dr-sub">${d.sub||''}</p>${d.body}`;
  $('#drFoot').innerHTML = d.foot || '';
}
function gotoStack(i){ S.stack = S.stack.slice(0,i+1); paintDrawer(); }
function fld(k,v){ return `<div class="fld"><div class="k">${k}</div><div class="v">${v}</div></div>`; }

let cmdkItems=[], cmdkSel=0;
function buildCmdk(){
  const a=[];
  DB.projects.forEach(p=>a.push({g:'專案', t:p.t, h:p.id, ic:'project', run:()=>{S.proj=p.id; nav('project',0);}}));
  DB.issues.forEach(i=>a.push({g:'Issue', t:i.t, h:i.id, ic:'issue', run:()=>{nav('desk',0); openDrawer('issue',i.id);}}));
  DB.txns.forEach(t=>a.push({g:'交易', t:t.t, h:`${t.d} · ${nt(t.amt)}`, ic:'txn', run:()=>{nav('money',0); S.ledgerView='表格'; render(); setTimeout(()=>selectTxn(t.id,true),60);}}));
  DB.commitments.forEach(c=>a.push({g:'承諾', t:c.t, h:c.id, ic:'commit', run:()=>{S.doc=c.doc; S.clause=c.clause; nav('commit', c.dir==='內部'?0:1);}}));
  DB.events.forEach(e=>a.push({g:'時間線', t:e.t, h:e.d, ic:'timeline', run:()=>{nav('timeline',0); openDrawer('event',e.id);}}));
  [['記一筆支出','在日誌新增 #expense block','journal',()=>{nav('journal',0); addBlock('expense');}],
   ['寫今日 Standup','叫出 standup component','journal',()=>{nav('journal',0); toast('Standup component 已在今日日誌頂端');}],
   ['看本月工時','容量 · 週配置','capacity',()=>nav('capacity',0)],
   ['結算獎金','金流 · 人事','money',()=>nav('money',2)],
   ['結案檢查','專案 · Evidence Repo','project',()=>{S.proj='PRJ-2026-004'; nav('project',3);}],
   ['切換密度','舒適 ↔ 緊湊','bolt',()=>toggleDensity()],
   ['開啟設計說明','在每個畫面顯示 UX 規則','bolt',()=>toggleGuide()]
  ].forEach(([t,h,ic,run])=>a.push({g:'動作', t, h, ic, run}));
  return a;
}
function openCmdk(){
  cmdkItems = buildCmdk(); cmdkSel=0;
  $('#cmdkWrap').classList.add('on');
  const inp=$('#cmdkInput'); inp.value=''; filterCmdk(''); setTimeout(()=>inp.focus(),30);
}
function closeCmdk(){ $('#cmdkWrap').classList.remove('on'); }
function filterCmdk(q){
  q=q.trim().toLowerCase();
  const hits = q ? cmdkItems.filter(i=>(i.t+i.h+i.g).toLowerCase().includes(q)) : cmdkItems.slice(0,14);
  window._hits = hits; cmdkSel=Math.min(cmdkSel,Math.max(0,hits.length-1));
  let html='', lastG='';
  hits.slice(0,40).forEach((i,n)=>{
    if(i.g!==lastG){ html+=`<div class="cmdk-g">${i.g}</div>`; lastG=i.g; }
    html+=`<div class="cmdk-i ${n===cmdkSel?'on':''}" onmouseenter="cmdkSel=${n};filterCmdk(document.getElementById('cmdkInput').value)" onclick="runCmdk(${n})">
      <span class="ic">${svg(i.ic,11)}</span><span class="t">${esc(i.t)}</span><span class="h">${esc(i.h)}</span></div>`;
  });
  $('#cmdkList').innerHTML = html || '<div class="empty">沒有符合的物件或動作</div>';
}
function runCmdk(n){ const h=window._hits[n]; if(h){ closeCmdk(); h.run(); } }

document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); $('#cmdkWrap').classList.contains('on')?closeCmdk():openCmdk(); return; }
  if($('#cmdkWrap').classList.contains('on')){
    const hits=window._hits||[];
    if(e.key==='Escape'){ closeCmdk(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); cmdkSel=Math.min(cmdkSel+1,hits.length-1); filterCmdk($('#cmdkInput').value); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); cmdkSel=Math.max(cmdkSel-1,0); filterCmdk($('#cmdkInput').value); }
    else if(e.key==='Enter'){ runCmdk(cmdkSel); }
    return;
  }
  if(e.key==='Escape'){ if(S.stack.length) closeDrawer(); }
  if(e.key==='?' && e.shiftKey){ toggleGuide(); }
});
$('#cmdkInput').addEventListener('input', e=>{ cmdkSel=0; filterCmdk(e.target.value); });

        <div class="docbody" style="padding:12px 14px">${doc.clauses.map(c=>`
          <span class="cl ${c.id===S.clause?'on':''}" onclick="pickClause('${c.id}')">
            <b>${esc(c.ref)}</b>　${esc(c.text)}</span>`).join('')}</div>
      </div>
      <div class="col" style="flex:1">
        <div class="col-h"><span class="ti">履行證據</span>${cm?`<span class="ct">${cm.id}</span>`:''}</div>
        ${cm? `<div style="padding:12px 14px">
            <div style="display:flex;gap:7px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
              <span class="chip ${stc[cm.st]||'c-n'}">${cm.st}</span>
              <span class="chip ${cm.dir==='內部'?'c-i':'c-t'}">${cm.dir}</span>
              <span class="m">Owner ${person(cm.owner)}</span><span class="m">${cm.due}</span></div>
            <div style="font-size:13px;color:var(--text);margin-bottom:12px">${esc(cm.t)}</div>
            <div class="rows" style="border-top:1px solid var(--border)">${cm.logs.map(l=>`
              <div class="row" style="padding-left:0;padding-right:0" onclick="toast('${esc(l.src)}')">
                <span class="chip ${l.ok===true?'c-o':l.ok===false?'c-d':'c-n'}">${l.ok===true?'✓':l.ok===false?'✗':'…'}</span>
                <span class="m" style="width:74px">${l.d}</span>
                <span class="t" style="white-space:normal">${esc(l.t)}<span class="m" style="display:block">${esc(l.src)}</span></span></div>`).join('')}</div>
            <button class="btn" style="margin-top:12px;width:100%" onclick="addLog('${cm.id}')">${svg('plus')} 月度回顧補 log</button>
          </div>`
          : `<div class="empty">這一條尚未建立承諾紀錄。<br><br><button class="btn pri" onclick="toast('已建立承諾紀錄，欄位：編號／承諾日／內容／方向／Owner／狀態／期限／受影響對象／履行證據')">從此條文建立承諾</button></div>`}
      </div>
    </div></div>
    <div style="height:14px"></div>
    ${panel(dir + '承諾總覽','', `<div class="rows" style="margin:-12px -14px">${DB.commitments.filter(c=>c.dir===dir).map(c=>`
      <div class="row ${c.clause===S.clause?'sel':''}" onclick="S.doc='${c.doc}';S.clause='${c.clause}';render()">
        <span class="chip ${stc[c.st]||'c-n'}">${c.st}</span>
        <span class="m" style="width:52px">${c.id}</span><span class="t">${esc(c.t)}</span>
        <span class="m">${person(c.owner)}</span><span class="m" style="width:86px;text-align:right">${c.due}</span>
        <span class="m">${c.logs.length} log</span></div>`).join('')}</div>`)}
    <div style="height:12px"></div>
    <div class="hint i">${svg('bolt',13)}<div><b>有些承諾系統觀測不到。</b>行事曆能證明 1:1 開了，但不能證明「提供了清楚的工作」。該讓人補的就讓人補 —— 誰補的、何時補的，本身就是一筆可稽核的紀錄。</div></div>`;
};
function addLog(id){
  const c = DB.commitments.find(x=>x.id===id);
  c.logs.unshift({d:DB.today, t:'月度回顧：已確認履行', src:'手動 · ' + person('yz'), ok:true});
  render(); toast('已補 log — 手動紀錄會標示來源與補記者，本身也是稽核證據');
}

    <div class="hint" style="margin-top:14px">${svg('bolt',13)}<div>在日誌、工作台、專案、容量四個地方看到的都是<b>這一筆</b>。改這裡等於改全部。</div></div>`,
    foot:`<button class="btn" onclick="peek('project','${i.p}')">${svg('goto')} 開啟專案</button>
          <button class="btn ${i.ev?'pri':''}" onclick="${i.ev?`toast('已標記 Done，Evidence 已連結')`:`toast('被擋下：此 Issue 沒有 Evidence，不得標記 Done（Handbook 03.3）')`}">標記 Done</button>`};
