<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0b0e14}
#root{position:relative;width:1920px;height:1080px;font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;color:#eef1f6}
.clip{position:absolute}
#bg{inset:0;background:radial-gradient(1200px 700px at 30% 20%,#1b2540 0%,#0b0e14 70%)}
#intro{inset:0;display:flex;flex-direction:column;justify-content:center;padding-left:180px}
#intro .k{font-size:30px;letter-spacing:.3em;color:#7aa2ff;font-weight:500}
#intro h1{font-size:120px;font-weight:700;margin:22px 0 26px;letter-spacing:-.01em}
#intro p{font-size:40px;color:#a8b1c2}
#frame{left:120px;top:70px;width:1680px;height:945px;border-radius:18px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6);border:1px solid #2a3142;transform-origin:22% 62%}
#frame video{width:100%;height:100%;display:block}
.cap{left:0;right:0;bottom:44px;display:flex;justify-content:center}
.cap span{background:rgba(8,10,16,.88);border:1px solid #333c52;padding:16px 34px;border-radius:14px;font-size:38px;font-weight:500}
.cap kbd{font-family:inherit;background:#7aa2ff;color:#0b0e14;border-radius:8px;padding:2px 14px;margin:0 6px;font-weight:700}
#chip{left:120px;top:20px;font-size:24px;color:#7aa2ff;letter-spacing:.12em}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12.5" data-width="1920" data-height="1080">
  <div id="bg" class="clip" data-start="0" data-duration="12.5"></div>
  <div id="intro" class="clip" data-start="0" data-duration="2.5">
    <div class="k">日誌教學 · 第 2 章（樣片）</div><h1>開始寫</h1><p>換行、縮排，以及用 # 召喚物件</p>
  </div>
  <div id="chip" class="clip" data-start="2.5" data-duration="10">02 · 開始寫</div>
  <div id="frame" class="clip" data-start="2.5" data-duration="10">
    <video id="v" src="footage.mp4" muted playsinline data-start="2.5" data-duration="10"></video>
  </div>
  <div id="c1" class="clip cap" data-start="3.0" data-duration="2.6"><span>點一下就能寫，像寫筆記一樣直接打字</span></div>
  <div id="c2" class="clip cap" data-start="5.7" data-duration="3.2"><span><kbd>Enter</kbd>換行，<kbd>Tab</kbd>縮排成子項目</span></div>
  <div id="c3" class="clip cap" data-start="9.0" data-duration="3.4"><span>行首打<kbd>#</kbd>，召喚 Standup、會議紀錄、議題等物件</span></div>
</div>
<script>
const tl=gsap.timeline({paused:true});
tl.fromTo("#intro .k",{opacity:0,y:20},{opacity:1,y:0,duration:.5},.1)
  .fromTo("#intro h1",{opacity:0,y:40},{opacity:1,y:0,duration:.6},.25)
  .fromTo("#intro p",{opacity:0,y:20},{opacity:1,y:0,duration:.5},.5)
  .to("#intro",{opacity:0,duration:.3},2.2)
  .fromTo("#frame",{opacity:0,scale:.94},{opacity:1,scale:1,duration:.5},2.5)
  .to("#frame",{scale:1.45,duration:.9,ease:"power2.inOut"},3.2)
  .to("#frame",{scale:1,duration:.8,ease:"power2.inOut"},11.6);
["#c1","#c2","#c3"].forEach((s,i)=>tl.fromTo(s,{opacity:0,y:16},{opacity:1,y:0,duration:.3},[3.0,5.7,9.0][i]));
window.__timelines["main"]=tl;tl.seek(0);
</script>
</body>
</html>
